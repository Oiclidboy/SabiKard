<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,'SF Pro Text','Inter',system-ui,sans-serif;color:var(--text)}body{padding:28px 16px 60px;background:radial-gradient(circle at 15% 8%,hsl(var(--hue) 75% 52%/.36),transparent 35%),radial-gradient(circle at 88% 14%,hsl(calc(var(--hue) + 55) 85% 55%/.25),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2));transition:background 1s var(--ease),color .35s ease}.wrap{max-width:620px;margin:auto}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.4;cursor:default}.brand-row{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;margin-bottom:18px}.logo-stack{position:relative;width:76px;height:76px}.logo-card{position:absolute;width:42px;height:57px;border-radius:13px;border:1px solid var(--line);box-shadow:0 8px 18px #0004;animation:fan .8s var(--spring) both}.logo-card-1{background:linear-gradient(135deg,var(--accent2),#3978d4);transform:translate(-16px,7px) rotate(-16deg);animation-delay:.05s}.logo-card-2{background:linear-gradient(135deg,var(--accent),#4c44c9);transform:translate(0,-8px) rotate(12deg);animation-delay:.15s}.logo-card-3{background:linear-gradient(135deg,#ffb16d,#8c50d9);transform:translate(17px,8px) rotate(20deg);animation-delay:.25s}@keyframes fan{from{opacity:0;transform:translate(0,35px) rotate(0) scale(.55)}to{opacity:1}}.wordmark{font-size:30px;margin:0;font-weight:800}.subtitle,.small{color:var(--dim);font-size:14px}.small{font-size:12px;color:var(--faint)}.glass{position:relative;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 30px #0003;overflow:hidden}.glass:before{content:"";position:absolute;inset:0 0 auto;height:40%;background:linear-gradient(#fff2,transparent);pointer-events:none}.panel{padding:24px}.mode-row,.actions,.row,.history-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mode-row{margin-bottom:18px}.row{justify-content:space-between;margin-top:16px}.mode-chip,.btn,.judge{padding:12px 17px;border-radius:999px;color:var(--text);background:#fff1;border:1px solid transparent;transition:transform .25s var(--spring),background .25s ease,border-color .25s ease}.mode-chip{flex:1;font-weight:700}.mode-chip.active{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}.btn{font-weight:700}.btn-primary{background:var(--text);color:#151022}.btn-danger{background:#ff9aa61c;border-color:#ff9aa655;color:var(--danger)}button:hover{transform:translateY(-1px)}button:active{transform:scale(.97)}.field-label{display:block;margin:14px 0 7px;color:var(--faint);font-size:12px;font-weight:700}input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#08051255;color:var(--text);outline:0;transition:.2s}textarea{min-height:78px;resize:vertical}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}.deck-list,.history-list,.notes-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}.deck-item,.history-item,.note-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:#fff1;border:1px solid #fff1;transition:.25s var(--spring)}.deck-item:hover,.history-item:hover,.note-item:hover{transform:translateY(-1px);background:#fff2}.deck-text,.history-text,.note-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}.remove{background:none;color:var(--faint);text-decoration:underline}.empty{text-align:center;padding:16px;color:var(--faint);font-size:13px}.limit-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;margin:18px 0 8px;border-radius:18px;border:1px solid #ffbd6355;background:#ffbd6318;color:var(--dim);font-size:13px}.pay-panel{padding:16px;border-radius:18px;background:#0002;border:1px solid #fff2}.pay-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #fff2;font-size:13px}.pay-row:last-child{border:0}.pay-label{color:var(--faint)}.redeem{display:flex;gap:8px;margin-top:10px}.redeem input{flex:1}.error{color:var(--danger);font-size:12px;margin-top:8px}.study-head{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;padding:0 6px 12px}.dots{display:flex;gap:6px;padding:0 6px 18px}.dot{width:7px;height:7px;border-radius:50%;background:#fff3}.dot.current{background:var(--text);transform:scale(1.4)}.dot.active{background:var(--accent)}.card-stage{perspective:1500px;min-height:260px;cursor:pointer}.card{min-height:260px;position:relative;transform-style:preserve-3d;transition:transform .65s var(--ease);border-radius:28px}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;backface-visibility:hidden;border-radius:28px;border:1px solid var(--line);background:linear-gradient(135deg,#fff2,#fff0)}.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,#25194f),#352168)}.face-label{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}.face-text{font-size:20px;line-height:1.5}.hint{position:absolute;bottom:17px;color:var(--faint);font-size:12px}.judge-row{display:flex;gap:10px;margin-top:18px}.judge{flex:1;border-color:#fff2}.judge.good{border-color:#70e0aa77;background:#70e0aa1c}.judge.review{border-color:#ffd88a66;background:#ffd88a18}.feedback{padding:14px;margin-top:16px;border-radius:13px;text-align:center;background:#fff1;color:var(--dim)}.options{display:flex;flex-direction:column;gap:10px}.quiz-text{font-size:21px;line-height:1.5}.option{text-align:left;padding:16px;border-radius:16px;background:# eyframes flyc{from{opacity:0;transform:translateY(-220px) rotate(90deg) scale(.4)}to{opacity:1;transform:translateY(-10px) rotate(10deg)}}@keyframes flyr{from{opacity:0;transform:translate(180px,-160px) rotate(50deg) scale(.4)}to{opacity:1;transform:translate(18px,8px) rotate(20deg)}}.splash-word{font-size:36px;font-weight:800;animation:rise .5s var(--ease) .5s both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect}=React;const LIMIT=10,MASTERED=3,PRO_CODE='SABI-7F3K9Q';const KEYS={cards:'sabikard-cards',quiz:'sabikard-quizItems',history:'sabikard-questionHistory',notes:'sabikard-notes',levels:'sabikard-levels',queue:'sabikard-queue',pro:'sabikard-isPro',name:'sabikard-user-name',mode:'sabikard-studyMode',hue:'sabikard-hue'};const GOOD=['Nice one — that\'s sticking.','You\'ve got this.','Exactly right, keep going.','You sabi!'];const REVIEW=['No wahala, that\'s what review is for.','Almost — you\'ll get it next round.','Good instinct to flag it.'];const CORRECT=['Correct — nice work.','Spot on.','Yes! Keep it up.'];const WRONG=['Not quite — now you know for next time.','Close, but that\'s alright.'];
function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function pick(a){return a[Math.floor(Math.random()*a.length)]}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function addHistory(h,x){const t=x.type==='card'?x.front:x.question;return[x,...h.filter(y=>(y.type==='card'?y.front:y.question)!==t)].slice(0,60)}
function spark(e){const n=6;for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'✦':'·';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--dx',(Math.random()*46-23)+'px');s.style.setProperty('--dy',(Math.random()*-42-8)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}function buzz(ms=25){if(navigator.vibrate)try{navigator.vibrate(ms)}catch{}}function Button(p){return <button type="button" {...p} onClick={e=>{spark(e);p.onClick&&p.onClick(e)}}/>}
function Header({name,hue,setHue,setPage,page}){const colors=[270,220,185,145,315],labels={270:'Purple',220:'Blue',185:'Cyan',145:'Neon',315:'Magenta'};return <header><div className="brand-row"><div className="logo-stack"><div className="logo-card logo-card-1"/><div className="logo-card logo-card-2"/><div className="logo-card logo-card-3"/></div><div><h1 className="wordmark">SabiKard</h1><p className="subtitle">{name?'Welcome back, '+name+'!':'Build your own deck, then quiz yourself until it sticks.'}</p></div></div><div className="actions" style={{justifyContent:'center',marginTop:0}}><Button className="btn btn-ghost" onClick={()=>{const n=colors[(colors.indexOf(hue)+1)%colors.length];setHue(n)}}>Colour: {labels[hue]}</Button><Button className="btn btn-ghost" onClick={()=>setPage(page==='notes'?'build':'notes')}>{page==='notes'?'Deck':'Notes'}</Button></div></header>}
function Pro({isPro,open,setOpen}){const[code,setCode]=useState(''),[error,setError]=useState('');if(isPro)return <div className="limit-strip" style={{borderColor:'#70e0aa77',background:'#70e0aa18'}}>✓ Pro unlocked — unlimited cards per deck</div>;return <><div className="limit-strip"><span>Free decks cap at {LIMIT} cards. Pro removes the limit.</span><Button className="btn btn-small btn-ghost" onClick={()=>setOpen(!open)}>{open?'Hide':'Go Pro'}</Button></div>{open&&<div className="pay-panel"><div className="pay-row"><span className="pay-label">Amount</span><b>₦5,000 (one-time)</b></div><div className="pay-row"><span className="pay-label">Bank</span><b>Guarantee Trust Bank</b></div><div className="pay-row"><span className="pay-label">Account</span><b>0567915109</b></div><p className="small">After payment, send proof to henryshub4u@gmail.com for your unlock code.</p><div className="redeem"><input placeholder="Enter code" value={code} onChange={e=>setCode(e.target.value)}/><Button className="btn btn-small btn-primary" disabled={!code.trim()} onClick={()=>{if(code.trim().toUpperCase()===PRO_CODE){save(KEYS.pro,true);location.reload()}else setError('That code does not match.');buzz(80)}}>Unlock</Button></div>{error&&<div className="error">{error}</div>}</div>}</>}
function List({items,type,remove}){return items.length?<div className="deck-list">{items.map((x,i)=><div className="deck-item" key={x.id||i}><span className="deck-text">{i+1}. {type==='card'?x.front:x.question}</span><Button className="remove" onClick={()=>remove(i)}>Remove</Button></div>)}</div>:<div className="empty">No {type==='card'?'cards':'questions'} yet — add your first one above.</div>}
function Builder({mode,setMode,cards,setCards,quiz,setQuiz,history,setHistory,isPro,setPage}){const[front,setFront]=useState(''),[back,setBack]=useState(''),[question,setQuestion]=useState(''),[opts,setOpts]=useState(['','','','']),[correct,setCorrect]=useState(0),[open,setOpen]=useState(false);const limit=!isPro&&(mode==='cards'?cards.length>=LIMIT:quiz.length>=LIMIT);function addCard(){if(!front.trim()||!back.trim()||limit)return;const x={id:uid(),type:'card',front:front.trim(),back:back.trim()};setCards([...cards,x]);setHistory(addHistory(history,x));setFront('');setBack('')}function addQuiz(){if(!question.trim()||opts.some(x=>!x.trim())||limit)return;const x={id:uid(),type:'quiz',question:question.trim(),options:opts.map(x=>x.trim()),correctIndex:correct};setQuiz([...quiz,x]);setHistory(addHistory(history,x));setQuestion('');setOpts(['','','','']);setCorrect(0)}return <div className="glass panel"><div className="mode-row"><Button className={'mode-chip '+(mode==='cards'?'active':'')} onClick={()=>setMode('cards')}>Flashcards</Button><Button className={'mode-chip '+(mode==='quiz'?'active':'')} onClick={()=>setMode('quiz')}>Quiz (4 options)</Button></div><Pro isPro={isPro} open={open} setOpen={setOpen}/>{mode==='cards'?<><label className="field-label">Question / front</label><input value={front} onChange={e=>setFront(e.target.value)} placeholder="e.g. What is the capital of Nigeria?"/><label className="field-label">Answer / back</label><textarea value={back} onChange={e=>setBack(e.target.value)} placeholder="e.g. Abuja"/><div className="actions"><Button className="btn btn-primary" disabled={limit||!front.trim()||!back.trim()} onClick={addCard}>Add card</Button></div><List items={cards} type="card" remove={i=>setCards(cards.filter((_,n)=>n!==i))}/><div className="row"><span className="small">{cards.length} cards {!isPro&&'/ max '+LIMIT}</span><Button className="btn btn-primary" disabled={!cards.length} onClick={()=>dispatchEvent(new Event('study-cards'))}>Study this deck</Button></div></>:<><label className="field-label">Question</label><input value={question} onChange={e=>setQuestion(e.target.value)} placeholder="e.g. Which planet is closest to the sun?"/><label className="field-label">Options — mark the correct answer</label>{opts.map((x,i)=><div style={{display:'flex',gap:8,marginBottom:8}} key={i}><Button className="btn btn-small btn-ghost" onClick={()=>setCorrect(i)}>{correct===i?'✓':'○'}</Button><input value={x} onChange={e=>setOpts(opts.map((v,n)=>n===i?e.target.value:v))} placeholder={'Option '+(i+1)}/></div>)}<div className="actions"><Button className="btn btn-primary" disabled={limit||!question.trim()||opts.some(x=>!x.trim())} onClick={addQuiz}>Add question</Button></div><List items={quiz} type="quiz" remove={i=>setQuiz(quiz.filter((_,n)=>n!==i))}/><div className="row"><span className="small">{quiz.length} questions {!isPro&&'/ max '+LIMIT}</span><Button className="btn btn-primary" disabled={!quiz.length} onClick={()=>dispatchEvent(new Event('study-quiz'))}>Start quiz</Button></div></>}<div className="history"><div className="row" style={{marginTop:0}}><b>Question history</b><Button className="btn btn-small btn-danger" disabled={!history.length} onClick={()=>setHistory([])}>Clear</Button></div><p className="small">Saved on this device for future reuse.</p>{history.length?<div className="history-list">{history.map((x,i)=><div className="history-item" key={x.id||i}><span className="history-text">{x.type==='card'?x.front:x.question}</span><Button className="btn btn-small btn-ghost" onClick={()=>{if(x.type==='card'){setMode('cards');setFront(x.front);setBack(x.back)}else{setMode('quiz');setQuestion(x.question);setOpts(x.options);setCorrect(x.correctIndex)}}}>Reuse</Button><Button className="btn btn-small btn-danger" onClick={()=>setHistory(history.filter((_,n)=>n!==i))}>Delete</Button></div>)}</div>:<div className="empty">Your question history will appear here.</div>}</div></div>}
function Notes({notes,setNotes}){const[title,setTitle]=useState(''),[body,setBody]=useState(''),[editing,setEditing]=useState(null);function saveNote(){if(!title.trim()&&!body.trim())return;const n={id:editing||uid(),title:title.trim()||'Untitled note',body:body.trim(),updated:new Date().toISOString()};setNotes(editing?notes.map(x=>x.id===editing?n:x):[n,...notes]);setTitle('');setBody('');setEditing(null)}function edit(n){setEditing(n.id);setTitle(n.title);setBody(n.body)}return <><div className="glass panel notes-editor"><div className="row" style={{marginTop:0}}><div><h2 style={{margin:0}}>{editing?'Edit note':'Notes'}</h2><p className="small">Keep study notes beside your decks.</p></div><Button className="btn btn-ghost" onClick={()=>{setEditing(null);setTitle('');setBody('')}}>New note</Button></div><label className="field-label">Title</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Note title"/><label className="field-label">Note</label><textarea value={body} onChange={e=>setBody(e.target.value)} placeholder="Write your notes here..."/><div className="actions"><Button className="btn btn-primary" disabled={!title.trim()&&!body.trim()} onClick={saveNote}>{editing?'Save changes':'Save note'}</Button></div></div><div className="glass panel"><b>Saved notes</b>{notes.length?<div className="notes-list">{notes.map(n=><div className="note-item" key={n.id}><div className="note-meta"><span className="note-title">{n.title}</span><span className="note-date">{new Date(n.updated).toLocaleString()}</span><span className="note-text">{n.body}</span></div><Button className="btn btn-small btn-ghost" onClick={()=>edit(n)}>Edit</Button><Button className="btn btn-small btn-danger" onClick={()=>setNotes(notes.filter(x=>x.id!==n.id))}>Delete</Button></div>)}</div>:<div className="empty">No notes yet.</div>}</div></>}
function Cards({cards,levels,setLevels,queue,setQueue,finish}){const[flip,setFlip]=useState(false),[busy,setBusy]=useState(false),[misses,setMisses]=useState(0),[message,setMessage]=useState('');const valid=queue.filter(i=>Number.isInteger(i)&&i>=0&&i<cards.length),current=valid[0];useEffect(()=>{if(valid.length!==queue.length)setQueue(valid)},[cards.length,queue.join(',')]);if(!cards.length)return <div className="glass panel">No cards available.</div>;if(current===undefined)return <div className="glass panel summary"><p className="subtitle">Study session complete</p><div className="stats"><div className="stat good"><b>{cards.length-misses}</b><span className="small">mastered</span></div><div className="stat review"><b>{misses}</b><span className="small">misses</span></div></div><Button className="btn btn-primary" onClick={()=>{setLevels(Array(cards.length).fill(0));setQueue(cards.map((_,i)=>i));setMisses(0)}}>Study again</Button><Button className="btn btn-ghost" onClick={finish}>Edit deck</Button></div>;const item=cards[current],level=levels[current]||0;function judge(ok){if(busy)return;setBusy(true);if(!ok)buzz(70);const nl=[...levels],nq=valid.slice(1);nl[current]=ok?Math.min(level+1,MASTERED):Math.max(0,level-1);if(!ok||nl[current]<MASTERED)nq.push(current);setLevels(nl);setQueue(nq);setMessage(pick(ok?GOOD:REVIEW));setTimeout(()=>{setFlip(false);setBusy(false);setMessage('')},650)}return <div className="glass panel"><div className="study-head"><span>{valid.length} cards left</span><span>{level===0?'New':level===1?'Learning':'Almost there'}</span></div><div className="dots">{cards.map((_,i)=><span className={'dot '+(i===current?'current':valid.includes(i)?'active':'')} key={i}/>)}</div><div className="card-stage" onClick={()=>!busy&&setFlip(!flip)}><div className={'card '+(flip?'flipped':'')}><div className="face"><div className="face-label">Question</div><div className="face-text">{item.front}</div><div className="hint">Tap to reveal</div></div><div className="face back"><div className="face-label">Answer</div><div className="face-text">{item.back}</div></div></div></div>{flip&&<><div className="judge-row"><Button className="judge good" disabled={busy} onClick={e=>{e.stopPropagation();judge(true)}}>I got it</Button><Button className="judge review" disabled={busy} onClick={e=>{e.stopPropagation();judge(false)}}>Need review</Button></div>{message&&<div className="feedback">{message}</div>}</>}</div>}
function Quiz({items,finish}){const[i,setI]=useState(0),[score,setScore]=useState(0),[selected,setSelected]=useState(null),[message,setMessage]=useState(''),x=items[i];if(!x)return null;function choose(n){if(selected!==null)return;const ok=n===x.correctIndex;setSelected(n);setMessage(pick(ok?CORRECT:WRONG));if(!ok)buzz(70);if(ok)setScore(score+1)}function next(){if(i+1<items.length){setI(i+1);setSelected(null);setMessage('')}else finish(score+(selected===x.correctIndex?1:0))}return <div className={'glass panel '+(selected!==null&&selected!==x.correctIndex?'wrong-answer':'')}><div className="study-head"><span>Question {i+1} of {items.length}</span><span>{score} correct</span></div><div className="quiz-text">{x.question}</div><div className="options">{x.options.map((o,n)=><button className={'option '+(selected!==null?(n===x.correctIndex?'correct':n===selected?'wrong':''):'')} disabled={selected!==null} onClick={()=>choose(n)} key={n}>{o}</button>)}</div>{selected!==null&&<div className="feedback"><span>{message}</span><Button className="btn btn-primary" onClick={next}>{i+1<items.length?'Next question':'See results'}</Button></div>}</div>}
function App(){const[mode,setMode]=useState(load(KEYS.mode,'cards')),[cards,setCards]=useState(load(KEYS.cards,[])),[quiz,setQuiz]=useState(load(KEYS.quiz,[])),[history,setHistory]=useState(load(KEYS.history,[])),[notes,setNotes]=useState(load(KEYS.notes,[])),[levels,setLevels]=useState([]),[queue,setQueue]=useState([]),[status,setStatus]=useState('build'),[pro,setPro]=useState(load(KEYS.pro,false)),[name,setName]=useState(load(KEYS.name,'')),[draft,setDraft]=useState(load(KEYS.name,'')),[splash,setSplash]=useState(true),[hue,setHue]=useState(load(KEYS.hue,270)),[page,setPage]=useState('build'),[result,setResult]=useState(null);useEffect(()=>{document.documentElement.style.setProperty('--hue',hue);save(KEYS.hue,hue)},[hue]);useEffect(()=>{save(KEYS.mode,mode);save(KEYS.cards,cards);save(KEYS.quiz,quiz);save(KEYS.history,history);save(KEYS.notes,notes);save(KEYS.pro,pro)},[mode,cards,quiz,history,notes,pro]);useEffect(()=>{const t=setTimeout(()=>setSplash(false),1800);return()=>clearTimeout(t)},[]);useEffect(()=>{const a=()=>{if(cards.length){setLevels(Array(cards.length).fill(0));setQueue(cards.map((_,i)=>i));setStatus('cards')}};const b=()=>{if(quiz.length)setStatus('quiz')};addEventListener('study-cards',a);addEventListener('study-quiz',b);return()=>{removeEventListener('study-cards',a);removeEventListener('study-quiz',b)}},[cards,quiz]);function clear(){setCards([]);setQuiz([]);setHistory([]);setLevels([]);setQueue([]);setStatus('build');[KEYS.cards,KEYS.quiz,KEYS.history,KEYS.levels,KEYS.queue].forEach(k=>localStorage.removeItem(k))}if(!name.trim())return <div className="wrap"><Header name="" hue={hue} setHue={setHue} setPage={setPage} page={page}/><div className="glass panel"><p className="subtitle">Welcome to SabiKard</p><h2>What should we call you?</h2><input placeholder="Enter your name" value={draft} onChange={e=>setDraft(e.target.value)}/><div className="actions"><Button className="btn btn-primary" disabled={!draft.trim()} onClick={()=>{setName(draft.trim());save(KEYS.name,draft.trim())}}>Continue</Button></div></div></div>;if(splash)return <div className="splash"><div className="splash-stack"><div className="splash-card"/><div className="splash-card"/><div className="splash-card"/></div><div className="splash-word">SabiKard</div></div>;const header=<Header name={name} hue={hue} setHue={setHue} setPage={setPage} page={page}/>;if(page==='notes')return <div className="wrap">{header}<Notes notes={notes} setNotes={setNotes}/></div>;if(status==='cards')return <div className="wrap">{header}<Cards cards={cards} levels={levels} setLevels={setLevels} queue={queue} setQueue={setQueue} finish={()=>setStatus('build')}/></div>;if(status==='quiz')return <div className="wrap">{header}<Quiz items={quiz} finish={n=>{setResult(n);setStatus('result')}}/></div>;if(status==='result')return <div className="wrap">{header}<div className="glass panel summary"><h2>Quiz complete</h2><div className="stats"><div className="stat good"><b>{result}</b><span className="small">correct</span></div><div className="stat review"><b>{quiz.length-result}</b><span className="small">missed</span></div></div><p className="subtitle">{result===quiz.length?'Perfect score — you sabi!':'Keep reviewing and try again.'}</p><div className="actions"><Button className="btn btn-primary" onClick={()=>setStatus('quiz')}>Retake quiz</Button><Button className="btn btn-ghost" onClick={()=>setStatus('build')}>Edit deck</Button></div></div></div>;return <div className="wrap">{header}<Builder mode={mode} setMode={setMode} cards={cards} setCards={setCards} quiz={quiz} setQuiz={setQuiz} history={history} setHistory={setHistory} isPro={pro} setPage={setPage}/><div className="row"><span/><Button className="btn btn-ghost" onClick={clear}>Clear deck & start over</Button></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
