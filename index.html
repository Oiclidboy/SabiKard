<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SabiKard</title>
<style>
:root{--bg:#101730;--panel:rgba(255,255,255,.12);--panel2:rgba(255,255,255,.18);--line:rgba(255,255,255,.28);--text:#f5f6fa;--muted:rgba(245,246,250,.7);--accent:#7de0d3;--good:#6fe0a8;--bad:#ff9e9e}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px 60px;font-family:system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#7c5cff 0,transparent 45%),radial-gradient(circle at 85% 15%,#37c6d9 0,transparent 50%),var(--bg)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:default}.wrap{max-width:620px;margin:auto}header{text-align:center;margin-bottom:24px}.brand{font-size:32px;font-weight:800;margin:0}.sub{color:var(--muted);margin:6px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;backdrop-filter:blur(22px)}.tabs{display:flex;gap:8px}.tab,.ghost,.primary,.danger{padding:12px 18px;border-radius:999px;color:var(--text);background:rgba(255,255,255,.12)}.tab.active,.primary{background:var(--accent);color:#102c32;font-weight:700}.ghost{border:1px solid var(--line)}.danger{color:#ffd1d1}.label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:12px 0 6px}input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.2);color:var(--text);outline:0}textarea{min-height:76px;resize:vertical}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.list{display:grid;gap:8px;margin-top:12px}.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:13px;background:rgba(255,255,255,.1)}.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{font-size:12px;color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:14px}.card{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:28px}.answer{margin-top:14px;color:var(--accent);font-size:18px}.options{display:grid;gap:10px;margin-top:18px}.option{text-align:left;border-radius:14px;padding:14px;background:rgba(255,255,255,.12);color:var(--text);border:1px solid var(--line)}.option.correct{background:rgba(111,224,168,.25);border-color:var(--good)}.option.wrong{background:rgba(255,158,158,.25);border-color:var(--bad)}.notice{padding:12px;border-radius:13px;background:rgba(125,224,211,.12);color:var(--muted);margin-top:12px}.history-title{margin:0}.history-section{margin-top:18px}.history-section h3{font-size:15px;margin:0;color:var(--muted)}
</style>
</head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const KEYS={cards:'sabikard-cards',quiz:'sabikard-quizItems',history:'sabikard-questionHistory',mode:'sabikard-studyMode'};
const load=(key,fallback)=>{try{const value=localStorage.getItem(key);return value===null?fallback:JSON.parse(value)}catch{return fallback}};
const save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function addHistory(history,entry){const key=entry.type==='card'?entry.front:entry.question;const next=[entry,...history.filter(item=>!(item.type===entry.type&&(item.front||item.question)===key))];return next.slice(0,100)}
function Builder({mode,setMode,cards,setCards,quiz,setQuiz,history,setHistory}){
 const [front,setFront]=useState(''),[back,setBack]=useState(''),[question,setQuestion]=useState(''),[options,setOptions]=useState(['','','','']),[correct,setCorrect]=useState(0);
 const addCard=()=>{if(!front.trim()||!back.trim())return;const item={id:uid(),front:front.trim(),back:back.trim()};setCards([...cards,item]);setHistory(addHistory(history,item));setFront('');setBack('')};
 const addQuestion=()=>{if(!question.trim()||options.some(x=>!x.trim()))return;const item={id:uid(),question:question.trim(),options:options.map(x=>x.trim()),correctIndex:correct};setQuiz([...quiz,item]);setHistory(addHistory(history,item));setQuestion('');setOptions(['','','','']);setCorrect(0)};
 const useHistory=(item)=>{if(item.type==='card'){setMode('cards');setFront(item.front);setBack(item.back)}else{setMode('quiz');setQuestion(item.question);setOptions(item.options);setCorrect(item.correctIndex)}};
 const removeHistory=(i)=>setHistory(history.filter((_,index)=>index!==i));
 return <><div className="panel"><div className="tabs"><button className={'tab '+(mode==='cards'?'active':'')} onClick={()=>setMode('cards')}>Flashcards</button><button className={'tab '+(mode==='quiz'?'active':'')} onClick={()=>setMode('quiz')}>Quiz</button></div>{mode==='cards'?<><label className="label">Question / front</label><input value={front} onChange={e=>setFront(e.target.value)} placeholder="e.g. What is the capital of Nigeria?"/><label className="label">Answer / back</label><textarea value={back} onChange={e=>setBack(e.target.value)} placeholder="e.g. Abuja"/><div className="actions"><button className="primary" onClick={addCard} disabled={!front.trim()||!back.trim()}>Add card</button></div><div className="list">{cards.length?cards.map((x,i)=><div className="item" key={x.id}><span>{i+1}. {x.front}</span><button className="ghost" onClick={()=>setCards(cards.filter((_,n)=>n!==i))}>Remove</button></div>):<div className="empty">No cards yet — add your first question.</div>}</div><div className="actions"><button className="primary" disabled={!cards.length} onClick={()=>window.dispatchEvent(new Event('study-cards'))}>Study this deck</button></div></>:<><label className="label">Question</label><input value={question} onChange={e=>setQuestion(e.target.value)} placeholder="Write a multiple-choice question"/><label className="label">Options — choose the correct one</label>{options.map((value,i)=><div className="row" key={i} style={{marginBottom:8}}><button className="tab" onClick={()=>setCorrect(i)} aria-label={'Mark option '+(i+1)+' correct'}>{correct===i?'✓':'○'}</button><input value={value} onChange={e=>setOptions(options.map((x,n)=>n===i?e.target.value:x))} placeholder={'Option '+(i+1)}/></div>)}<div className="actions"><button className="primary" onClick={addQuestion} disabled={!question.trim()||options.some(x=>!x.trim())}>Add question</button></div><div className="list">{quiz.length?quiz.map((x,i)=><div className="item" key={x.id}><span>{i+1}. {x.question}</span><button className="ghost" onClick={()=>setQuiz(quiz.filter((_,n)=>n!==i))}>Remove</button></div>):<div className="empty">No questions yet — add your first one.</div>}</div><div className="actions"><button className="primary" disabled={!quiz.length} onClick={()=>window.dispatchEvent(new Event('study-quiz'))}>Start quiz</button></div></>}</div><div className="panel"><div className="row"><h2 className="history-title">Question history</h2><button className="danger" onClick={()=>setHistory([])} disabled={!history.length}>Clear history</button></div><p className="small">Saved on this device when you add a card or question. Reuse any item below.</p>{history.length?<div className="list">{history.map((item,i)=><div className="item" key={item.id||i}><span>{item.type==='card'?item.front:item.question}</span><button className="ghost" onClick={()=>useHistory(item)}>Reuse</button><button className="danger" onClick={()=>removeHistory(i)}>Delete</button></div>)}</div>:<div className="empty">Your question history will appear here.</div>}</div></>;
}
function Cards({cards,finish}){const [index,setIndex]=useState(0),[flipped,setFlipped]=useState(false);const item=cards[index];return <div className="panel"><div className="row"><span>{index+1} of {cards.length}</span><button className="ghost" onClick={finish}>Edit deck</button></div><button className="panel card" onClick={()=>setFlipped(!flipped)}><div><div className="small">{flipped?'Answer':'Question'}</div>{flipped?<div className="answer">{item.back}</div>:item.front}<div className="small" style={{marginTop:24}}>Tap to {flipped?'hide answer':'reveal answer'}</div></div></button><div className="actions"><button className="primary" onClick={()=>{setIndex((index+1)%cards.length);setFlipped(false)}}>{index+1===cards.length?'Restart':'Next card'}</button></div></div>}
function Quiz({quiz,finish}){const [index,setIndex]=useState(0),[score,setScore]=useState(0),[selected,setSelected]=useState(null);const item=quiz[index];const choose=i=>{if(selected!==null)return;setSelected(i);if(i===item.correctIndex)setScore(score+1)};const next=()=>{if(index+1===quiz.length)finish(score+(selected===item.correctIndex?0:0));else{setIndex(index+1);setSelected(null)}};return <div className="panel"><div className="row"><span>Question {index+1} of {quiz.length}</span><span>{score} correct</span></div><h2>{item.question}</h2><div className="options">{item.options.map((option,i)=><button key={i} className={'option '+(selected!==null?(i===item.correctIndex?'correct':i===selected?'wrong':''):'')} onClick={()=>choose(i)}>{option}</button>)}</div>{selected!==null&&<div className="actions"><button className="primary" onClick={next}>{index+1===quiz.length?'See results':'Next question'}</button></div>}</div>}
function App(){const [mode,setMode]=useState(load(KEYS.mode,'cards')), [cards,setCards]=useState(load(KEYS.cards,[])),[quiz,setQuiz]=useState(load(KEYS.quiz,[])),[history,setHistory]=useState(load(KEYS.history,[])),[screen,setScreen]=useState('build'),[result,setResult]=useState(null);useEffect(()=>save(KEYS.mode,mode),[mode]);useEffect(()=>save(KEYS.cards,cards),[cards]);useEffect(()=>save(KEYS.quiz,quiz),[quiz]);useEffect(()=>save(KEYS.history,history),[history]);useEffect(()=>{const cardsEvent=()=>setScreen('cards'),quizEvent=()=>setScreen('quiz');addEventListener('study-cards',cardsEvent);addEventListener('study-quiz',quizEvent);return()=>{removeEventListener('study-cards',cardsEvent);removeEventListener('study-quiz',quizEvent)}},[]);if(screen==='cards')return <main className="wrap"><header><h1 className="brand">SabiKard</h1><p className="sub">Active recall, one question at a time.</p></header><Cards cards={cards} finish={()=>setScreen('build')}/></main>;if(screen==='quiz')return <main className="wrap"><header><h1 className="brand">SabiKard</h1></header><Quiz quiz={quiz} finish={score=>{setResult(score);setScreen('result')}}/></main>;if(screen==='result')return <main className="wrap"><header><h1 className="brand">Quiz complete</h1><p className="sub">You scored {result} out of {quiz.length}.</p></header><div className="panel actions"><button className="primary" onClick={()=>setScreen('quiz')}>Retake quiz</button><button className="ghost" onClick={()=>setScreen('build')}>Edit deck</button></div></main>;return <main className="wrap"><header><h1 className="brand">SabiKard</h1><p className="sub">Build your own deck, then practise until it sticks.</p></header><Builder mode={mode} setMode={setMode} cards={cards} setCards={setCards} quiz={quiz} setQuiz={setQuiz} history={history} setHistory={setHistory}/></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
