<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SabiKard</title>
<style>
:root{--bg:#100b24;--bg2:#241044;--panel:rgba(255,255,255,.1);--panel2:rgba(255,255,255,.16);--line:rgba(255,255,255,.24);--text:#f8f5ff;--muted:rgba(248,245,255,.7);--accent:#9d8cff;--good:#72e0aa;--bad:#ff9caa}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px 60px;font-family:system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,#3d1f70 0,transparent 38%),radial-gradient(circle at 88% 12%,#26135a 0,transparent 42%),linear-gradient(145deg,var(--bg),var(--bg2));transition:background .25s,color .25s}body.light{--bg:#eeeaff;--bg2:#c7b9ed;--panel:rgba(255,255,255,.48);--panel2:rgba(255,255,255,.7);--line:rgba(45,25,90,.2);--text:#20143d;--muted:rgba(32,20,61,.7);--accent:#6448c7;--good:#168052;--bad:#b92f4c;background:linear-gradient(145deg,var(--bg),var(--bg2))}.wrap{max-width:650px;margin:auto}header{text-align:center;margin-bottom:22px}.brand{font-size:32px;font-weight:800;margin:0}.sub{color:var(--muted);margin:6px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;backdrop-filter:blur(22px)}.tabs{display:flex;gap:8px}.tab,.ghost,.primary,.danger{padding:11px 16px;border-radius:999px;color:var(--text);background:var(--panel2);border:1px solid var(--line)}.tab.active,.primary{background:var(--accent);color:#fff;font-weight:700}.light .tab.active,.light .primary{color:#fff}.label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:12px 0 6px}input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.2);color:var(--text);outline:0}body.light input,body.light textarea{background:rgba(255,255,255,.45)}textarea{min-height:76px;resize:vertical}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.list{display:grid;gap:8px;margin-top:12px}.item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:13px;background:var(--panel2)}.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.small{font-size:12px;color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:14px}.card{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:28px}.answer{margin-top:14px;color:var(--accent);font-size:18px}.options{display:grid;gap:10px;margin-top:18px}.option{text-align:left;border-radius:14px;padding:14px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}.option.correct{background:rgba(114,224,170,.25);border-color:var(--good)}.option.wrong{background:rgba(255,156,170,.25);border-color:var(--bad)}.notice{padding:12px;border-radius:13px;background:rgba(157,140,255,.15);color:var(--muted);margin-top:12px}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.file-input{display:none}.history-title{margin:0}.history-section h3{font-size:15px;margin:18px 0 0;color:var(--muted)}button:disabled{opacity:.45;cursor:default}
</style>
</head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const KEYS={cards:'sabikard-cards',quiz:'sabikard-quizItems',history:'sabikard-questionHistory',theme:'sabikard-theme',mode:'sabikard-studyMode'};
const load=(key,fallback)=>{try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v)}catch{return fallback}};
const save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function addHistory(history,item){const text=item.type==='card'?item.front:item.question;return [item,...history.filter(x=>(x.type==='card'?x.front:x.question)!==text)].slice(0,100)}
function Builder({mode,setMode,cards,setCards,quiz,setQuiz,history,setHistory}){const [front,setFront]=useState(''),[back,setBack]=useState(''),[question,setQuestion]=useState(''),[options,setOptions]=useState(['','','','']),[correct,setCorrect]=useState(0);const addCard=()=>{if(!front.trim()||!back.trim())return;const x={id:uid(),type:'card',front:front.trim(),back:back.trim()};setCards([...cards,x]);setHistory(addHistory(history,x));setFront('');setBack('')};const addQuestion=()=>{if(!question.trim()||options.some(x=>!x.trim()))return;const x={id:uid(),type:'quiz',question:question.trim(),options:options.map(x=>x.trim()),correctIndex:correct};setQuiz([...quiz,x]);setHistory(addHistory(history,x));setQuestion('');setOptions(['','','','']);setCorrect(0)};const reuse=x=>{setMode(x.type==='card'?'cards':'quiz');if(x.type==='card'){setFront(x.front);setBack(x.back)}else{setQuestion(x.question);setOptions(x.options);setCorrect(x.correctIndex)}};return <><div className="panel"><div className="tabs"><button className={'tab '+(mode==='cards'?'active':'')} onClick={()=>setMode('cards')}>Flashcards</button><button className={'tab '+(mode==='quiz'?'active':'')} onClick={()=>setMode('quiz')}>Quiz</button></div>{mode==='cards'?<><label className="label">Question / front</label><input value={front} onChange={e=>setFront(e.target.value)} placeholder="e.g. What is the capital of Nigeria?"/><label className="label">Answer / back</label><textarea value={back} onChange={e=>setBack(e.target.value)} placeholder="e.g. Abuja"/><div className="actions"><button className="primary" onClick={addCard} disabled={!front.trim()||!back.trim()}>Add card</button></div><List items={cards} type="card" remove={i=>setCards(cards.filter((_,n)=>n!==i))}/><div className="actions"><button className="primary" disabled={!cards.length} onClick={()=>window.dispatchEvent(new Event('study-cards'))}>Study this deck</button></div></>:<><label className="label">Question</label><input value={question} onChange={e=>setQuestion(e.target.value)} placeholder="Write a multiple-choice question"/><label className="label">Options — tap the circle to mark the answer</label>{options.map((v,i)=><div className="row" style={{marginBottom:8}} key={i}><button className="tab" onClick={()=>setCorrect(i)}>{correct===i?'✓':'○'}</button><input value={v} onChange={e=>setOptions(options.map((x,n)=>n===i?e.target.value:x))} placeholder={'Option '+(i+1)}/></div>)}<div className="actions"><button className="primary" onClick={addQuestion} disabled={!question.trim()||options.some(x=>!x.trim())}>Add question</button></div><List items={quiz} type="quiz" remove={i=>setQuiz(quiz.filter((_,n)=>n!==i))}/><div className="actions"><button className="primary" disabled={!quiz.length} onClick={()=>window.dispatchEvent(new Event('study-quiz'))}>Start quiz</button></div></>}</div><div className="panel"><div className="row"><h2 className="history-title">Question history</h2><button className="danger" disabled={!history.length} onClick={()=>setHistory([])}>Clear history</button></div><p className="small">Saved on this device. Reuse any question in a future deck.</p>{history.length?<div className="list">{history.map((x,i)=><div className="item" key={x.id||i}><span>{x.type==='card'?x.front:x.question}</span><button className="ghost" onClick={()=>reuse(x)}>Reuse</button><button className="danger" onClick={()=>setHistory(history.filter((_,n)=>n!==i))}>Delete</button></div>)}</div>:<div className="empty">Your question history will appear here.</div>}</div></>}
function List({items,type,remove}){return items.length?<div className="list">{items.map((x,i)=><div className="item" key={x.id}><span>{i+1}. {type==='card'?x.front:x.question}</span><button className="ghost" onClick={()=>remove(i)}>Remove</button></div>)}</div>:<div className="empty">No {type==='card'?'cards':'questions'} yet — add your first one.</div>}
function Cards({cards,finish}){const [i,setI]=useState(0),[flip,setFlip]=useState(false),x=cards[i];return <div className="panel"><div className="row"><span>{i+1} of {cards.length}</span><button className="ghost" onClick={finish}>Edit deck</button></div><button className="panel card" onClick={()=>setFlip(!flip)}><div><div className="small">{flip?'Answer':'Question'}</div>{flip?<div className="answer">{x.back}</div>:x.front}<div className="small" style={{marginTop:24}}>Tap to {flip?'hide answer':'reveal answer'}</div></div></button><div className="actions"><button className="primary" onClick={()=>{setI((i+1)%cards.length);setFlip(false)}}>{i+1===cards.length?'Restart':'Next card'}</button></div></div>}
function Quiz({quiz,finish}){const [i,setI]=useState(0),[score,setScore]=useState(0),[selected,setSelected]=useState(null),x=quiz[i];const choose=n=>{if(selected!==null)return;setSelected(n);if(n===x.correctIndex)setScore(score+1)};const next=()=>i+1===quiz.length?finish(score+(selected===x.correctIndex?0:0)):(setI(i+1),setSelected(null));return <div className="panel"><div className="row"><span>Question {i+1} of {quiz.length}</span><span>{score} correct</span></div><h2>{x.question}</h2><div className="options">{x.options.map((o,n)=><button key={n} className={'option '+(selected!==null?(n===x.correctIndex?'correct':n===selected?'wrong':''):'')} onClick={()=>choose(n)}>{o}</button>)}</div>{selected!==null&&<div className="actions"><button className="primary" onClick={next}>{i+1===quiz.length?'See results':'Next question'}</button></div>}</div>}
function DataTools({cards,quiz,history,setCards,setQuiz,setHistory}){const [message,setMessage]=useState('');const exportData=()=>{const blob=new Blob([JSON.stringify({version:1,cards,quiz,history},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sabikard-deck.json';a.click();URL.revokeObjectURL(url);setMessage('Deck and history exported.')};const importData=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.cards)||!Array.isArray(d.quiz)||!Array.isArray(d.history))throw Error();setCards(d.cards);setQuiz(d.quiz);setHistory(d.history);setMessage('Deck and history imported.')}catch{setMessage('That file is not a valid SabiKard export.')}e.target.value=''};reader.readAsText(file)};return <div className="panel"><div className="row"><div><h2 style={{margin:'0 0 4px'}}>Backup</h2><span className="small">Move your cards and history between devices.</span></div><div className="toolbar"><button className="primary" onClick={exportData}>Export</button><label className="ghost">Import<input className="file-input" type="file" accept="application/json" onChange={importData}/></label></div></div>{message&&<div className="notice">{message}</div>}</div>}
function App(){const [mode,setMode]=useState(load(KEYS.mode,'cards')),[cards,setCards]=useState(load(KEYS.cards,[])),[quiz,setQuiz]=useState(load(KEYS.quiz,[])),[history,setHistory]=useState(load(KEYS.history,[])),[theme,setTheme]=useState(load(KEYS.theme,'dark')),[screen,setScreen]=useState('build'),[result,setResult]=useState(null);useEffect(()=>{document.body.classList.toggle('light',theme==='light');save(KEYS.theme,theme)},[theme]);useEffect(()=>save(KEYS.mode,mode),[mode]);useEffect(()=>save(KEYS.cards,cards),[cards]);useEffect(()=>save(KEYS.quiz,quiz),[quiz]);useEffect(()=>save(KEYS.history,history),[history]);useEffect(()=>{const a=()=>setScreen('cards'),b=()=>setScreen('quiz');addEventListener('study-cards',a);addEventListener('study-quiz',b);return()=>{removeEventListener('study-cards',a);removeEventListener('study-quiz',b)}},[]);const head=<header><h1 className="brand">SabiKard</h1><p className="sub">Active recall, one question at a time.</p><div className="toolbar"><button className="ghost" onClick={()=>setTheme(theme==='dark'?'light':'dark')}>{theme==='dark'?'☀ Light mode':'☾ Dark mode'}</button></div></header>;if(screen==='cards')return <main className="wrap">{head}<Cards cards={cards} finish={()=>setScreen('build')}/></main>;if(screen==='quiz')return <main className="wrap">{head}<Quiz quiz={quiz} finish={n=>{setResult(n);setScreen('result')}}/></main>;if(screen==='result')return <main className="wrap">{head}<div className="panel"><h2>Quiz complete</h2><p className="sub">You scored {result} out of {quiz.length}.</p><div className="actions"><button className="primary" onClick={()=>setScreen('quiz')}>Retake quiz</button><button className="ghost" onClick={()=>setScreen('build')}>Edit deck</button></div></div></main>;return <main className="wrap">{head}<Builder mode={mode} setMode={setMode} cards={cards} setCards={setCards} quiz={quiz} setQuiz={setQuiz} history={history} setHistory={setHistory}/><DataTools cards={cards} quiz={quiz} history={history} setCards={setCards} setQuiz={setQuiz} setHistory={setHistory}/></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
