<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SabiKard</title>
<style>
:root{--hue:270;--bg:#120b24;--bg2:#261052;--panel:rgba(255,255,255,.1);--line:rgba(255,255,255,.25);--text:#f8f5ff;--muted:rgba(248,245,255,.72);--accent:hsl(var(--hue) 90% 64%);--accent2:hsl(var(--hue) 90% 53%);--ok:#7ae8a0;--bad:#ff9bab}
@media(prefers-color-scheme:light){:root{--bg:#eeeaff;--bg2:#c9bbed;--panel:rgba(255,255,255,.5);--line:rgba(55,35,100,.2);--text:#251743;--muted:rgba(37,23,67,.72)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top,rgba(255,255,255,.15),transparent 32%),linear-gradient(135deg,var(--bg),var(--bg2))}body{padding:22px 16px 44px}button,input,textarea{font:inherit}button{cursor:pointer;color:var(--text);border:1px solid var(--line);background:rgba(255,255,255,.05);transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease}button:hover{transform:translateY(-2px)}button:active{transform:translateY(0) scale(.98)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.shell{max-width:1060px;margin:auto}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 60px rgba(10,7,20,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border-radius:24px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;font-size:1.2rem}.brand h1{margin:0;font-size:clamp(1.45rem,4vw,2rem)}.actions,.nav,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.swatches{display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.05)}.swatch{width:19px;height:19px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.45)}.swatch.active{box-shadow:0 0 0 2px var(--text)}.nav{margin-bottom:16px}.nav button,.tab{padding:10px 15px;border-radius:999px;font-weight:700}.active,.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}.page{display:grid;gap:16px;animation:pageIn .32s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.panel{padding:18px;border-radius:24px}.stack{display:grid;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:17px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.stat small,.hint{display:block;color:var(--muted);font-size:.8rem}.stat strong{display:block;font-size:1.55rem;margin-top:3px}.title{margin:0;font-size:1.15rem}.builder{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}.field input,.field textarea,.modal input{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.12);color:var(--text)}textarea{min-height:100px;resize:vertical}.wide{grid-column:1/-1}.primary,.secondary,.danger{padding:10px 14px;border-radius:12px;font-weight:700}.secondary{background:rgba(255,255,255,.05)}.danger{background:rgba(255,155,171,.12);color:#ffd9df}.notice{min-height:22px;color:var(--ok);font-weight:600}.notice.error{color:var(--bad)}.items{display:grid;gap:10px}.item{padding:14px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.04);animation:itemIn .25s ease both}@keyframes itemIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}.item strong{display:block;margin-bottom:5px}.item p{white-space:pre-wrap;margin:0;color:var(--muted);line-height:1.5}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{padding:5px 9px;border-radius:999px;border:1px solid var(--line);font-size:.75rem;color:var(--muted)}.empty{text-align:center;padding:25px;border:1px dashed var(--line);border-radius:17px;color:var(--muted)}.study-card{min-height:250px;padding:26px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));display:grid;place-items:center;text-align:center;cursor:pointer;perspective:1000px}.flip-inner{width:100%;min-height:190px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}.study-card.flipped .flip-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;padding:20px;backface-visibility:hidden}.face.back{transform:rotateY(180deg)}.face h2{margin:0;font-size:clamp(1.25rem,4vw,2rem)}.face p{margin:0;color:var(--muted);line-height:1.6}.quiz-options{display:grid;gap:10px}.quiz-option{padding:14px;text-align:left;border-radius:13px}.quiz-option.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);background:rgba(255,255,255,.12)}.modal-bg{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.55);animation:fade .2s ease}.modal{width:min(430px,100%);padding:20px;border-radius:22px;animation:modalIn .25s ease}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:700px){.header{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.builder{grid-template-columns:1fr}.wide{grid-column:auto}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main id="app" class="shell"></main>
<script>
(()=>{
'use strict';
const K={cards:'sabikard-cards',quiz:'sabikard-quizItems',notes:'sabikard-notes',history:'sabikard-history',hue:'sabikard-hue'};
const hues=[270,220,185,145,315];
const fallback={cards:[{front:'What is the capital of Japan?',back:'Tokyo.'},{front:'What does HTML stand for?',back:'HyperText Markup Language.'}],quiz:[{question:'Which language structures a webpage?',options:['CSS','HTML','Python','SQL'],correctIndex:1}],notes:[],history:[]};
const id=()=>crypto&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const text=v=>String(v??'').trim();
function load(key,fallbackValue){try{const raw=localStorage.getItem(key);return raw===null?fallbackValue:JSON.parse(raw)}catch{return fallbackValue}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function card(v){const front=text(v?.front),back=text(v?.back);return front&&back?{id:v.id||id(),front,back}:null}
function quiz(v){const question=text(v?.question),options=Array.isArray(v?.options)?v.options.map(text).filter(Boolean).slice(0,4):[];if(!question||options.length<2)return null;return{id:v.id||id(),question,options,correctIndex:Math.min(Math.max(Number(v.correctIndex)||0,0),options.length-1)}}
function note(v){const title=text(v?.title),body=text(v?.body);return title||body?{id:v.id||id(),title:title||'Untitled note',body}:null}
const state={page:'home',hue:load(K.hue,270),cards:(load(K.cards,fallback.cards)||[]).map(card).filter(Boolean),quiz:(load(K.quiz,fallback.quiz)||[]).map(quiz).filter(Boolean),notes:(load(K.notes,[])||[]).map(note).filter(Boolean),history:load(K.history,[])||[],draft:{front:'',back:'',question:'',options:['','','',''],correctIndex:0,noteTitle:'',noteBody:''},mode:'cards',message:'',messageType:'',queue:[],index:0,flipped:false,quizIndex:0,selected:null,score:0,proOpen:false};
const app=document.getElementById('app');
function persist(){save(K.cards,state.cards);save(K.quiz,state.quiz);save(K.notes,state.notes);save(K.history,state.history);save(K.hue,state.hue)}
function esc(v){return text(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(v){return esc(v).replace(/`/g,'&#96;')}
function msg(value,type=''){state.message=value;state.messageType=type}
function addHistory(type,title){state.history=[{id:id(),type,title:text(title),time:new Date().toISOString()},...state.history].slice(0,30);persist()}
function shuffle(){state.queue=state.cards.slice();for(let i=state.queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]]}state.index=0;state.flipped=false}
function current(){return state.queue[state.index]||null}
function header(){return `<header class="header glass"><div class="brand"><div class="logo">S</div><h1>SabiKard</h1></div><div class="actions"><div class="swatches" aria-label="Choose theme">${hues.map(h=>`<button class="swatch ${h===state.hue?'active':''}" style="background:hsl(${h} 90% 60%)" data-a="hue" data-h="${h}" aria-label="Theme ${h}"></button>`).join('')}</div><button class="secondary" data-a="pro">Pro</button></div></header>`}
function nav(){return `<nav class="nav" aria-label="Main navigation">${[['home','Home'],['study','Study'],['quiz','Quiz'],['notes','Notes']].map(([p,l])=>`<button class="${state.page===p?'active':''}" data-a="page" data-p="${p}">${l}</button>`).join('')}</nav>`}
function builder(){const d=state.draft;return `<section class="panel glass stack"><div class="row"><h2 class="title">Create</h2><button class="tab ${state.mode==='cards'?'active':''}" data-a="mode" data-m="cards">Flashcard</button><button class="tab ${state.mode==='quiz'?'active':''}" data-a="mode" data-m="quiz">Quiz question</button></div>${state.mode==='cards'?`<div class="builder"><div class="field"><label for="front">Question / front</label><textarea id="front" data-f="front" placeholder="e.g. What is photosynthesis?">${esc(d.front)}</textarea></div><div class="field"><label for="back">Answer / back</label><textarea id="back" data-f="back" placeholder="e.g. The process plants use to make energy.">${esc(d.back)}</textarea></div></div><div class="row"><button class="primary" data-a="add-card">Save flashcard</button><span class="hint">Your draft is kept while you type.</span></div>`:`<div class="builder"><div class="field wide"><label for="question">Question</label><textarea id="question" data-f="question" placeholder="Type a question">${esc(d.question)}</textarea></div>${d.options.map((v,i)=>`<div class="field"><label for="option${i}">Option ${i+1}</label><input id="option${i}" data-f="option" data-i="${i}" value="${attr(v)}" placeholder="Answer option"></div>`).join('')}<div class="field"><label for="correct">Correct option</label><input id="correct" type="number" min="1" max="4" data-f="correct" value="${Number(d.correctIndex)+1}"></div></div><div class="row"><button class="primary" data-a="add-quiz">Save quiz question</button><span class="hint">Choose the correct option number.</span></div>`}<div class="notice ${state.messageType}">${esc(state.message)}</div></section>`}
function stats(){return `<div class="stats"><div class="stat"><small>Flashcards</small><strong>${state.cards.length}</strong></div><div class="stat"><small>Questions</small><strong>${state.quiz.length}</strong></div><div class="stat"><small>Notes</small><strong>${state.notes.length}</strong></div><div class="stat"><small>Reviews</small><strong>${state.history.length}</strong></div></div>`}
function library(){return `<section class="panel glass stack"><div class="row" style="justify-content:space-between"><h2 class="title">Saved flashcards</h2><span class="badge">${state.cards.length}</span></div><div class="items">${state.cards.length?state.cards.map((c,i)=>`<article class="item"><strong>${i+1}. ${esc(c.front)}</strong><p>${esc(c.back)}</p><div class="row"><button class="danger" data-a="delete-card" data-id="${c.id}">Delete</button></div></article>`).join(''):'<div class="empty">No flashcards saved yet. Fill both fields above and press Save flashcard.</div>'}</div></section>`}
function home(){return `<div class="page">${stats()}<section class="panel glass stack"><div class="row" style="justify-content:space-between"><h2 class="title">Ready to study?</h2><span class="hint">Everything is stored locally in this browser.</span></div><div class="row"><button class="primary" data-a="page" data-p="study">Start studying</button><button class="secondary" data-a="page" data-p="quiz">Take quiz</button></div></section>${library()}</div>`}
function study(){const c=current();if(!state.cards.length)return `<div class="page"><section class="panel glass empty">Add a flashcard above before starting a study session.</section></div>`;if(!state.queue.length)shuffle();return `<div class="page"><section class="panel glass stack"><div class="row" style="justify-content:space-between"><h2 class="title">Study</h2><span class="badge">${state.index+1} / ${state.queue.length}</span></div><div class="study-card ${state.flipped?'flipped':''}" data-a="flip" tabindex="0" role="button" aria-label="Flip flashcard"><div class="flip-inner"><div class="face"><h2>${esc(c.front)}</h2></div><div class="face back"><p>${esc(c.back)}</p></div></div></div><div class="hint" aria-live="polite">${state.flipped?'Answer revealed — rate your recall.':'Tap or press Enter on the card to reveal the answer.'}</div><div class="row"><button class="primary" data-a="know">I knew it</button><button class="secondary" data-a="review">Review later</button><button class="secondary" data-a="reshuffle">Restart session</button></div></section></div>`}
function quizPage(){if(!state.quiz.length)return `<div class="page"><section class="panel glass empty">Add a quiz question above before starting.</section></div>`;const q=state.quiz[state.quizIndex];return `<div class="page"><section class="panel glass stack"><div class="row" style="justify-content:space-between"><h2 class="title">Quiz</h2><span class="badge">${state.quizIndex+1} / ${state.quiz.length}</span></div><h3>${esc(q.question)}</h3><div class="quiz-options">${q.options.map((o,i)=>`<button class="quiz-option ${state.selected===i?'selected':''}" data-a="answer" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="row"><button class="primary" data-a="check">Check answer</button><button class="secondary" data-a="restart-quiz">Restart</button></div><div class="notice" aria-live="polite">${esc(state.message||'Choose an answer.')}</div></section></div>`}
function notes(){return `<div class="page"><section class="panel glass stack"><h2 class="title">Notes</h2><div class="builder"><div class="field"><label for="noteTitle">Title</label><input id="noteTitle" data-f="noteTitle" value="${attr(state.draft.noteTitle)}"></div><div class="field"><label for="noteBody">Note</label><textarea id="noteBody" data-f="noteBody">${esc(state.draft.noteBody)}</textarea></div></div><button class="primary" data-a="save-note">Save note</button><div class="items">${state.notes.length?state.notes.map(n=>`<article class="item"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><button class="danger" data-a="delete-note" data-id="${n.id}">Delete</button></article>`).join(''):'<div class="empty">No notes saved yet.</div>'}</div></section></div>`}
function modal(){return state.proOpen?`<div class="modal-bg" data-a="close"><section class="modal glass" onclick="event.stopPropagation()" role="dialog" aria-modal="true"><h2 class="title">Pro access</h2><p class="hint">Enter your Pro code.</p><div class="row"><input id="proCode" placeholder="Pro code" autocomplete="off"><button class="primary" data-a="unlock">Unlock</button></div><p class="hint">Demo code: SABI-7F3K9Q</p></section></div>`:''}
function render(){document.documentElement.style.setProperty('--hue',state.hue);const content=state.page==='study'?study():state.page==='quiz'?quizPage():state.page==='notes'?notes():home();app.innerHTML=header()+nav()+builder()+content+modal()}
function addCard(){const front=text(state.draft.front),back=text(state.draft.back);if(!front||!back){msg('Enter both a question and an answer.','error');render();return}state.cards.unshift({id:id(),front,back});state.draft.front='';state.draft.back='';state.queue=[];msg('Flashcard saved ✓');persist();render()}
function addQuiz(){const q=text(state.draft.question),opts=state.draft.options.map(text);if(!q||opts.some(v=>!v)){msg('Enter the question and all four options.','error');render();return}state.quiz.unshift({id:id(),question:q,options:opts,correctIndex:Number(state.draft.correctIndex)||0});state.draft={...state.draft,question:'',options:['','','',''],correctIndex:0};state.quizIndex=0;msg('Quiz question saved ✓');persist();render()}
app.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='option')state.draft.options[Number(e.target.dataset.i)]=e.target.value;else if(f==='correct')state.draft.correctIndex=Math.min(Math.max(Number(e.target.value||1)-1,0),3);else state.draft[f]=e.target.value});
app.addEventListener('keydown',e=>{if(e.target.dataset.a==='flip'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.flipped=!state.flipped;render()}});
app.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(a==='page'){state.page=el.dataset.p;if(state.page==='study'&&!state.queue.length)shuffle();render()}else if(a==='mode'){state.mode=el.dataset.m;state.message='';render()}else if(a==='hue'){state.hue=Number(el.dataset.h);persist();render()}else if(a==='add-card')addCard();else if(a==='add-quiz')addQuiz();else if(a==='delete-card'){state.cards=state.cards.filter(x=>x.id!==el.dataset.id);state.queue=[];persist();render()}else if(a==='flip'){state.flipped=!state.flipped;render()}else if(a==='reshuffle'){shuffle();render()}else if(a==='know'||a==='review'){const c=current();if(c&&a==='know')addHistory('card',c.front);state.index++;state.flipped=false;if(state.index>=state.queue.length)shuffle();render()}else if(a==='answer'){state.selected=Number(el.dataset.i);render()}else if(a==='check'){if(state.selected===null){msg('Choose an answer first.','error');render();return}const q=state.quiz[state.quizIndex];if(state.selected===q.correctIndex){state.score++;msg('Correct ✓')}else msg('Not quite — correct answer: '+q.options[q.correctIndex],'error');state.quizIndex=(state.quizIndex+1)%state.quiz.length;state.selected=null;render()}else if(a==='restart-quiz'){state.quizIndex=0;state.selected=null;state.score=0;msg('');render()}else if(a==='save-note'){const title=text(state.draft.noteTitle),body=text(state.draft.noteBody);if(!title&&!body){msg('Write a title or note first.','error');render();return}state.notes.unshift({id:id(),title:title||'Untitled note',body});state.draft.noteTitle='';state.draft.noteBody='';msg('Note saved ✓');persist();render()}else if(a==='delete-note'){state.notes=state.notes.filter(n=>n.id!==el.dataset.id);persist();render()}else if(a==='pro'){state.proOpen=true;render()}else if(a==='close'){state.proOpen=false;render()}else if(a==='unlock'){const code=text(document.getElementById('proCode')?.value);if(code==='SABI-7F3K9Q'){state.proOpen=false;msg('Pro unlocked ✓');render()}else{msg('That code is not valid.','error');render()}}});
if(!state.cards.length)state.queue=[];else shuffle();persist();render();
})();
</script>
</body>
</html>
