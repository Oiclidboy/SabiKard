<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>SabiKard</title>
    <style>
      :root {
        --hue: 270;
        --bg: #120b24;
        --bg-2: #261052;
        --panel: rgba(255, 255, 255, 0.08);
        --panel-strong: rgba(255, 255, 255, 0.12);
        --line: rgba(255, 255, 255, 0.24);
        --text: #f8f5ff;
        --muted: rgba(248, 245, 255, 0.75);
        --soft: rgba(248, 245, 255, 0.52);
        --accent: hsl(var(--hue) 90% 65%);
        --accent-strong: hsl(var(--hue) 90% 58%);
        --success: #7ae8a0;
        --warning: #ffd68a;
        --danger: #ff9bab;
        --shadow: 0 18px 60px rgba(11, 9, 20, 0.45);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f0ebff;
          --bg-2: #d5c8f4;
          --panel: rgba(255, 255, 255, 0.42);
          --panel-strong: rgba(255, 255, 255, 0.62);
          --line: rgba(55, 35, 100, 0.18);
          --text: #251743;
          --muted: rgba(37, 23, 67, 0.75);
          --soft: rgba(37, 23, 67, 0.52);
          --accent: hsl(var(--hue) 80% 55%);
          --accent-strong: hsl(var(--hue) 80% 48%);
          --shadow: 0 18px 60px rgba(67, 43, 130, 0.2);
        }
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(255,255,255,.14), transparent 30%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      body {
        padding: 28px 18px 40px;
      }

      button, input, textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      button:hover { transform: translateY(-1px); }
      button:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .app-shell {
        max-width: 1100px;
        margin: 0 auto;
      }

      .glass {
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 20px;
        border-radius: 24px;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-badge {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        display: grid;
        place-items: center;
        font-weight: 800;
        color: white;
        letter-spacing: 0.06em;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2.2rem);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .theme-picker {
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
      }

      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.4);
        padding: 0;
      }

      .swatch.active {
        box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
      }

      .top-nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .nav-btn {
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 600;
      }

      .nav-btn.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        border-color: transparent;
      }

      .panel {
        border-radius: 24px;
        padding: 18px;
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .stats-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
      }

      .stat {
        border-radius: 18px;
        padding: 14px 16px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
      }

      .stat-label {
        display: block;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--soft);
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: clamp(1.2rem, 2vw, 1.8rem);
        font-weight: 800;
      }

      .section-title {
        margin: 0;
        font-size: 1.15rem;
      }

      .builder-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(260px, 1fr));
        gap: 18px;
      }

      .field-group {
        display: grid;
        gap: 8px;
      }

      .field-group label {
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--soft);
      }

      .field-group input,
      .field-group textarea {
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        padding: 12px 14px;
      }

      .field-group textarea {
        min-height: 110px;
        resize: vertical;
      }

      .option-row {
        display: flex;
        gap: 8px;
      }

      .option-row input {
        flex: 1;
      }

      .inline-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .primary,
      .secondary,
      .danger {
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 700;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        border-color: transparent;
        color: white;
      }

      .secondary { background: rgba(255,255,255,0.04); }
      .danger { background: rgba(255, 155, 171, 0.12); color: #ffd9df; }

      .list {
        display: grid;
        gap: 12px;
      }

      .list-item {
        display: grid;
        gap: 10px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
      }

      .list-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .list-title {
        font-weight: 700;
      }

      .badge {
        border-radius: 999px;
        border: 1px solid var(--line);
        padding: 6px 10px;
        background: rgba(255,255,255,0.04);
        font-size: 0.72rem;
        color: var(--muted);
      }

      .mini-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .mini-actions button {
        padding: 7px 10px;
        border-radius: 10px;
      }

      .card-shell {
        display: grid;
        gap: 18px;
      }

      .card-face {
        position: relative;
        min-height: 250px;
        padding: 22px;
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
        border: 1px solid var(--line);
        display: grid;
        align-items: center;
        justify-items: center;
        text-align: center;
        perspective: 1000px;
      }

      .card-face-inner {
        width: 100%;
        min-height: 210px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        padding: 18px;
        transition: transform 0.44s ease;
        transform-style: preserve-3d;
      }

      .card-face.flipped .card-face-inner {
        transform: rotateY(180deg);
      }

      .card-content {
        position: absolute;
        inset: 18px;
        display: grid;
        place-items: center;
        backface-visibility: hidden;
        padding: 18px;
        text-align: center;
      }

      .card-content.back {
        transform: rotateY(180deg);
      }

      .card-content h3 {
        margin: 0 0 10px;
        font-size: clamp(1.2rem, 3vw, 2rem);
      }

      .card-content p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1.03rem;
      }

      .quiz-option {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        text-align: left;
      }

      .quiz-option.correct {
        border-color: rgba(122, 232, 160, 0.8);
        background: rgba(122, 232, 160, 0.12);
      }

      .quiz-option.wrong {
        border-color: rgba(255, 155, 171, 0.85);
        background: rgba(255, 155, 171, 0.12);
      }

      .quiz-grid {
        display: grid;
        gap: 10px;
      }

      .status-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.95rem;
        color: var(--muted);
        flex-wrap: wrap;
      }

      .flash-cta,
      .quiz-cta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 18px;
        padding: 24px 18px;
        text-align: center;
        color: var(--muted);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(8, 7, 15, 0.54);
        display: grid;
        place-items: center;
        padding: 18px;
        z-index: 10;
      }

      .modal {
        width: min(440px, 100%);
        border-radius: 24px;
        padding: 20px;
      }

      .modal h3 {
        margin-top: 0;
      }

      .input-row {
        display: flex;
        gap: 10px;
      }

      .input-row input {
        flex: 1;
      }

      .tiny-note {
        font-size: 0.8rem;
        color: var(--soft);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 760px) {
        .builder-grid,
        .stats-row {
          grid-template-columns: 1fr;
        }

        .header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (() => {
        const STORAGE_KEYS = {
          cards: 'sabikard-cards',
          quiz: 'sabikard-quizItems',
          notes: 'sabikard-notes',
          history: 'sabikard-history',
          hue: 'sabikard-hue',
          pro: 'sabikard-pro'
        };

        const THEME_COLORS = [
          { value: 270, label: 'Purple' },
          { value: 220, label: 'Blue' },
          { value: 185, label: 'Cyan' },
          { value: 145, label: 'Green' },
          { value: 315, label: 'Magenta' }
        ];

        const defaultState = {
          page: 'dashboard',
          hue: safeLoad(STORAGE_KEYS.hue, 270),
          cards: safeLoad(STORAGE_KEYS.cards, [
            { id: makeId(), front: 'What is the capital of Japan?', back: 'Tokyo.' },
            { id: makeId(), front: 'What does HTML stand for?', back: 'HyperText Markup Language.' },
            { id: makeId(), front: 'What is 9 × 9?', back: '81.' }
          ]).map(normalizeCard).filter(Boolean),
          quiz: safeLoad(STORAGE_KEYS.quiz, [
            {
              id: makeId(),
              question: 'Which language is used to structure web content?',
              options: ['CSS', 'HTML', 'JavaScript', 'Python'],
              correctIndex: 1
            }
          ]).map(normalizeQuiz).filter(Boolean),
          notes: safeLoad(STORAGE_KEYS.notes, []).map(normalizeNote).filter(Boolean),
          history: safeLoad(STORAGE_KEYS.history, []).map(normalizeHistory).filter(Boolean),
          isPro: safeLoad(STORAGE_KEYS.pro, false),
          modalOpen: false,
          cardFlip: false,
          cardQueue: [],
          cardIndex: 0,
          quizIndex: 0,
          quizScore: 0,
          quizSelected: null,
          quizMessage: '',
          cardMessage: '',
          cardMisses: 0,
          draftCard: { front: '', back: '' },
          draftQuiz: { question: '', options: ['', '', '', ''], correctIndex: 0 },
          noteDraft: { title: '', body: '' },
          editingNoteId: null,
          builderMode: 'cards'
        };

        let state = structuredClone(defaultState);
        let appRoot;

        function safeLoad(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            if (raw === null) return fallback;
            return JSON.parse(raw);
          } catch {
            return fallback;
          }
        }

        function safeSave(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
          } catch {
            return false;
          }
        }

        function makeId() {
          if (typeof crypto !== 'undefined' && crypto.randomUUID) {
            return crypto.randomUUID();
          }
          return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        }

        function sanitizeText(value) {
          return String(value ?? '').trim();
        }

        function normalizeCard(item) {
          const front = sanitizeText(item?.front);
          const back = sanitizeText(item?.back);
          if (!front || !back) return null;
          return {
            id: item?.id || makeId(),
            front,
            back
          };
        }

        function normalizeQuiz(item) {
          const question = sanitizeText(item?.question);
          const options = Array.isArray(item?.options)
            ? item.options.map((v) => sanitizeText(v)).filter(Boolean)
            : [];
          const correctIndex = Number.isInteger(item?.correctIndex) ? item.correctIndex : 0;

          if (!question || options.length < 2) return null;

          return {
            id: item?.id || makeId(),
            question,
            options: options.slice(0, 4),
            correctIndex: Math.min(Math.max(correctIndex, 0), Math.max(options.length - 1, 0))
          };
        }

        function normalizeNote(item) {
          if (!item || typeof item !== 'object') return null;
          const title = sanitizeText(item.title);
          const body = sanitizeText(item.body);
          if (!title && !body) return null;
          return {
            id: item.id || makeId(),
            title: title || 'Untitled note',
            body: body || ''
          };
        }

        function normalizeHistory(item) {
          if (!item || typeof item !== 'object') return null;
          const type = item.type === 'card' || item.type === 'quiz' ? item.type : 'card';
          const title = sanitizeText(item.title);
          if (!title) return null;
          return {
            id: item.id || makeId(),
            type,
            title,
            createdAt: item.createdAt || new Date().toISOString()
          };
        }

        function persist() {
          safeSave(STORAGE_KEYS.cards, state.cards);
          safeSave(STORAGE_KEYS.quiz, state.quiz);
          safeSave(STORAGE_KEYS.notes, state.notes);
          safeSave(STORAGE_KEYS.history, state.history);
          safeSave(STORAGE_KEYS.hue, state.hue);
          safeSave(STORAGE_KEYS.pro, state.isPro);
        }

        function addHistoryRecord(type, title) {
          const record = normalizeHistory({ id: makeId(), type, title, createdAt: new Date().toISOString() });
          if (!record) return;
          state.history = [record, ...state.history.filter((item) => item.id !== record.id)].slice(0, 30);
          persist();
        }

        function buildQueue() {
          const cards = state.cards.slice();
          for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
          }
          state.cardQueue = cards;
          state.cardIndex = 0;
          state.cardFlip = false;
          state.cardMessage = '';
          state.cardMisses = 0;
        }

        function nextCard() {
          if (!state.cardQueue.length) {
            state.cardIndex = 0;
            state.cardFlip = false;
            return;
          }
          if (state.cardIndex >= state.cardQueue.length) {
            buildQueue();
          }
          state.cardFlip = false;
          state.cardMessage = '';
          state.cardIndex = Math.min(state.cardIndex, state.cardQueue.length - 1);
          render();
        }

        function currentCard() {
          if (!state.cardQueue.length) return null;
          return state.cardQueue[state.cardIndex] || null;
        }

        function evaluateCard(outcome) {
          const card = currentCard();
          if (!card) return;

          if (outcome === 'know') {
            state.cardMessage = 'Nice work — that one is locked in.';
            addHistoryRecord('card', card.front);
          } else {
            state.cardMessage = 'Good review cue — try it again soon.';
            state.cardMisses += 1;
          }

          state.cardIndex += 1;
          if (state.cardIndex >= state.cardQueue.length) {
            buildQueue();
          } else {
            state.cardFlip = false;
          }
          render();
        }

        function handleCardAdd() {
          const front = sanitizeText(state.draftCard.front);
          const back = sanitizeText(state.draftCard.back);
          if (!front || !back) return;

          const card = normalizeCard({ id: makeId(), front, back });
          if (!card) return;

          state.cards = [card, ...state.cards];
          state.draftCard = { front: '', back: '' };
          persist();
          render();
        }

        function handleQuizAdd() {
          const question = sanitizeText(state.draftQuiz.question);
          const options = state.draftQuiz.options.map((value) => sanitizeText(value));
          if (!question || options.some((value) => !value)) return;

          const quiz = normalizeQuiz({
            id: makeId(),
            question,
            options: options.slice(0, 4),
            correctIndex: state.draftQuiz.correctIndex
          });

          if (!quiz) return;
          state.quiz = [quiz, ...state.quiz];
          state.draftQuiz = { question: '', options: ['', '', '', ''], correctIndex: 0 };
          state.page = 'dashboard';
          persist();
          render();
        }

        function handleNoteSave() {
          const title = sanitizeText(state.noteDraft.title);
          const body = sanitizeText(state.noteDraft.body);
          if (!title && !body) return;

          if (state.editingNoteId) {
            state.notes = state.notes.map((note) =>
              note.id === state.editingNoteId ? { ...note, title: title || 'Untitled note', body } : note
            );
          } else {
            state.notes = [
              normalizeNote({ id: makeId(), title: title || 'Untitled note', body }),
              ...state.notes
            ].filter(Boolean);
          }

          state.noteDraft = { title: '', body: '' };
          state.editingNoteId = null;
          persist();
          render();
        }

        function handleNoteDelete(id) {
          state.notes = state.notes.filter((note) => note.id !== id);
          persist();
          render();
        }

        function handleNoteEdit(note) {
          state.editingNoteId = note.id;
          state.noteDraft = { title: note.title, body: note.body };
          state.page = 'notes';
          render();
        }

        function handleQuizSubmit() {
          if (state.quizSelected === null || !state.quiz.length) return;

          const item = state.quiz[state.quizIndex];
          const isCorrect = state.quizSelected === item.correctIndex;

          state.quizMessage = isCorrect ? 'Correct — nice memory.' : `Not quite — the right answer is: ${item.options[item.correctIndex]}`;
          state.quizScore += isCorrect ? 1 : 0;

          const nextIndex = state.quizIndex + 1;
          if (nextIndex >= state.quiz.length) {
            state.quizIndex = 0;
            state.quizSelected = null;
            state.quizMessage = `Session complete — ${state.quizScore} / ${state.quiz.length} correct.`;
            state.quizScore = 0;
          } else {
            state.quizIndex = nextIndex;
            state.quizSelected = null;
          }

          render();
        }

        function renderHeader() {
          return `
            <header class="header glass">
              <div class="brand">
                <div class="brand-badge">S</div>
                <h1>SabiKard</h1>
              </div>
              <div class="header-actions">
                <div class="theme-picker" aria-label="Color theme picker">
                  ${THEME_COLORS.map((color) => `
                    <button
                      type="button"
                      class="swatch ${state.hue === color.value ? 'active' : ''}"
                      data-action="set-hue"
                      data-hue="${color.value}"
                      style="background:${hsl(color.value)}"
                      aria-label="Use ${color.label} theme"
                    ></button>
                  `).join('')}
                </div>
                <button type="button" class="primary" data-action="toggle-pro">
                  ${state.isPro ? 'Pro unlocked ✨' : 'Unlock Pro'}
                </button>
              </div>
            </header>
          `;
        }

        function hsl(value) {
          return `hsl(${value} 90% 60%)`;
        }

        function renderNav() {
          const pages = [
            { id: 'dashboard', label: 'Dashboard' },
            { id: 'study', label: 'Study' },
            { id: 'quiz', label: 'Quiz' },
            { id: 'notes', label: 'Notes' }
          ];

          return `
            <nav class="top-nav" aria-label="Main navigation">
              ${pages.map((page) => `
                <button
                  type="button"
                  class="nav-btn ${state.page === page.id ? 'active' : ''}"
                  data-action="set-page"
                  data-page="${page.id}"
                >
                  ${page.label}
                </button>
              `).join('')}
            </nav>
          `;
        }

        function renderStats() {
          const totalCards = state.cards.length;
          const totalQuiz = state.quiz.length;
          const totalNotes = state.notes.length;
          const recent = state.history.length;

          return `
            <section class="stats-row" aria-label="Study statistics">
              <div class="stat glass">
                <span class="stat-label">Cards</span>
                <span class="stat-value">${totalCards}</span>
              </div>
              <div class="stat glass">
                <span class="stat-label">Quiz</span>
                <span class="stat-value">${totalQuiz}</span>
              </div>
              <div class="stat glass">
                <span class="stat-label">Notes</span>
                <span class="stat-value">${totalNotes}</span>
              </div>
              <div class="stat glass">
                <span class="stat-label">Recent</span>
                <span class="stat-value">${recent}</span>
              </div>
            </section>
          `;
        }

        function renderDashboard() {
          const item = currentCard();
          return `
            <section class="panel glass stack">
              <div class="status-line">
                <h2 class="section-title">Dashboard</h2>
                <span>${state.cards.length} total cards</span>
              </div>
              ${renderStats()}
              <div class="inline-actions">
                <button type="button" class="primary" data-action="set-page" data-page="study">Start studying</button>
                <button type="button" class="secondary" data-action="set-page" data-page="quiz">Take quiz</button>
                <button type="button" class="secondary" data-action="build-demo">Generate sample set</button>
              </div>
              <div class="list">
                <div class="list-item">
                  <div class="list-meta">
                    <div class="list-title">Recent activity</div>
                    <span class="badge">${state.history.length} items</span>
                  </div>
                  ${state.history.length ? state.history.map((entry) => `
                    <div class="tiny-note">${entry.type === 'quiz' ? 'Quiz' : 'Card'} • ${entry.title}</div>
                  `).join('') : '<div class="tiny-note">No study activity yet.</div>'}
                </div>
              </div>
            </section>
          `;
        }

        function renderStudySection() {
          const card = currentCard();
          const queueCount = state.cardQueue.length ? state.cardQueue.length - state.cardIndex : 0;

          if (!state.cardQueue.length && !state.cards.length) {
            return `
              <section class="panel glass stack">
                <h2 class="section-title">Study</h2>
                <div class="empty">Add a flashcard to begin studying.</div>
              </section>
            `;
          }

          return `
            <section class="panel glass stack">
              <div class="status-line">
                <h2 class="section-title">Study</h2>
                <span>${queueCount} remaining</span>
              </div>

              ${card ? `
                <div class="card-shell">
                  <div class="card-face ${state.cardFlip ? 'flipped' : ''}" data-action="flip-card" aria-live="polite">
                    <div class="card-face-inner">
                      <div class="card-content front">
                        <h3>${escapeHtml(card.front)}</h3>
                      </div>
                      <div class="card-content back">
                        <p>${escapeHtml(card.back)}</p>
                      </div>
                    </div>
                  </div>

                  <div class="status-line">
                    <span>${state.cardMessage || 'Tap the card to reveal the answer.'}</span>
                    <span class="badge">Misses: ${state.cardMisses}</span>
                  </div>

                  <div class="flash-cta">
                    <button type="button" class="primary" data-action="card-know">I knew it</button>
                    <button type="button" class="secondary" data-action="card-review">Review later</button>
                  </div>
                </div>
              ` : `
                <div class="empty">No cards left in this session. Start a fresh queue.</div>
              `}
            </section>
          `;
        }

        function renderQuizSection() {
          if (!state.quiz.length) {
            return `
              <section class="panel glass stack">
                <h2 class="section-title">Quiz</h2>
                <div class="empty">Add at least one question to start quizzing.</div>
              </section>
            `;
          }

          const item = state.quiz[state.quizIndex];

          return `
            <section class="panel glass stack">
              <div class="status-line">
                <h2 class="section-title">Quiz</h2>
                <span>Question ${state.quizIndex + 1} / ${state.quiz.length}</span>
              </div>

              <div class="list-item">
                <div class="list-title">${escapeHtml(item.question)}</div>
                <div class="quiz-grid">
                  ${item.options.map((option, index) => `
                    <button
                      type="button"
                      class="quiz-option ${state.quizSelected === index ? 'selected' : ''}"
                      data-action="select-answer"
                      data-answer="${index}"
                    >
                      ${escapeHtml(option)}
                    </button>
                  `).join('')}
                </div>
                <div class="quiz-cta">
                  <button type="button" class="primary" data-action="submit-answer">Check answer</button>
                  <button type="button" class="secondary" data-action="reset-quiz">Restart</button>
                </div>
                <div class="tiny-note" aria-live="polite">${state.quizMessage || 'Choose the best answer.'}</div>
              </div>
            </section>
          `;
        }

        function renderNotesSection() {
          return `
            <section class="panel glass stack">
              <div class="status-line">
                <h2 class="section-title">Notes</h2>
                <span>${state.notes.length} saved</span>
              </div>

              <div class="builder-grid">
                <div class="field-group">
                  <label for="note-title">Title</label>
                  <input id="note-title" type="text" value="${escapeAttribute(state.noteDraft.title)}" data-field="note-title" />
                </div>
                <div class="field-group">
                  <label for="note-body">Body</label>
                  <textarea id="note-body" data-field="note-body">${escapeHtml(state.noteDraft.body)}</textarea>
                </div>
              </div>

              <div class="inline-actions">
                <button type="button" class="primary" data-action="save-note">${state.editingNoteId ? 'Update note' : 'Save note'}</button>
                ${state.editingNoteId ? '<button type="button" class="secondary" data-action="cancel-edit-note">Cancel</button>' : ''}
              </div>

              <div class="list">
                ${state.notes.length ? state.notes.map((note) => `
                  <div class="list-item">
                    <div class="list-meta">
                      <div class="list-title">${escapeHtml(note.title)}</div>
                      <div class="mini-actions">
                        <button type="button" data-action="edit-note" data-id="${note.id}">Edit</button>
                        <button type="button" data-action="delete-note" data-id="${note.id}">Delete</button>
                      </div>
                    </div>
                    <div class="tiny-note">${escapeHtml(note.body || 'No body yet.')}</div>
                  </div>
                `).join('') : '<div class="empty">No notes yet.</div>'}
              </div>
            </section>
          `;
        }

        function renderBuilderSection() {
          const isCards = state.builderMode === 'cards';

          return `
            <section class="panel glass stack">
              <div class="status-line">
                <h2 class="section-title">Create</h2>
                <div class="inline-actions">
                  <button type="button" class="nav-btn ${isCards ? 'active' : ''}" data-action="set-builder-mode" data-mode="cards">Flashcards</button>
                  <button type="button" class="nav-btn ${!isCards ? 'active' : ''}" data-action="set-builder-mode" data-mode="quiz">Quiz</button>
                </div>
              </div>

              ${isCards ? `
                <div class="builder-grid">
                  <div class="field-group">
                    <label for="card-front">Front</label>
                    <textarea id="card-front" data-field="card-front">${escapeHtml(state.draftCard.front)}</textarea>
                  </div>
                  <div class="field-group">
                    <label for="card-back">Back</label>
                    <textarea id="card-back" data-field="card-back">${escapeHtml(state.draftCard.back)}</textarea>
                  </div>
                </div>
                <div class="inline-actions">
                  <button type="button" class="primary" data-action="add-card">Add flashcard</button>
                </div>
              ` : `
                <div class="builder-grid">
                  <div class="field-group" style="grid-column: 1 / -1;">
                    <label for="quiz-question">Question</label>
                    <textarea id="quiz-question" data-field="quiz-question">${escapeHtml(state.draftQuiz.question)}</textarea>
                  </div>
                  ${state.draftQuiz.options.map((option, index) => `
                    <div class="field-group">
                      <label for="quiz-option-${index}">Option ${index + 1}</label>
                      <input id="quiz-option-${index}" type="text" value="${escapeAttribute(option)}" data-field="quiz-option-${index}" />
                    </div>
                  `).join('')}
                  <div class="field-group" style="grid-column: 1 / -1;">
                    <label for="quiz-correct">Correct answer index</label>
                    <input id="quiz-correct" type="number" min="0" max="3" step="1" value="${state.draftQuiz.correctIndex}" data-field="quiz-correct" />
                  </div>
                </div>
                <div class="inline-actions">
                  <button type="button" class="primary" data-action="add-quiz">Add question</button>
                </div>
              `}
            </section>
          `;
        }

        function renderProModal() {
          if (!state.modalOpen) return '';
          return `
            <div class="modal-backdrop" data-action="close-pro-modal">
              <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="pro-title" onclick="event.stopPropagation()">
                <h3 id="pro-title">Unlock Pro</h3>
                <p class="tiny-note">Enter the access code to unlock premium study features.</p>
                <div class="input-row">
                  <input id="pro-code" type="text" placeholder="Enter code" aria-label="Pro access code" />
                  <button type="button" class="primary" data-action="submit-pro-code">Unlock</button>
                </div>
                <p class="tiny-note">Demo code: <strong>SABI-7F3K9Q</strong></p>
              </div>
            </div>
          `;
        }

        function renderApp() {
          document.documentElement.style.setProperty('--hue', state.hue);
          const pageContent = (() => {
            if (state.page === 'study') return renderStudySection();
            if (state.page === 'quiz') return renderQuizSection();
            if (state.page === 'notes') return renderNotesSection();
            return renderDashboard();
          })();

          appRoot.innerHTML = `
            ${renderHeader()}
            ${renderNav()}
            ${renderBuilderSection()}
            ${pageContent}
            ${renderProModal()}
          `;
        }

        function escapeHtml(value) {
          return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        function escapeAttribute(value) {
          return escapeHtml(value).replace(/`/g, '&#96;');
        }

        function applyDraftField(name, value) {
          if (name === 'card-front') state.draftCard.front = value;
          if (name === 'card-back') state.draftCard.back = value;
          if (name === 'quiz-question') state.draftQuiz.question = value;
          if (name === 'quiz-correct') {
            const next = Number(value) || 0;
            state.draftQuiz.correctIndex = Math.min(Math.max(next, 0), 3);
          }
          if (name.startsWith('quiz-option-')) {
            const idx = Number(name.split('-').pop());
            state.draftQuiz.options[idx] = value;
          }
          if (name === 'note-title') state.noteDraft.title = value;
          if (name === 'note-body') state.noteDraft.body = value;
        }

        function setupEvents() {
          appRoot.addEventListener('click', (event) => {
            const actionEl = event.target.closest('[data-action]');
            if (!actionEl) return;

            const action = actionEl.dataset.action;

            if (action === 'set-page') {
              state.page = actionEl.dataset.page;
              renderApp();
              return;
            }

            if (action === 'set-builder-mode') {
              state.builderMode = actionEl.dataset.mode;
              renderApp();
              return;
            }

            if (action === 'set-hue') {
              state.hue = Number(actionEl.dataset.hue);
              persist();
              renderApp();
              return;
            }

            if (action === 'toggle-pro') {
              state.modalOpen = true;
              renderApp();
              return;
            }

            if (action === 'close-pro-modal') {
              state.modalOpen = false;
              renderApp();
              return;
            }

            if (action === 'submit-pro-code') {
              const input = document.getElementById('pro-code');
              const code = sanitizeText(input?.value || '');
              state.isPro = code === 'SABI-7F3K9Q';
              state.modalOpen = false;
              persist();
              renderApp();
              return;
            }

            if (action === 'build-demo') {
              state.cards = [
                { id: makeId(), front: 'What is CSS used for?', back: 'Styling the visual appearance of a webpage.' },
                { id: makeId(), front: 'What does API stand for?', back: 'Application Programming Interface.' },
                { id: makeId(), front: 'What is a variable in JavaScript?', back: 'A container used to store data values.' }
              ];
              state.quiz = [
                { id: makeId(), question: 'Which language controls layout and style?', options: ['HTML', 'CSS', 'SQL', 'Node'], correctIndex: 1 },
                { id: makeId(), question: 'What does DOM stand for?', options: ['Document Object Model', 'Dynamic Object Model', 'Data Object Matrix', 'Document Output Manager'], correctIndex: 0 }
              ];
              state.page = 'dashboard';
              persist();
              renderApp();
              return;
            }

            if (action === 'add-card') {
              handleCardAdd();
              return;
            }

            if (action === 'add-quiz') {
              handleQuizAdd();
              return;
            }

            if (action === 'save-note') {
              handleNoteSave();
              return;
            }

            if (action === 'cancel-edit-note') {
              state.editingNoteId = null;
              state.noteDraft = { title: '', body: '' };
              renderApp();
              return;
            }

            if (action === 'edit-note') {
              const note = state.notes.find((item) => item.id === actionEl.dataset.id);
              if (note) handleNoteEdit(note);
              return;
            }

            if (action === 'delete-note') {
              handleNoteDelete(actionEl.dataset.id);
              return;
            }

            if (action === 'flip-card') {
              state.cardFlip = !state.cardFlip;
              renderApp();
              return;
            }

            if (action === 'card-know') {
              evaluateCard('know');
              return;
            }

            if (action === 'card-review') {
              evaluateCard('review');
              return;
            }

            if (action === 'select-answer') {
              state.quizSelected = Number(actionEl.dataset.answer);
              renderApp();
              return;
            }

            if (action === 'submit-answer') {
              handleQuizSubmit();
              return;
            }

            if (action === 'reset-quiz') {
              state.quizIndex = 0;
              state.quizScore = 0;
              state.quizSelected = null;
              state.quizMessage = '';
              renderApp();
            }
          });

          appRoot.addEventListener('input', (event) => {
            const target = event.target;
            const field = target.dataset.field;
            if (!field) return;
            applyDraftField(field, target.value);
          });
        }

        function init() {
          appRoot = document.getElementById('app');
          if (!appRoot) return;
          if (!state.cardQueue.length) buildQueue();
          setupEvents();
          renderApp();
        }

        init();
      })();
    </script>
  </body>
</html>
