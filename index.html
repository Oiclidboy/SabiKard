<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SabiKard</title>
<style>
:root{--hue:270;--bg:#10091f;--bg2:#281050;--panel:rgba(255,255,255,.105);--panel2:rgba(255,255,255,.15);--line:rgba(255,255,255,.22);--text:#faf7ff;--muted:rgba(250,247,255,.7);--soft:rgba(250,247,255,.5);--accent:hsl(var(--hue) 90% 65%);--accent2:hsl(var(--hue) 90% 52%);--ok:#7ae8a0;--bad:#ff9bab;--shadow:0 20px 70px rgba(7,4,15,.35)}
@media(prefers-color-scheme:light){:root{--bg:#f1edff;--bg2:#cfc2ef;--panel:rgba(255,255,255,.46);--panel2:rgba(255,255,255,.7);--line:rgba(52,35,95,.18);--text:#251743;--muted:rgba(37,23,67,.72);--soft:rgba(37,23,67,.5);--shadow:0 20px 70px rgba(67,43,130,.17)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0,rgba(255,255,255,.16),transparent 30%),linear-gradient(135deg,var(--bg),var(--bg2))}body{padding:20px 16px 48px}button,input,textarea{font:inherit}button{cursor:pointer;color:var(--text);border:1px solid var(--line);background:rgba(255,255,255,.045);transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease}button:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.shell{max-width:1080px;margin:auto}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 19px;border-radius:25px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:900;font-size:1.25rem}.brand h1{margin:0;font-size:clamp(1.45rem,4vw,2rem);letter-spacing:-.03em}.actions,.row,.nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.swatches{display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.045)}.swatch{width:18px;height:18px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.45)}.swatch.active{box-shadow:0 0 0 2px var(--text)}.menu-wrap{position:relative}.more{width:40px;height:40px;border-radius:13px;font-size:1.35rem}.menu{position:absolute;right:0;top:48px;z-index:8;min-width:190px;padding:8px;border-radius:16px;animation:pop .2s ease both}.menu button{display:block;width:100%;padding:11px 12px;text-align:left;border:0;border-radius:10px;background:transparent}.menu button:hover{background:rgba(255,255,255,.12)}.nav{margin-bottom:16px}.nav button,.tab{padding:10px 15px;border-radius:999px;font-weight:750}.active,.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}.page{display:grid;gap:16px;animation:pageIn .35s cubic-bezier(.2,.8,.2,1) both}@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}.panel{padding:20px;border-radius:25px}.stack{display:grid;gap:17px}.title{margin:0;font-size:1.2rem}.hero{padding:28px;min-height:220px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-65px;top:-80px;background:radial-gradient(circle,var(--accent),transparent 68%);opacity:.38}.hero>*{position:relative;z-index:1}.hero h2{font-size:clamp(2rem,6vw,4rem);line-height:.98;margin:7px 0}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.74rem}.hint{color:var(--muted);font-size:.87rem;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:17px;background:rgba(255,255,255,.045);border:1px solid var(--line)}.stat small{display:block;color:var(--soft);text-transform:uppercase;font-size:.7rem;letter-spacing:.06em}.stat strong{display:block;font-size:1.65rem;margin-top:4px}.builder{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{color:var(--muted);font-size:.77rem;text-transform:uppercase;letter-spacing:.06em}.field input,.field textarea,.modal input{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.12);color:var(--text)}textarea{min-height:105px;resize:vertical}.wide{grid-column:1/-1}.primary,.secondary,.danger{padding:10px 14px;border-radius:12px;font-weight:750}.secondary{background:rgba(255,255,255,.05)}.danger{background:rgba(255,120,145,.13);color:#ffd9df}.notice{min-height:20px;color:var(--ok);font-weight:650}.notice.error{color:var(--bad)}.items{display:grid;gap:10px}.item{padding:15px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.04);animation:itemIn .28s ease both}@keyframes itemIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.item strong{display:block;margin-bottom:5px}.item p{white-space:pre-wrap;margin:0;color:var(--muted);line-height:1.5}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.badge{padding:5px 9px;border-radius:999px;border:1px solid var(--line);font-size:.74rem;color:var(--muted)}.empty{text-align:center;padding:28px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.study-card{min-height:300px;padding:25px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035));display:grid;place-items:center;text-align:center;cursor:pointer;perspective:1100px}.flip-inner{width:100%;min-height:220px;position:relative;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.8,.2,1)}.study-card.flipped .flip-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;padding:22px;backface-visibility:hidden}.face.back{transform:rotateY(180deg)}.face h2{margin:0;font-size:clamp(1.35rem,4vw,2.25rem)}.face p{margin:0;color:var(--muted);font-size:1.1rem;line-height:1.65}.quiz-options{display:grid;gap:10px}.quiz-option{padding:15px;text-align:left;border-radius:13px}.quiz-option.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);background:rgba(255,255,255,.13)}.modal-bg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.56);animation:fade .2s ease}.modal{width:min(440px,100%);padding:21px;border-radius:23px;animation:modalIn .25s ease}.modal h2{margin-top:0}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes modalIn{from{opacity:0;transform:translateY(13px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:720px){.header{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.builder{grid-template-columns:1fr}.wide{grid-column:auto}.hero{display:block}.hero .row{margin-top:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main id="app" class="shell"></main>
<script>
(()=>{'use strict';
const K={cards:'sabikard-cards',quiz:'sabikard-quizItems',notes:'sabikard-notes',history:'sabikard-history',hue:'sabikard-hue'};
const pages=[['home','Home'],['study','Study'],['quiz','Quiz'],['notes','Notes'],['create','Create']];
const hues=[270,220,185,145,315];
const fallback={cards:[{front:'What is the capital of Japan?',back:'Tokyo.'},{front:'What does HTML stand for?',back:'HyperText Markup Language.'}],quiz:[{question:'Which language structures a webpage?',options:['CSS','HTML','Python','SQL'],correctIndex:1}]};
const makeId=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const text=v=>String(v??'').trim();
function load(k,f){try{const r=localStorage.getItem(k);return r===null?f:JSON.parse(r)}catch{return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
function normalizeCard(v){const front=text(v?.front),back=text(v?.back);return front&&back?{id:v.id||makeId(),front,back}:null}
function normalizeQuiz(v){const question=text(v?.question),options=Array.isArray(v?.options)?v.options.map(text).filter(Boolean).slice(0,4):[];if(!question||options.length<2)return null;return{id:v.id||makeId(),question,options,correctIndex:Math.min(Math.max(Number(v.correctIndex)||0,0),options.length-1)}}
function normalizeNote(v){const title=text(v?.title),body=text(v?.body);return title||body?{id:v.id||makeId(),title:title||'Untitled note',body}:null}
const state={page:'home',hue:load(K.hue,270),cards:(load(K.cards,fallback.cards)||[]).map(normalizeCard).filter(Boolean),quiz:(load(K.quiz,fallback.quiz)||[]).map(normalizeQuiz).filter(Boolean),notes:(load(K.notes,[])||[]).map(normalizeNote).filter(Boolean),history:load(K.history,[])||[],draft:{front:'',back:'',question:'',options:['','','',''],correctIndex:0,noteTitle:'',noteBody:''},mode:'cards',message:'',messageType:'',queue:[],index:0,flipped:false,quizIndex:0,selected:null,score:0,menu:false,historyOpen:false,proOpen:false};
const app=document.getElementById('app');
function persist(){save(K.cards,state.cards);save(K.quiz,state.quiz);save(K.notes,state.notes);save(K.history,state.history);save(K.hue,state.hue)}
function esc(v){return text(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v).replace(/`/g,'&#96;')}
function message(v,type=''){state.message=v;state.messageType=type}
function addHistory(type,title){state.history=[{id:makeId(),type,title:text(title),time:new Date().toISOString()},...state.history].slice(0,60);persist()}
function shuffle(){state.queue=state.cards.slice();for(let i=state.queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]]}state.index=0;state.flipped=false}
function current(){return state.queue[state.index]||null}
function header(){return `<header class="header glass"><div class="brand"><div class="logo">S</div><div><h1>SabiKard</h1><span class="hint">Learn beautifully, remember longer.</span></div></div><div class="actions"><div class="swatches" aria-label="Choose theme">${hues.map(h=>`<button class="swatch ${h===state.hue?'active':''}" style="background:hsl(${h} 90% 60%)" data-a="hue" data-h="${h}" aria-label="Theme ${h}"></button>`).join('')}</div><button class="secondary" data-a="pro">✦ Pro</button><div class="menu-wrap"><button class="more" data-a="menu" aria-label="More options">⋯</button>${state.menu?`<div class="menu glass"><button data-a="history">Study history</button><button data-a="page" data-p="notes">Notes</button><button data-a="clear-history">Clear history</button></div>`:''}</div></div></header>`}
function nav(){return `<nav class="nav" aria-label="Main navigation">${pages.map(([p,l])=>`<button class="${state.page===p?'active':''}" data-a="page" data-p="${p}">${l}</button>`).join('')}</nav>`}
function stats(){return `<div class="stats"><div class="stat"><small>Flashcards</small><strong>${state.cards.length}</strong></div><div class="stat"><small>Questions</small><strong>${state.quiz.length}</strong></div><div class="stat"><small>Notes</small><strong>${state.notes.length}</strong></div><div class="stat"><small>Reviews</small><strong>${state.history.length}</strong></div></div>`}
function create(){const d=state.draft;return `<div class="page"><section class="panel glass stack"><div class="row"><h2 class="title">Create your study set</h2><button class="tab ${state.mode==='cards'?'active':''}" data-a="mode" data-m="cards">Flashcard</button><button class="tab ${state.mode==='quiz'?'active':''}" data-a="mode" data-m="quiz">Quiz question</button></div>${state.mode==='cards'?`<div class="builder"><div class="field"><label for="front">Question / front</label><textarea id="front" data-f="front" placeholder="What is photosynthesis?">${esc(d.front)}</textarea></div><div class="field"><label for="back">Answer / back</label><textarea id="back" data-f="back" placeholder="The process plants use to make energy.">${esc(d.back)}</textarea></div></div><div class="row"><button class="primary" data-a="add-card">Save flashcard</button><span class="hint">Your text remains while you type.</span></div>`:`<div class="builder"><div class="field wide"><label for="question">Question</label><textarea id="question" data-f="question" placeholder="Type a question">${esc(d.question)}</textarea></div>${d.options.map((v,i)=>`<div class="field"><label for="option${i}">Option ${i+1}</label><input id="option${i}" data-f="option" data-i="${i}" value="${attr(v)}" placeholder="Answer option"></div>`).join('')}<div class="field"><label for="correct">Correct option</label><input id="correct" type="number" min="1" max="4" data-f="correct" value="${Number(d.correctIndex)+1}"></div></div><div class="row"><button class="primary" data-a="add-quiz">Save quiz question</button><span class="hint">Select the correct option number.</span></div>`}<div class="notice ${state.messageType}" aria-live="polite">${esc(state.message)}</div></section></div>`}
function home(){return `<div class="page"><section class="hero panel glass"><div><span class="eyebrow">Your personal memory studio</span><h2>Small steps.<br>Strong recall.</h2><p class="hint">Build a beautiful daily learning habit with focused cards and quick quizzes.</p><div class="row"><button class="primary" data-a="page" data-p="study">Start studying</button><button class="secondary" data-a="page" data-p="create">Create cards</button></div></div></section>${stats()}<section class="panel glass stack"><div class="row" style="justify-content:space-between"><h2 class="title">Your library</h2><span class="badge">Stored on this device</span></div><div class="items">${state.cards.length?state.cards.slice(0,5).map((c,i)=>`<article class="item"><strong>${i+1}. ${esc(c.front)}</strong><p>${esc(c.back)}</p></article>`).join(''):'<div class="empty">Your library is empty. Create your first flashcard.</div>'}</div></section></div>`}
function study(){if(!state.cards.length)return `<div class="page"><section class="panel glass empty">Add a flashcard in Create before studying.</section></div>`;if(!state.queue.length)shuffle();const c=current();return `<div class="page"><section class="panel glass stack"><div class="row" style="justify-content:space-between"><h2 class="title">Study session</h2><span class="badge">${state.index+1} / ${state.queue.length}</span></div><div class="study-card ${state.flipped?'flipped':''}" data-a="flip" tabindex="0" role="button" aria-label="Flip flashcard"><div class="flip-inner"><div class="face"><h2>${esc(c.front)}</h2></div><div class="face back"><p>${esc(c.back)}</p></div></div></div><div class="hint" aria-live="polite">${state.flipped?'Answer revealed — how well did you know it?':'Tap or press Enter to reveal the answer.'}</div><div class="row"><button class="primary" data-a="know">I knew it</button><button class="secondary" data-a="review">Review later</button><button class="secondary" data-a="reshuffle">Restart</button></div></section></div>`}
function quizPage(){if(!state.quiz.length)return `<div class="page"><section class="panel glass empty">Add a quiz question in Create before starting.</section></div>`;const q=state.quiz[state.quizIndex];return `<div class="page"><section class="panel glass stack"><div class="row" style="justify-content:space-between"><h2 class="title">Quick quiz</h2><span class="badge">${state.quizIndex+1} / ${state.quiz.length}</span></div><h3>${esc(q.question)}</h3><div class="quiz-options">${q.options.map((o,i)=>`<button class="quiz-option ${state.selected===i?'selected':''}" data-a="answer" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="row"><button class="primary" data-a="check">Check answer</button><button class="secondary" data-a="restart-quiz">Restart</button></div><div class="notice ${state.messageType}" aria-live="polite">${esc(state.message||'Choose the best answer.')}</div></section></div>`}
function notes(){return `<div class="page"><section class="panel glass stack"><h2 class="title">Notes</h2><div class="builder"><div class="field"><label for="noteTitle">Title</label><input id="noteTitle" data-f="noteTitle" value="${attr(state.draft.noteTitle)}"></div><div class="field"><label for="noteBody">Note</label><textarea id="noteBody" data-f="noteBody">${esc(state.draft.noteBody)}</textarea></div></div><button class="primary" data-a="save-note">Save note</button><div class="items">${state.notes.length?state.notes.map(n=>`<article class="item"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><button class="danger" data-a="delete-note" data-id="${n.id}">Delete</button></article>`).join(''):'<div class="empty">No notes saved yet.</div>'}</div></section></div>`}
function history(){return `<div class="page"><section class="panel glass stack"><div class="row" style="justify-content:space-between"><h2 class="title">Study history</h2><button class="danger" data-a="clear-history">Clear</button></div><div class="items">${state.history.length?state.history.map(x=>`<article class="item"><div class="item-head"><strong>${x.type==='quiz'?'Quiz':'Flashcard'} review</strong><span class="badge">${new Date(x.time).toLocaleDateString()}</span></div><p>${esc(x.title)}</p></article>`).join(''):'<div class="empty">No study history yet.</div>'}</div></section></div>`}
function modal(){return state.proOpen?`<div class="modal-bg" data-a="close"><section class="modal glass" onclick="event.stopPropagation()" role="dialog" aria-modal="true"><h2>Unlock Pro ✦</h2><p class="hint">Premium themes and future study tools will appear here.</p><div class="row"><input id="proCode" placeholder="Pro code" autocomplete="off"><button class="primary" data-a="unlock">Unlock</button></div><p class="hint">Demo code: <strong>SABI-7F3K9Q</strong></p></section></div>`:''}
function render(){document.documentElement.style.setProperty('--hue',state.hue);let content=state.historyOpen?history():state.page==='create'?create():state.page==='study'?study():state.page==='quiz'?quizPage():state.page==='notes'?notes():home();app.innerHTML=header()+nav()+content+modal()}
function addCard(){const front=text(state.draft.front),back=text(state.draft.back);if(!front||!back){message('Enter both a question and an answer.','error');render();return}state.cards.unshift({id:makeId(),front,back});state.draft.front='';state.draft.back='';state.queue=[];message('Flashcard saved ✓');persist();render()}
function addQuiz(){const question=text(state.draft.question),options=state.draft.options.map(text);if(!question||options.some(v=>!v)){message('Enter the question and all four options.','error');render();return}state.quiz.unshift({id:makeId(),question,options,correctIndex:Math.min(Math.max(Number(state.draft.correctIndex)||0,0),3)});state.draft.question='';state.draft.options=['','','',''];state.draft.correctIndex=0;message('Quiz question saved ✓');persist();render()}
app.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='option')state.draft.options[Number(e.target.dataset.i)]=e.target.value;else if(f==='correct')state.draft.correctIndex=Math.min(Math.max(Number(e.target.value||1)-1,0),3);else state.draft[f]=e.target.value});
app.addEventListener('keydown',e=>{if(e.target.dataset.a==='flip'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.flipped=!state.flipped;render()}});
app.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(a==='menu'){state.menu=!state.menu;render()}else if(a==='history'){state.menu=false;state.historyOpen=true;render()}else if(a==='clear-history'){state.history=[];state.historyOpen=false;state.menu=false;persist();render()}else if(a==='page'){state.page=el.dataset.p;state.historyOpen=false;state.menu=false;if(state.page==='study'&&!state.queue.length)shuffle();render()}else if(a==='mode'){state.mode=el.dataset.m;state.message='';render()}else if(a==='hue'){state.hue=Number(el.dataset.h);persist();render()}else if(a==='add-card')addCard();else if(a==='add-quiz')addQuiz();else if(a==='delete-card'){state.cards=state.cards.filter(x=>x.id!==el.dataset.id);state.queue=[];persist();render()}else if(a==='flip'){state.flipped=!state.flipped;render()}else if(a==='reshuffle'){shuffle();render()}else if(a==='know'||a==='review'){const c=current();if(c&&a==='know')addHistory('card',c.front);state.index++;state.flipped=false;if(state.index>=state.queue.length)shuffle();render()}else if(a==='answer'){state.selected=Number(el.dataset.i);render()}else if(a==='check'){if(state.selected===null){message('Choose an answer first.','error');render();return}const q=state.quiz[state.quizIndex];const correct=state.selected===q.correctIndex;if(correct){message('Correct ✓');addHistory('quiz',q.question)}else message('Not quite — correct answer: '+q.options[q.correctIndex],'error');state.quizIndex=(state.quizIndex+1)%state.quiz.length;state.selected=null;render()}else if(a==='restart-quiz'){state.quizIndex=0;state.selected=null;state.score=0;message('');render()}else if(a==='save-note'){const title=text(state.draft.noteTitle),body=text(state.draft.noteBody);if(!title&&!body){message('Write a title or note first.','error');render();return}state.notes.unshift({id:makeId(),title:title||'Untitled note',body});state.draft.noteTitle='';state.draft.noteBody='';message('Note saved ✓');persist();render()}else if(a==='delete-note'){state.notes=state.notes.filter(n=>n.id!==el.dataset.id);persist();render()}else if(a==='pro'){state.proOpen=true;render()}else if(a==='close'){state.proOpen=false;render()}else if(a==='unlock'){if(text(document.getElementById('proCode')?.value)==='SABI-7F3K9Q'){state.proOpen=false;message('Pro unlocked ✓');render()}else{message('That code is not valid.','error');render()}}});
if(state.cards.length)shuffle();render();
})();
</script>
</body>
</html>
