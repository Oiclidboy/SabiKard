<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100vh;font-family:-apple-system,'SF Pro Text','Inter',system-ui,sans-serif;color:var(--text)}body{background:radial-gradient(circle at 15% 10%,#7c5cff 0,transparent 45%),radial-gradient(circle at 85% 15%,#37c6d9 0,transparent 50%),radial-gradient(circle at 30% 90%,#ff7eb3 0,transparent 45%),radial-gradient(circle at 80% 85%,#4a5dff 0,transparent 50%),#1a1730;padding:28px 16px 60px;overflow-x:hidden}.wrap{max-width:560px;margin:auto}header{text-align:center;margin-bottom:24px}.brand-row{display:flex;align-items:center;justify-content:center;gap:10px}.wordmark{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0}.subtitle{font-size:14px;color:var(--dim);margin:6px 0 0}.logo-stack{position:relative;width:34px;height:34px}.logo-card{position:absolute;top:1px;left:4px;width:24px;height:30px;border-radius:6px;border:1px solid var(--border);box-shadow:0 2px 8px #0004}.logo-card-1{background:#7c5cffb3;transform:translate(-7px,2px) rotate(-14deg)}.logo-card-2{background:#37c6d9b3;transform:translate(0,-2px)}.logo-card-3{background:#ff7eb3b3;transform:translate(7px,2px) rotate(14deg)}.glass{position:relative;background:var(--glass-bg);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border);border-radius:28px;box-shadow:0 8px 32px #0004,inset 0 1px #fff6;overflow:hidden}.panel{padding:24px}input,textarea{width:100%;border:1px solid #fff3;border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.5;color:var(--text);background:#0003;outline:none;font-family:inherit;margin-bottom:10px}textarea{min-height:80px;resize:vertical}input::placeholder,textarea::placeholder{color:var(--faint)}input:focus,textarea:focus{border-color:var(--accent)}button{font-family:inherit;cursor:pointer;border:0;transition:transform .25s var(--spring),background .2s var(--ease),opacity .2s}button:active{transform:scale(.94)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #7de0d3e6;outline-offset:2px}.btn-primary{background:var(--text);color:#1a1730;padding:13px 24px;border-radius:999px;font-size:15px;font-weight:600}.btn-ghost,.btn-small{background:#fff2;color:var(--text);border:1px solid #fff3;border-radius:999px;font-size:14px;padding:11px 16px}.btn-primary:disabled,.btn-small:disabled{opacity:.35;cursor:not-allowed}.btn-small{font-size:13px;font-weight:600;padding:9px 16px}.mode-row,.row,.actions,.judge-row,.redeem-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row{justify-content:space-between;margin-top:14px}.mode-row{margin-bottom:18px}.mode-chip{flex:1;text-align:center;background:#fff1;color:var(--dim);padding:12px;border-radius:16px;font-size:14px;font-weight:600;border:1px solid transparent}.mode-chip.active{background:#7de0d32e;color:var(--accent);border-color:#7de0d380}.field-label{font-size:12px;color:var(--faint);font-weight:600;margin:2px 0 6px}.option-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.option-row input{margin:0;flex:1}.correct-toggle{width:34px;height:34px;min-width:34px;border-radius:10px;background:#fff1;border:1px solid var(--border);color:var(--faint);font-size:15px}.correct-toggle.selected{background:#6fe0a840;border-color:var(--good);color:var(--good)}.deck-list{margin:14px 0;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}.deck-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff1;border-radius:12px;padding:10px 12px;font-size:13px}.deck-item-text{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.deck-item-actions{display:flex;gap:8px}.deck-item-remove,.deck-item-edit{background:none;color:var(--faint);font-size:12px;text-decoration:underline;padding:4px;flex-shrink:0}.empty-note,.mastery-note{font-size:13px;color:var(--faint);text-align:center;padding:10px 0}.welcome{padding:18px;margin-bottom:12px;background:linear-gradient(120deg,#7c5cff45,#37c6d933);border:1px solid var(--border);border-radius:20px}.welcome h2{font-size:20px;margin:0 0 6px}.welcome p{color:var(--dim);line-height:1.5;margin:0}.profile-row{display:flex;gap:8px}.profile-row input{margin:0}.profile-row button{white-space:nowrap}.limit-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin-top:18px;border-radius:18px;background:linear-gradient(120deg,#7c5cff4d,#37c6d933);border:1px solid var(--border);font-size:13px;color:var(--dim)}.active-pro{background:#6fe0a826;color:var(--good);justify-content:center;font-weight:600}.pay-panel{margin-top:12px;padding:18px;border-radius:18px;background:#0003;border:1px solid var(--border)}.pay-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #fff2;font-size:14px}.pay-label{color:var(--faint)}.pay-value{font-weight:600;text-align:right}.pay-note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.5}.redeem-row input{margin:0;flex:1;text-transform:uppercase}.redeem-error{font-size:12px;color:var(--review);margin-top:8px}.study-header{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);padding:0 6px 12px}.dots{display:flex;gap:6px;padding:0 6px 18px}.dot{width:7px;height:7px;border-radius:50%;background:#fff4}.dot.current{background:var(--text);transform:scale(1.4)}.dot.done-good{background:var(--good)}.dot.in-progress{background:var(--accent)}.card-stage{perspective:1600px}.card{position:relative;min-height:260px;border-radius:28px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s var(--spring)}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;padding:32px 26px;display:flex;flex-direction:column;justify-content:center}.face-front{background:var(--glass-strong);border:1px solid var(--border)}.face-back{background:linear-gradient(135deg,#7de0d359,#7c5cff4d);border:1px solid var(--border);transform:rotateY(180deg)}.face-label{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:10px}.face-text,.quiz-question-text{font-size:19px;line-height:1.5}.tap-hint{position:absolute;bottom:16px;right:20px;font-size:12px;color:var(--faint)}.level-chip{position:absolute;top:16px;right:18px;font-size:11px;padding:4px 10px;border-radius:999px;background:#fff2;color:var(--dim)}.judge-btn{flex:1;padding:15px;border-radius:999px;font-size:15px;font-weight:600}.judge-review{background:#ff9e7d33;color:var(--review);border:1px solid #ff9e7d66}.judge-good{background:#6fe0a833;color:var(--good);border:1px solid #6fe0a866}.feedback-msg{text-align:center;font-size:16px;font-weight:600;padding:16px}.quiz-question{padding:28px 26px;margin-bottom:16px}.quiz-options{display:flex;flex-direction:column;gap:10px}.quiz-option{text-align:left;padding:16px 18px;border-radius:16px;background:#fff1;border:1px solid var(--border);color:var(--text);font-size:15px}.quiz-option.correct{background:#6fe0a840;border-color:var(--good)}.quiz-option.wrong{background:#ff9e7d40;border-color:var(--review)}.quiz-option:disabled{cursor:default}.quiz-next-row{margin-top:16px;display:flex;justify-content:flex-end;align-items:center;gap:12px}.quiz-feedback{flex:1;color:var(--dim);font-size:14px;font-weight:600}.summary{text-align:center}.summary-row{display:flex;justify-content:center;gap:36px;margin:18px 0 26px}.stat-count{font-size:32px;font-weight:700}.stat-label{font-size:13px;color:var(--dim);margin-top:2px}.stat.good .stat-count{color:var(--good)}.stat.review .stat-count{color:var(--review)}.import-label{display:inline-block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const FREE_CARD_LIMIT=10,MASTERY_LEVEL=3,PRO_REDEEM_CODE="SABI-7F3K9Q";
const KEY="sabikard-v2";
function uid(){return window.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(16).slice(2)}`}
function load(){try{const value=JSON.parse(localStorage.getItem(KEY));return value&&typeof value==='object'?value:{} }catch{return {}}}
function save(value){try{localStorage.setItem(KEY,JSON.stringify(value))}catch{}}
function levelLabel(level){return level===0?'New':level===1?'Learning':'Almost there'}
function randomFrom(a){return a[Math.floor(Math.random()*a.length)]}
const GOOD_MSGS=["Nice one — that's sticking.","You've got this.","Exactly right, keep going.","That's locking in nicely.","You sabi!","Well done jare!"];
const REVIEW_MSGS=["No wahala, that's what review is for.","Almost — you'll get it next round.","Good instinct to flag it. You'll nail it next time."];
function App(){
 const initial=load();
 const [name,setName]=useState(initial.name||''); const [nameDraft,setNameDraft]=useState(initial.name||'');
 const [mode,setMode]=useState(initial.mode||'flashcards'); const [status,setStatus]=useState('build'); const [isPro,setIsPro]=useState(!!initial.isPro);
 const [cards,setCards]=useState(Array.isArray(initial.cards)?initial.cards:[]); const [quizItems,setQuizItems]=useState(Array.isArray(initial.quizItems)?initial.quizItems:[]);
 const [front,setFront]=useState(''),[back,setBack]=useState(''),[question,setQuestion]=useState(''),[options,setOptions]=useState(['','','','']),[correct,setCorrect]=useState(0);
 const [editId,setEditId]=useState(null),[levels,setLevels]=useState([]),[queue,setQueue]=useState([]),[flipped,setFlipped]=useState(false),[judging,setJudging]=useState(false),[feedback,setFeedback]=useState(''),[missed,setMissed]=useState(0);
 const [quizIndex,setQuizIndex]=useState(0),[quizSelected,setQuizSelected]=useState(null),[quizScore,setQuizScore]=useState(0),[quizFeedback,setQuizFeedback]=useState('');
 const [payOpen,setPayOpen]=useState(false),[redeem,setRedeem]=useState(''),[redeemError,setRedeemError]=useState(''),[copied,setCopied]=useState(false),[notice,setNotice]=useState('');
 useEffect(()=>save({name,mode,isPro,cards,quizItems}),[name,mode,isPro,cards,quizItems]);
 function announce(text){setNotice(text);window.setTimeout(()=>setNotice(''),2500)}
 function saveName(){const clean=nameDraft.trim().slice(0,40);setName(clean);announce(clean?`Nice to meet you, ${clean}.`:'Your name was cleared.');}
 function clearDeck(){if(!confirm('Clear this deck and all saved cards?'))return;setCards([]);setQuizItems([]);setLevels([]);setQueue([]);setStatus('build');announce('Your deck has been cleared.')}
 function resetDraft(){setEditId(null);setFront('');setBack('');setQuestion('');setOptions(['','','','']);setCorrect(0)}
 function addCard(){const f=front.trim(),b=back.trim();if(!f||!b||(!isPro&&cards.length>=FREE_CARD_LIMIT))return;if(cards.some(c=>c.front.toLowerCase()===f.toLowerCase()&&c.back.toLowerCase()===b.toLowerCase())){announce('That card is already in your deck.');return}if(editId){setCards(cards.map(c=>c.id===editId?{...c,front:f,back:b}:c));announce('Card updated.')}else{setCards([...cards,{id:uid(),front:f,back:b}]);announce('Card added.')}resetDraft()}
 function editCard(c){setEditId(c.id);setFront(c.front);setBack(c.back);window.scrollTo({top:0,behavior:'smooth'})}
 function addQuiz(){const q=question.trim(),os=options.map(x=>x.trim());if(!q||os.some(x=>!x)||(!isPro&&quizItems.length>=FREE_CARD_LIMIT))return;if(quizItems.some(x=>x.question.toLowerCase()===q.toLowerCase()&&x.options.join('|').toLowerCase()===os.join('|').toLowerCase())){announce('That question is already in your quiz.');return}if(editId){setQuizItems(quizItems.map(x=>x.id===editId?{...x,question:q,options:os,correctIndex:correct}:x));announce('Question updated.')}else{setQuizItems([...quizItems,{id:uid(),question:q,options:os,correctIndex:correct}]);announce('Question added.')}resetDraft()}
 function editQuiz(item){setEditId(item.id);setQuestion(item.question);setOptions(item.options);setCorrect(item.correctIndex);window.scrollTo({top:0,behavior:'smooth'})}
 function startStudy(){if(!cards.length)return;setLevels(cards.map(()=>0));setQueue(cards.map((_,i)=>i));setFlipped(false);setMissed(0);setStatus('study')}
 function startQuiz(){if(!quizItems.length)return;setQuizIndex(0);setQuizSelected(null);setQuizScore(0);setStatus('study')}
 function judge(outcome){if(judging||!queue.length)return;const idx=queue[0];setJudging(true);setFeedback(outcome==='good'?randomFrom(GOOD_MSGS):randomFrom(REVIEW_MSGS));window.setTimeout(()=>{const nextLevels=[...levels],newLevel=outcome==='good'?nextLevels[idx]+1:0;nextLevels[idx]=newLevel;const nextQueue=queue.slice(1);if(outcome==='good'&&newLevel<MASTERY_LEVEL)nextQueue.splice(Math.min(nextQueue.length,newLevel===1?2:4),0,idx);if(outcome==='review'){nextQueue.splice(Math.min(nextQueue.length,2),0,idx);setMissed(x=>x+1)}setLevels(nextLevels);setQueue(nextQueue);setJudging(false);setFeedback('');setFlipped(false);if(!nextQueue.length)setStatus('done')},550)}
 function selectOption(i){if(quizSelected!==null)return;const right=i===quizItems[quizIndex].correctIndex;setQuizSelected(i);setQuizFeedback(right?'Correct — nice work.':'Not quite — now you know for next time.');if(right)setQuizScore(x=>x+1)}
 function exportData(){const blob=new Blob([JSON.stringify({name,cards,quizItems},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sabikard-deck.json';a.click();URL.revokeObjectURL(url);announce('Your deck was exported.')}
 function importData(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.cards)&&!Array.isArray(data.quizItems))throw Error();setCards((data.cards||[]).map(c=>({...c,id:c.id||uid()})));setQuizItems((data.quizItems||[]).map(q=>({...q,id:q.id||uid()})));if(data.name){setName(data.name);setNameDraft(data.name)}announce('Deck imported successfully.')}catch{announce('That file is not a valid SabiKard deck.')}};reader.readAsText(file);e.target.value=''}
 function copyNumber(){navigator.clipboard?.writeText('0567915109').then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1800)}).catch(()=>prompt('Copy account number:','0567915109'))}
 const current=queue[0],mastered=levels.filter(x=>x>=MASTERY_LEVEL).length,atLimit=!isPro&&(mode==='flashcards'?cards.length:quizItems.length)>=FREE_CARD_LIMIT;
 const greeting=name?`Welcome back, ${name}.`:'Welcome to SabiKard.';
 if(status==='study'&&mode==='flashcards'&&current===undefined)setStatus('build');
 return <div className="wrap"><header><div className="brand-row"><div className="logo-stack"><div className="logo-card logo-card-1/><div className="logo-card logo-card-2/><div className="logo-card logo-card-3/></div><h1 className="wordmark">SabiKard</h1></div><p className="subtitle">Build your own deck, then quiz yourself until it sticks.</p></header>
 <div className="welcome" aria-live="polite"><h2>{greeting}</h2><p>{name?'Your learning space is ready whenever you are.':'Tell us your name so SabiKard can make your study sessions feel personal.'}</p><div className="profile-row"><label className="sr-only" htmlFor="name">Your name</label><input id="name" type="text" maxLength="40" placeholder="What should we call you?" value={nameDraft} onChange={e=>setNameDraft(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveName()}/><button className="btn-small" onClick={saveName}>{name?'Update':'Save name'}</button></div></div>
 <div role="status" aria-live="polite" className="sr-only">{notice}</div>
 {status==='build'&&<div className="glass panel"><div className="mode-row"><button className={'mode-chip '+(mode==='flashcards'?'active':'')} aria-pressed={mode==='flashcards'} onClick={()=>{setMode('flashcards');resetDraft()}}>Flashcards</button><button className={'mode-chip '+(mode==='quiz'?'active':'')} aria-pressed={mode==='quiz'} onClick={()=>{setMode('quiz');resetDraft()}}>Quiz (4 options)</button></div>
 {mode==='flashcards'?<><div className="field-label">Question / front</div><input value={front} onChange={e=>setFront(e.target.value)} placeholder="e.g. What is the capital of Nigeria?"/><div className="field-label">Answer / back</div><textarea value={back} onChange={e=>setBack(e.target.value)} placeholder="e.g. Abuja"/><div className="row"><button className="btn-ghost" onClick={()=>setCards([{id:uid(),front:'What powers the light-dependent reactions of photosynthesis?',back:'Sunlight absorbed by chlorophyll generates ATP and NADPH.'},{id:uid(),front:'Where does photosynthesis take place?',back:'In the chloroplasts, specifically the thylakoids.'}])}>Load sample deck</button><button className="btn-small" onClick={addCard} disabled={!front.trim()||!back.trim()||atLimit}>{editId?'Save card':'Add card'}</button></div>{cards.length?<div className="deck-list">{cards.map((c,i)=><div className="deck-item" key={c.id}><span className="deck-item-text">{i+1}. {c.front}</span><span className="deck-item-actions"><button className="deck-item-edit" onClick={()=>editCard(c)}>Edit</button><button className="deck-item-remove" onClick={()=>setCards(cards.filter(x=>x.id!==c.id))}>Remove</button></span></div>)}</div>:<div className="empty-note">No cards yet — add your first one above.</div>}<div className="row"><span className="field-label" style={{margin:0}}>{cards.length} card{cards.length!==1?'s':''}{!isPro?` (max ${FREE_CARD_LIMIT})`:''}</span><button className="btn-primary" onClick={startStudy} disabled={!cards.length}>Study this deck</button></div></>:<><div className="field-label">Question</div><input value={question} onChange={e=>setQuestion(e.target.value)} placeholder="e.g. Which planet is closest to the sun?"/><div className="field-label">Options — select the correct answer</div>{options.map((o,i)=><div className="option-row" key={i}><button className={'correct-toggle '+(correct===i?'selected':'')} aria-label={`Mark option ${i+1} as correct`} aria-pressed={correct===i} onClick={()=>setCorrect(i)}>{correct===i?'✓':''}</button><input value={o} onChange={e=>setOptions(options.map((x,j)=>j===i?e.target.value:x))} placeholder={'Option '+(i+1)}/></div>)}<div className="row"><span/><button className="btn-small" onClick={addQuiz} disabled={!question.trim()||options.some(x=>!x.trim())||atLimit}>{editId?'Save question':'Add question'}</button></div>{quizItems.length?<div className="deck-list">{quizItems.map((q,i)=><div className="deck-item" key={q.id}><span className="deck-item-text">{i+1}. {q.question}</span><span className="deck-item-actions"><button className="deck-item-edit" onClick={()=>editQuiz(q)}>Edit</button><button className="deck-item-remove" onClick={()=>setQuizItems(quizItems.filter(x=>x.id!==q.id))}>Remove</button></span></div>)}</div>:<div className="empty-note">No questions yet — add your first one above.</div>}<div className="row"><span className="field-label" style={{margin:0}}>{quizItems.length} question{quizItems.length!==1?'s':''}</span><button className="btn-primary" onClick={startQuiz} disabled={!quizItems.length}>Start quiz</button></div></>}
 <div className="row"><label className="btn-ghost import-label">Import deck<input className="sr-only" type="file" accept="application/json,.json" onChange={importData}/></label><button className="btn-ghost" onClick={exportData} disabled={!cards.length&&!quizItems.length}>Export deck</button><button className="btn-ghost" onClick={clearDeck} disabled={!cards.length&&!quizItems.length}>Clear all</button></div>
 {isPro?<div className="limit-strip active-pro">✓ Pro unlocked — unlimited cards per deck</div>:<div><div className="limit-strip"><span>Free decks are capped at {FREE_CARD_LIMIT} cards.</span><button className="btn-small" onClick={()=>setPayOpen(!payOpen)}>{payOpen?'Hide':'Go Pro'}</button></div>{payOpen&&<div className="pay-panel"><div className="pay-row"><span className="pay-label">Amount</span><b>₦5,000 (one-time)</b></div><div className="pay-row"><span className="pay-label">Bank</span><b>Guaranty Trust Bank</b></div><div className="pay-row"><span className="pay-label">Account number</span><b>0567915109 <button className="btn-small" onClick={copyNumber}>{copied?'Copied!':'Copy'}</button></b></div><div className="pay-note">After transferring, send proof to <strong>henryshub4u@gmail.com</strong> to receive your code.</div><div className="redeem-row"><input value={redeem} onChange={e=>setRedeem(e.target.value)} placeholder="Enter code"/><button className="btn-small" onClick={()=>redeem.trim().toUpperCase()===PRO_REDEEM_CODE?(setIsPro(true),setPayOpen(false),announce('Pro unlocked — enjoy unlimited cards!')):setRedeemError('That code does not match.')} disabled={!redeem.trim()}>Unlock</button></div>{redeemError&&<div className="redeem-error" role="alert">{redeemError}</div>}</div>}</div>}</div>}
 {status==='study'&&mode==='flashcards'&&current!==undefined&&<><div className="study-header"><span>{mastered} / {cards.length} mastered</span><span>{levelLabel(levels[current])}</span></div><div className="dots">{cards.map((_,i)=><span className={'dot '+(i===current?'current ':levels[i]>=MASTERY_LEVEL?'done-good':levels[i]>0?'in-progress':'')} key={cards[i].id}/>)}</div><div className="card-stage"><div className={'card '+(flipped?'flipped':'')} role="button" tabIndex="0" aria-label="Flip flashcard" onClick={()=>setFlipped(!flipped)} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setFlipped(!flipped)}}}><div className="face face-front"><span className="level-chip">{levelLabel(levels[current])}</span><span className="face-label">Question</span><span className="face-text">{cards[current].front}</span><span className="tap-hint">Tap to reveal</span></div><div className="face face-back"><span className="face-label">Answer</span><span className="face-text">{cards[current].back}</span></div></div></div>{flipped&&!judging&&<div className="judge-row"><button className="judge-btn judge-review" onClick={()=>judge('review')}>Need to review</button><button className="judge-btn judge-good" onClick={()=>judge('good')}>Got it</button></div>}{judging&&<div className="feedback-msg" role="status" aria-live="polite">{feedback}</div>}<div className="mastery-note">Cards you miss come back sooner — get one right {MASTERY_LEVEL} times in a row to master it.</div></>}
 {status==='study'&&mode==='quiz'&&quizItems[quizIndex]&&<><div className="study-header"><span>Question {quizIndex+1} of {quizItems.length}</span><span>{quizScore} correct so far</span></div><div className="glass quiz-question"><div className="quiz-question-text">{quizItems[quizIndex].question}</div></div><div className="quiz-options">{quizItems[quizIndex].options.map((o,i)=><button className={'quiz-option '+(quizSelected!==null?(i===quizItems[quizIndex].correctIndex?'correct':i===quizSelected?'wrong':''):'')} disabled={quizSelected!==null} key={i} onClick={()=>selectOption(i)}>{o}</button>)}</div>{quizSelected!==null&&<div className="quiz-next-row"><span className="quiz-feedback" role="status">{quizFeedback}</span><button className="btn-primary" onClick={()=>quizIndex+1<quizItems.length?(setQuizIndex(quizIndex+1),setQuizSelected(null),setQuizFeedback('')):setStatus('done')}>{quizIndex+1<quizItems.length?'Next question':'See results'}</button></div>}</>}
 {status==='done'&&<div className="glass panel summary"><p className="subtitle">{mode==='quiz'?(quizScore===quizItems.length?'Perfect score — you really know this material.':'You kept going — another pass will make this even stronger.'):(missed?'You stuck with it and mastered every card. Well done.':'Flawless run — you clearly had this down.')}</p><div className="summary-row"><div className="stat good"><div className="stat-count">{mode==='quiz'?quizScore:cards.length}</div><div className="stat-label">{mode==='quiz'?'correct':'mastered'}</div></div><div className="stat review"><div className="stat-count">{mode==='quiz'?quizItems.length-quizScore:missed}</div><div className="stat-label">{mode==='quiz'?'missed':'total misses'}</div></div></div><div className="actions"><button className="btn-primary" onClick={mode==='quiz'?startQuiz:startStudy}>{mode==='quiz'?'Retake this quiz':'Study this deck again'}</button><button className="btn-ghost" onClick={()=>setStatus('build')}>Edit deck</button></div></div>}
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
