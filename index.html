<style>
:root{--glass:rgba(255,255,255,.14);--glass-strong:rgba(255,255,255,.22);--border:rgba(255,255,255,.35);--text:#f5f6fa;--dim:rgba(245,246,250,.7);--faint:rgba(245,246,250,.45);--accent:#7de0d3;--good:#6fe0a8;--review:#ff9e7d;--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100vh;font-family:-apple-system,'SF Pro Text','Inter',system-ui,sans-serif;color:var(--text)}body{padding:28px 16px 60px;overflow-x:hidden;background:radial-gradient(circle at 15% 10%,#7c5cff 0,transparent 45%),radial-gradient(circle at 85% 15%,#37c6d9 0,transparent 50%),radial-gradient(circle at 30% 90%,#ff7eb3 0,transparent 45%),radial-gradient(circle at 80% 85%,#4a5dff 0,transparent 50%),#1a1730}.wrap{max-width:560px;margin:auto}header{text-align:center;margin-bottom:24px}.brand-row{display:flex;align-items:center;justify-content:center;gap:10px}.wordmark{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:0}.subtitle{font-size:14px;color:var(--dim);margin:6px 0 0}.logo-stack{position:relative;width:34px;height:34px}.logo-card{position:absolute;top:1px;left:4px;width:24px;height:30px;border:1px solid var(--border);border-radius:6px;box-shadow:0 2px 8px #0004}.logo-card-1{background:linear-gradient(135deg,#7c5cffb3,#7c5cff40);animation:fan-left .7s var(--spring) .05s both;z-index:1}.logo-card-2{background:linear-gradient(135deg,#37c6d9b3,#37c6d940);animation:fan-center .7s var(--spring) .15s both;z-index:2}.logo-card-3{background:linear-gradient(135deg,#ff7eb3b3,#ff7eb340);animation:fan-right .7s var(--spring) .25s both;z-index:3}@keyframes fan-left{from{opacity:0;transform:translate(0,4px) rotate(0) scale(.6)}to{opacity:1;transform:translate(-7px,2px) rotate(-14deg)}}@keyframes fan-center{from{opacity:0;transform:translate(0,4px) scale(.6)}to{opacity:1;transform:translate(0,-2px)}}@keyframes fan-right{from{opacity:0;transform:translate(0,4px) rotate(0) scale(.6)}to{opacity:1;transform:translate(7px,2px) rotate(14deg)}}
.glass{position:relative;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border);border-radius:28px;box-shadow:0 8px 32px #0004,inset 0 1px #fff6;overflow:hidden}.glass:before{content:"";position:absolute;inset:0 0 auto;height:40%;background:linear-gradient(#fff3,transparent);pointer-events:none}.panel{padding:24px}input[type=text],textarea{width:100%;border:1px solid #fff3;border-radius:14px;padding:13px 14px;font:15px/1.5 inherit;color:var(--text);background:#0000002e;outline:none;margin-bottom:10px}textarea{min-height:80px;resize:vertical}input::placeholder,textarea::placeholder{color:var(--faint)}input:focus,textarea:focus{border-color:var(--accent)}button{font:inherit;cursor:pointer;border:0;transition:transform .25s var(--spring),background .2s var(--ease),opacity .2s}button:active{transform:scale(.94)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #7de0d3e6;outline-offset:2px}button:disabled{cursor:default}.btn-primary{background:var(--text);color:#1a1730;padding:13px 24px;border-radius:999px;font-size:15px;font-weight:600}.btn-ghost{background:#fff2;color:var(--dim);padding:13px 20px;border-radius:999px;font-size:14px;border:1px solid #fff2}.btn-small{background:#fff2;color:var(--text);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600}.btn-primary:disabled,.btn-small:disabled{opacity:.35}.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}.mode-row{display:flex;gap:8px;margin-bottom:18px}.mode-chip{flex:1;background:#fff1;color:var(--dim);padding:12px;border-radius:16px;font-size:14px;font-weight:600;border:1px solid transparent}.mode-chip.active{background:#7de0d32e;color:var(--accent);border-color:#7de0d380}.field-label{font-size:12px;color:var(--faint);font-weight:600;margin:2px 0 6px}.option-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.option-row input{margin:0;flex:1}.correct-toggle{width:34px;height:34px;min-width:34px;border-radius:10px;background:#fff2;border:1px solid var(--border);color:var(--faint);font-size:15px}.correct-toggle.selected{background:#6fe0a840;border-color:var(--good);color:var(--good)}.deck-list{display:flex;flex-direction:column;gap:8px;margin:14px 0;max-height:260px;overflow-y:auto}.deck-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff1;border-radius:12px;padding:10px 12px;font-size:13px}.deck-item-text{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.deck-item-remove{background:none;color:var(--faint);font-size:12px;text-decoration:underline;padding:4px}.empty-note{font-size:13px;color:var(--faint);text-align:center;padding:10px 0}.limit-strip{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;margin-top:18px;border-radius:18px;background:linear-gradient(120deg,#7c5cff4d,#37c6d933);border:1px solid var(--border);font-size:13px;color:var(--dim)}.limit-strip.active-pro{justify-content:center;background:#6fe0a826;border-color:#6fe0a866;color:var(--good);font-weight:600}.pay-panel{margin-top:12px;padding:18px;border-radius:18px;background:#0003;border:1px solid var(--border)}.pay-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #fff2;font-size:14px}.pay-row:last-of-type{border:0}.pay-label{color:var(--faint)}.pay-value{font-weight:600;text-align:right}.copy-btn{background:#fff2;color:var(--dim);font-size:11px;padding:5px 10px;border-radius:999px;margin-left:8px}.pay-note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.5}.redeem-row{display:flex;gap:8px;margin-top:14px}.redeem-row input{margin:0;flex:1;text-transform:uppercase}.redeem-error{font-size:12px;color:var(--review);margin-top:8px}
.splash-overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s var(--ease),visibility .5s}.splash-overlay.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-stack{position:relative;width:90px;height:90px}.splash-card{position:absolute;top:11px;left:18px;width:54px;height:68px;border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 20px #0006}.splash-card-1{background:linear-gradient(135deg,#7c5cffd9,#7c5cff59);animation:fly-left 1s var(--spring) .1s both;z-index:1}.splash-card-2{background:linear-gradient(135deg,#37c6d9d9,#37c6d959);animation:fly-center 1s var(--spring) .25s both;z-index:2}.splash-card-3{background:linear-gradient(135deg,#ff7eb3d9,#ff7eb359);animation:fly-right 1s var(--spring) .4s both;z-index:3}@keyframes fly-left{0%{opacity:0;transform:translate(-180px,-160px) rotate(-160deg) scale(.4)}65%{opacity:1}to{opacity:1;transform:translate(-16px,6px) rotate(-14deg)}}@keyframes fly-center{0%{opacity:0;transform:translate(0,-220px) rotate(90deg) scale(.4)}65%{opacity:1}to{opacity:1;transform:translate(0,-4px)}}@keyframes fly-right{0%{opacity:0;transform:translate(180px,-160px) rotate(160deg) scale(.4)}65%{opacity:1}to{opacity:1;transform:translate(16px,6px) rotate(14deg)}}.splash-word{font-size:26px;font-weight:700;animation:word-in .5s var(--ease) .95s both}@keyframes word-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.study-header{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);padding:0 6px 12px}.dots{display:flex;gap:6px;padding:0 6px 18px}.dot{width:7px;height:7px;border-radius:50%;background:#fff4}.dot.current{background:var(--text);transform:scale(1.4)}.dot.done-good{background:var(--good)}.dot.in-progress{background:var(--accent)}.card-stage{perspective:1600px}.card{position:relative;min-height:260px;border-radius:28px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s var(--spring)}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;padding:32px 26px;display:flex;flex-direction:column;justify-content:center}.face-front{background:var(--glass-strong);border:1px solid var(--border);backdrop-filter:blur(28px) saturate(180%)}.face-back{background:linear-gradient(135deg,#7de0d359,#7c5cff4d);border:1px solid var(--border);backdrop-filter:blur(28px) saturate(180%);transform:rotateY(180deg)}.face-label{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:10px}.face-text{font-size:19px;line-height:1.5}.tap-hint{position:absolute;bottom:16px;right:20px;font-size:12px;color:var(--faint)}.level-chip{position:absolute;top:16px;right:18px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:#fff2;color:var(--dim)}.judge-row{display:flex;gap:10px;margin-top:16px}.judge-btn{flex:1;padding:15px;border-radius:999px;font-size:15px;font-weight:600}.judge-review{background:#ff9e7d33;color:var(--review);border:1px solid #ff9e7d66}.judge-good{background:#6fe0a833;color:var(--good);border:1px solid #6fe0a866}.mastery-note{font-size:12px;color:var(--faint);text-align:center;margin-top:10px}.feedback-msg{padding:16px;text-align:center;font-size:16px;font-weight:600;animation:pop-in .35s var(--spring)}@keyframes pop-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}.quiz-question{padding:28px 26px;margin-bottom:16px}.quiz-question-text{font-size:19px;line-height:1.5}.quiz-options{display:flex;flex-direction:column;gap:10px}.quiz-option{text-align:left;padding:16px 18px;border-radius:16px;background:#fff2;border:1px solid var(--border);color:var(--text);font-size:15px}.quiz-option.correct{background:#6fe0a840;border-color:var(--good)}.quiz-option.wrong{background:#ff9e7d40;border-color:var(--review)}.quiz-option:disabled{cursor:default}.quiz-next-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px}.quiz-feedback{flex:1;font-size:14px;font-weight:600;color:var(--dim);animation:pop-in .35s var(--spring)}.summary{text-align:center;padding:8px 4px}.summary-row{display:flex;justify-content:center;gap:36px;margin:18px 0 26px}.stat-count{font-size:32px;font-weight:700}.stat-label{font-size:13px;color:var(--dim);margin-top:2px}.stat.good .stat-count{color:var(--good)}.stat.review .stat-count{color:var(--review)}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const LIMIT=10,MASTERED=3,PRO_CODE="SABI-7F3K9Q";
const KEYS={mode:"sabikard-studyMode",cards:"sabikard-cards",quiz:"sabikard-quizItems",levels:"sabikard-levels",queue:"sabikard-queue",index:"sabikard-quizIndex",score:"sabikard-quizScore",pro:"sabikard-isPro",name:"sabikard-user-name"};
const GOOD=["Nice one — that's sticking.","You've got this.","Exactly right, keep going.","That's locking in nicely.","You're on it!","Solid. Onward.","You sabi!","Well done jare!"];
const REVIEW=["No wahala, that's what review is for.","Almost — you'll get it next round.","That's okay, it'll come back around soon.","Good instinct to flag it. You'll nail it next time."];
const CORRECT=["Correct — nice work.","That's right, you know this.","Spot on.","Yes! Keep it up.","You sabi!","Well done jare!"];
const WRONG=["Not quite — now you know for next time.","Close, but that's alright.","That one was tricky. Onward.","No wahala — you'll remember this one now."];
function load(key,fallback){try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v)}catch{return fallback}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function clearDeckStorage(){try{Object.values(KEYS).filter(k=>k!==KEYS.pro&&k!==KEYS.name).forEach(k=>localStorage.removeItem(k))}catch{}}
function pick(items){return items[Math.floor(Math.random()*items.length)]}function label(level){return level===0?"New":level===1?"Learning":"Almost there"}function spacing(level){return level===1?2:4}
function summary(missed){return missed===0?"Flawless run — you clearly had this down.":missed<=3?"You stuck with it and got every card mastered. Well done.":"That took some real review, and you pushed through anyway. Solid work."}
function quizSummary(score,total){const pct=total?score/total:0;return pct===1?"Perfect score — you really know this material.":pct>=.7?"Strong performance, just a couple to tighten up.":pct>=.4?"Good start — another pass and this will click.":"That one was tough, but now you know exactly what to review."}
let audioCtx=null;function soundContext(){if(!audioCtx){const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return null;audioCtx=new AudioCtor()}return audioCtx}function tone({freq=880,duration=.06,type="sine",gain=.05,glideTo=null}){try{const ctx=soundContext();if(!ctx)return;const osc=ctx.createOscillator(),amp=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,ctx.currentTime);if(glideTo)osc.frequency.exponentialRampToValueAtTime(glideTo,ctx.currentTime+duration);amp.gain.setValueAtTime(gain,ctx.currentTime);amp.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);osc.connect(amp).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration)}catch{}}
const sfx={click:()=>tone({freq:1200,duration:.045,gain:.04,glideTo:900}),flip:()=>tone({freq:500,duration:.09,type:"triangle",gain:.045,glideTo:750}),good:()=>tone({freq:700,duration:.08,gain:.05,glideTo:1100}),review:()=>tone({freq:380,duration:.1,gain:.045,glideTo:260})};
function Button({children,className="",...props}){return <button type="button" className={className} {...props}>{children}</button>}
function Header({userName}){return <header><div className="brand-row"><div className="logo-stack" aria-hidden="true"><div className="logo-card logo-card-1"/><div className="logo-card logo-card-2"/><div className="logo-card logo-card-3"/></div><h1 className="wordmark">SabiKard</h1></div>{userName?<p className="subtitle">Welcome back, {userName}!</p>:<p className="subtitle">Build your own deck, then quiz yourself until it sticks.</p>}</header>}
function DeckList({items,type,onRemove}){return items.length?<div className="deck-list">{items.map((item,i)=><div className="deck-item" key={i}><span className="deck-item-text">{i+1}. {type==='card'?item.front:item.question}</span><Button className="deck-item-remove" onClick={()=>onRemove(i)}>Remove</Button></div>)}</div>:<div className="empty-note">No {type==='card'?'cards':'questions'} yet — add your first one above.</div>}
function ProPanel({isPro,open,onToggle,onCopy,copied,code,setCode,error,onRedeem}){if(isPro)return <div className="limit-strip active-pro">✓ Pro unlocked — unlimited cards per deck</div>;return <><div className="limit-strip"><span>Free decks are capped at {LIMIT} cards. Pro removes the limit.</span><Button className="btn-small" onClick={onToggle}>{open?"Hide":"Go Pro"}</Button></div>{open&&<div className="pay-panel"><div className="pay-row"><span className="pay-label">Amount</span><strong>₦5,000 (one-time)</strong></div><div className="pay-row"><span className="pay-label">Bank</span><strong>Guaranty Trust Bank</strong></div><div className="pay-row"><span className="pay-label">Account name</span><strong>Henry Amos Jugu</strong></div><div className="pay-row"><span className="pay-label">Account number</span><strong>0567915109<Button className="copy-btn" aria-label="Copy account number" onClick={onCopy}>{copied?"Copied!":"Copy"}</Button></strong></div><div className="pay-note">After you transfer, send proof to <strong>henryshub4u@gmail.com</strong> and you'll get a code back — enter it below to unlock Pro.</div><div className="redeem-row"><input type="text" aria-label="Redeem code" placeholder="Enter code" value={code} onChange={e=>setCode(e.target.value)}/><Button className="btn-small" onClick={onRedeem} disabled={!code.trim()}>Unlock</Button></div>{error&&<div className="redeem-error" aria-live="polite">{error}</div>}</div>}</>}
function NamePrompt({value,onChange,onSubmit}){return <div className="glass panel"><div className="subtitle" style={{marginBottom:6}}>Welcome to SabiKard</div><h2 style={{margin:'0 0 12px',fontSize:28,letterSpacing:'-0.5px'}}>What should we call you?</h2><input type="text" placeholder="Enter your name" value={value} onChange={e=>onChange(e.target.value)} aria-label="Your name"/><div className="row"><span/><Button className="btn-primary" onClick={onSubmit} disabled={!value.trim()}>Continue</Button></div></div>}
function Builder({mode,setMode,cards,quizItems,setCards,setQuizItems,isPro}){const [front,setFront]=useState(""),[back,setBack]=useState(""),[question,setQuestion]=useState(""),[options,setOptions]=useState(["","","",""]),[correct,setCorrect]=useState(0),[payOpen,setPayOpen]=useState(false),[code,setCode]=useState(""),[error,setError]=useState(""),[copied,setCopied]=useState(false);const atLimit=!isPro&&(mode==='flashcards'?cards.length:quizItems.length)>=LIMIT;function addCard(){if(!front.trim()||!back.trim()||atLimit)return;sfx.click();setCards([...cards,{front:front.trim(),back:back.trim()}]);setFront("");setBack("")}function addQuestion(){if(!question.trim()||options.some(o=>!o.trim())||atLimit)return;sfx.click();setQuizItems([...quizItems,{question:question.trim(),options:options.map(o=>o.trim()),correctIndex:correct}]);setQuestion("");setOptions(["","","",""]);setCorrect(0)}function copy(){sfx.click();const n="0567915109";if(navigator.clipboard)navigator.clipboard.writeText(n).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1800)}).catch(()=>window.prompt("Copy account number:",n));else window.prompt("Copy account number:",n)}function redeem(){if(code.trim().toUpperCase()===PRO_CODE){sfx.good();save(KEYS.pro,true);window.location.reload()}else{sfx.review();setError("That code doesn't match. Double-check it and try again.")}}return <div className="glass panel"><div className="mode-row"><Button className={'mode-chip'+(mode==='flashcards'?' active':'')} aria-pressed={mode==='flashcards'} onClick={()=>{sfx.click();setMode('flashcards')}}>Flashcards</Button><Button className={'mode-chip'+(mode==='quiz'?' active':'')} aria-pressed={mode==='quiz'} onClick={()=>{sfx.click();setMode('quiz')}}>Quiz (4 options)</Button></div>{mode==='flashcards'?<><div className="field-label">Question / front</div><input type="text" placeholder="e.g. What is the capital of Nigeria?" value={front} onChange={e=>setFront(e.target.value)}/><div className="field-label">Answer / back</div><textarea placeholder="e.g. Abuja" value={back} onChange={e=>setBack(e.target.value)}/><div className="row"><Button className="btn-ghost" onClick={()=>{sfx.click();setCards([{front:"What powers the light-dependent reactions of photosynthesis?",back:"Sunlight absorbed by chlorophyll, which splits water molecules and generates ATP and NADPH."},{front:"What happens during the Calvin cycle?",back:"ATP and NADPH are used to convert carbon dioxide into glucose."},{front:"Where in the plant cell does photosynthesis take place?",back:"In the chloroplasts, specifically the thylakoids."}])}}>Load a sample deck</Button><Button className="btn-small" onClick={addCard} disabled={!front.trim()||!back.trim()||atLimit}>Add card</Button></div><DeckList items={cards} type="card" onRemove={i=>{sfx.click();setCards(cards.filter((_,x)=>x!==i))}}/><div className="row"><span className="field-label" style={{margin:0}}>{cards.length} card{cards.length!==1?'s':''} added{!isPro?` (max ${LIMIT})`:''}</span><Button className="btn-primary" onClick={()=>window.dispatchEvent(new CustomEvent('study-flashcards'))} disabled={!cards.length}>Study this deck</Button></div></>:<><div className="field-label">Question</div><input type="text" placeholder="e.g. Which planet is closest to the sun?" value={question} onChange={e=>setQuestion(e.target.value)}/><div className="field-label">Options (tap the circle to mark the correct one)</div>{options.map((value,i)=><div className="option-row" key={i}><Button className={'correct-toggle'+(correct===i?' selected':'')} aria-label={correct===i?'Selected as correct answer':'Mark as correct answer'} aria-pressed={correct===i} onClick={()=>{sfx.click();setCorrect(i)}}>{correct===i?'✓':''}</Button><input type="text" placeholder={'Option '+(i+1)} value={value} onChange={e=>setOptions(options.map((o,x)=>x===i?e.target.value:o))}/></div>)}<div className="row"><span/><Button className="btn-small" onClick={addQuestion} disabled={!question.trim()||options.some(o=>!o.trim())||atLimit}>Add question</Button></div><DeckList items={quizItems} type="question" onRemove={i=>{sfx.click();setQuizItems(quizItems.filter((_,x)=>x!==i))}}/><div className="row"><span className="field-label" style={{margin:0}}>{quizItems.length} question{quizItems.length!==1?'s':''} added{!isPro?` (max ${LIMIT})`:''}</span><Button className="btn-primary" onClick={()=>window.dispatchEvent(new CustomEvent('study-quiz'))} disabled={!quizItems.length}>Start quiz</Button></div></>}<ProPanel isPro={isPro} open={payOpen} onToggle={()=>{sfx.click();setPayOpen(!payOpen);setError("")}} onCopy={copy} copied={copied} code={code} setCode={setCode} error={error} onRedeem={redeem}/></div>}
function Flashcards({cards,levels,setLevels,queue,setQueue,done,setDone}){const [flipped,setFlipped]=useState(false),[judging,setJudging]=useState(false),[misses,setMisses]=useState(0),[feedback,setFeedback]=useState("");const current=queue[0];function flip(){sfx.flip();setFlipped(v=>!v)}function judge(outcome){if(judging||!queue.length)return;const idx=current;setJudging(true);setFeedback(pick(outcome==='good'?GOOD:REVIEW));outcome==='good'?sfx.good():sfx.review();setTimeout(()=>{const nextLevels=[...levels],nextQueue=queue.slice(1);if(outcome==='good'){const level=nextLevels[idx]+1;nextLevels[idx]=level;if(level<MASTERED)nextQueue.splice(Math.min(nextQueue.length,spacing(level)),0,idx)}else{nextLevels[idx]=0;nextQueue.splice(Math.min(nextQueue.length,2),0,idx);setMisses(x=>x+1)}setLevels(nextLevels);setQueue(nextQueue);setJudging(false);setFeedback("");if(nextQueue.length)setFlipped(false);else setDone({misses})},600)}if(current===undefined)return null;return <div><div className="study-header"><span>{levels.filter(x=>x>=MASTERED).length} / {cards.length} mastered</span><span>{label(levels[current])}</span></div><div className="dots">{cards.map((_,i)=><div key={i} className={'dot'+(i===current?' current':'')+(levels[i]>=MASTERED?' done-good':levels[i]>0?' in-progress':'')}/>)}</div><div className="card-stage"><div className={'card'+(flipped?' flipped':'')} role="button" tabIndex="0" aria-label="Flip flashcard" onClick={flip} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}}}><div className="face face-front"><div className="level-chip">{label(levels[current])}</div><div className="face-label">Question</div><div className="face-text">{cards[current].front}</div><div className="tap-hint">Tap to reveal</div></div><div className="face face-back"><div className="face-label">Answer</div><div className="face-text">{cards[current].back}</div></div></div></div>{flipped&&!judging&&<div className="judge-row"><Button className="judge-btn judge-review" onClick={()=>judge('review')}>Need to review</Button><Button className="judge-btn judge-good" onClick={()=>judge('good')}>Got it</Button></div>}{judging&&<div className="feedback-msg" aria-live="polite">{feedback}</div>}<div className="mastery-note">Cards you miss come back sooner — get one right {MASTERED} times in a row to master it.</div></div>}
function Quiz({items,index,setIndex,score,setScore,finish}){const [selected,setSelected]=useState(null),[feedback,setFeedback]=useState("");const item=items[index];function choose(i){if(selected!==null)return;const right=i===item.correctIndex;right?sfx.good():sfx.review();setSelected(i);setFeedback(pick(right?CORRECT:WRONG));if(right)setScore(score+1)}function next(){sfx.click();if(index+1<items.length){setIndex(index+1);setSelected(null);setFeedback("")}else finish()}return <div><div className="study-header"><span>Question {index+1} of {items.length}</span><span>{score} correct so far</span></div><div className="glass quiz-question"><div className="quiz-question-text">{item.question}</div></div><div className="quiz-options">{item.options.map((option,i)=><Button key={i} className={'quiz-option'+(selected!==null?(i===item.correctIndex?' correct':i===selected?' wrong':''):'')} disabled={selected!==null} aria-label={'Answer option '+(i+1)+': '+option} onClick={()=>choose(i)}>{option}</Button>)}</div>{selected!==null&&<div className="quiz-next-row"><span className="quiz-feedback" aria-live="polite">{feedback}</span><Button className="btn-primary" onClick={next}>{index+1<items.length?'Next question':'See results'}</Button></div>}</div>}
function App(){const [mode,setMode]=useState(()=>load(KEYS.mode,'flashcards')),[status,setStatus]=useState('build'),[isPro,setIsPro]=useState(()=>load(KEYS.pro,false)),[cards,setCards]=useState(()=>load(KEYS.cards,[])),[quizItems,setQuizItems]=useState(()=>load(KEYS.quiz,[])),[levels,setLevels]=useState(()=>load(KEYS.levels,[])),[queue,setQueue]=useState(()=>load(KEYS.queue,[])),[quizIndex,setQuizIndex]=useState(()=>load(KEYS.index,0)),[quizScore,setQuizScore]=useState(()=>load(KEYS.score,0)),[done,setDone]=useState(null),[splash,setSplash]=useState(true),[userName,setUserName]=useState(()=>load(KEYS.name,'')||''),[nameDraft,setNameDraft]=useState(()=>load(KEYS.name,'')||''),[showNamePrompt,setShowNamePrompt]=useState(()=>!load(KEYS.name,'').trim());useEffect(()=>{save(KEYS.name,userName);},[userName]);useEffect(()=>{save(KEYS.mode,mode);save(KEYS.cards,cards);save(KEYS.quiz,quizItems);save(KEYS.levels,levels);save(KEYS.queue,queue);save(KEYS.index,quizIndex);save(KEYS.score,quizScore);save(KEYS.pro,isPro)},[mode,cards,quizItems,levels,queue,quizIndex,quizScore,isPro]);useEffect(()=>{const a=setTimeout(()=>setSplash(false),3000);return()=>clearTimeout(a)},[]);useEffect(()=>{const flash=()=>{setLevels(Array(cards.length).fill(0));setQueue(cards.map((_,i)=>i));setDone(null);setStatus('study')},quiz=()=>{setQuizIndex(0);setQuizScore(0);setStatus('study')};addEventListener('study-flashcards',flash);addEventListener('study-quiz',quiz);return()=>{removeEventListener('study-flashcards',flash);removeEventListener('study-quiz',quiz)}},[cards]);function clear(){sfx.click();clearDeckStorage();setCards([]);setQuizItems([]);setLevels([]);setQueue([]);setQuizIndex(0);setQuizScore(0);setStatus('build')}function edit(){sfx.click();setStatus('build')}if(splash)return <div className="splash-overlay"><div className="splash-stack"><div className="splash-card splash-card-1"/><div className="splash-card splash-card-2"/><div className="splash-card splash-card-3"/></div><div className="splash-word">SabiKard</div></div>;if(showNamePrompt&&!userName.trim())return <div className="wrap"><Header userName={userName}/><NamePrompt value={nameDraft} onChange={setNameDraft} onSubmit={()=>{const trimmed=nameDraft.trim();if(!trimmed)return;setUserName(trimmed);setShowNamePrompt(false);save(KEYS.name,trimmed)}}/></div>;return <div className="wrap"><Header userName={userName}/>{status==='build'&&<><Builder mode={mode} setMode={setMode} cards={cards} quizItems={quizItems} setCards={setCards} setQuizItems={setQuizItems} isPro={isPro}/>{(cards.length||quizItems.length)&&<div className="row"><span/><Button className="btn-ghost" onClick={clear}>Clear deck &amp; start over</Button></div>}</>}{status==='study'&&mode==='flashcards'&&<Flashcards cards={cards} levels={levels} setLevels={setLevels} queue={queue} setQueue={setQueue} done={done} setDone={v=>{setDone(v);setStatus('done')}}/>}{status==='study'&&mode==='quiz'&&quizItems.length>0&&<Quiz items={quizItems} index={quizIndex} setIndex={setQuizIndex} score={quizScore} setScore={setQuizScore} finish={()=>setStatus('done')}/>} {status==='done'&&mode==='flashcards'&&<div className="glass panel summary"><div className="subtitle">{summary(done?.misses||0)}</div><div className="summary-row"><div className="stat good"><div className="stat-count">{cards.length}</div><div className="stat-label">mastered</div></div><div className="stat review"><div className="stat-count">{done?.misses||0}</div><div className="stat-label">total misses</div></div></div><div className="actions"><Button className="btn-primary" onClick={()=>{setLevels(Array(cards.length).fill(0));setQueue(cards.map((_,i)=>i));setStatus('study')}}>Study this deck again</Button><Button className="btn-ghost" onClick={edit}>Edit deck</Button></div></div>}{status==='done'&&mode==='quiz'&&<div className="glass panel summary"><div className="subtitle">{quizSummary(quizScore,quizItems.length)}</div><div className="summary-row"><div className="stat good"><div className="stat-count">{quizScore}</div><div className="stat-label">correct</div></div><div className="stat review"><div className="stat-count">{quizItems.length-quizScore}</div><div className="stat-label">missed</div></div></div><div className="actions"><Button className="btn-primary" onClick={()=>{setQuizIndex(0);setQuizScore(0);setStatus('study')}}>Retake this quiz</Button><Button className="btn-ghost" onClick={edit}>Edit deck</Button></div></div>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
