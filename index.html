<style>
:root{--hue:270;--bg:#120b24;--bg2:#261052;--glass:rgba(255,255,255,.13);--line:rgba(255,255,255,.3);--text:#f8f5ff;--dim:rgba(248,245,255,.72);--faint:rgba(248,245,255,.48);--accent:hsl(var(--hue) 90% 76%);--accent2:hsl(calc(var(--hue) + 42) 82% 62%);--good:#70e0aa;--review:#ffd88a;--danger:#ff9aa6;--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,1,.36,1)}
@media(prefers-color-scheme:light){:root{--bg:#eeeaff;--bg2:#c7b9ed;--glass:rgba(255,255,255,.38);--line:rgba(55,35,100,.22);--text:#251743;--dim:rgba(37,23,67,.72);--faint:rgba(37,23,67,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,'SF Pro Text','Inter',system-ui,sans-serif;color:var(--text)}body{padding:28px 16px 60px;background:radial-gradient(circle at 15% 8%,hsl(var(--hue) 75% 52%/.36),transparent 35%),radial-gradient(circle at 88% 14%,hsl(calc(var(--hue) + 55) 85% 55%/.25),transparent 38%),linear-gradient(135deg,var(--bg),var(--bg2));transition:background 1s var(--ease),color .35s ease}.wrap{max-width:620px;margin:auto}.button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.4;cursor:default}.brand-row{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;margin-bottom:18px}.logo-stack{position:relative;width:76px;height:76px}.logo-card{position:absolute;width:42px;height:57px;border-radius:13px;border:1px solid var(--line);box-shadow:0 8px 18px #0004;animation:fan .8s var(--spring) both}.logo-card-1{background:linear-gradient(135deg,var(--accent2),#3978d4);transform:translate(-16px,7px) rotate(-16deg);animation-delay:.05s}.logo-card-2{background:linear-gradient(135deg,var(--accent),#4c44c9);transform:translate(0,-8px) rotate(12deg);animation-delay:.15s}.logo-card-3{background:linear-gradient(135deg,#ffb16d,#8c50d9);transform:translate(17px,8px) rotate(20deg);animation-delay:.25s}@keyframes fan{from{opacity:0;transform:translate(0,35px) rotate(0) scale(.55)}to{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1)}}.wordmark{font-size:30px;margin:0;font-weight:800}.subtitle,.small{color:var(--dim);font-size:14px}.small{font-size:12px;color:var(--faint)}.glass{position:relative;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 30px #0003;overflow:hidden}.glass:before{content:"";position:absolute;inset:0 auto auto 0;height:40%;background:linear-gradient(#fff2,transparent);pointer-events:none}.panel{padding:24px}.mode-row,.actions,.row,.history-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mode-row{margin-bottom:18px}.row{justify-content:space-between;margin-top:16px}.mode-chip,.btn,.judge{padding:12px 17px;border-radius:99px;color:var(--text);background:#fff1;border:1px solid transparent;transition:transform .25s var(--spring),background .25s ease,border-color .25s ease}.mode-chip{flex:1;font-weight:700}.mode-chip.active{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}.btn{font-weight:700}.btn-primary{background:var(--text);color:#151022}.btn-danger{background:#ff9aa61a;border-color:#ff9aa655;color:var(--danger)}button:hover{transform:translateY(-1px)}button:active{transform:scale(.97)}.field-label{display:block;margin:14px 0 7px;color:var(--faint);font-size:12px;font-weight:700}input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(8,5,18,.55);color:var(--text);outline:0;transition:.2s}.textarea{min-height:78px;resize:vertical}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}.deck-list,.history-list,.notes-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}.deck-item,.history-item,.note-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:#fff1;border:1px solid #fff1;transition:.25s var(--spring)}.deck-item:hover,.history-item:hover,.note-item:hover{transform:translateY(-1px);background:#fff2}.deck-text,.history-text,.note-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}.remove{background:none;color:var(--faint);text-decoration:underline}.empty{text-align:center;padding:16px;color:var(--faint);font-size:13px}.limit-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;margin:18px 0 8px;border-radius:18px;border:1px solid #ffbd6355;background:#ffbd6318;color:var(--dim);font-size:13px}.pay-panel{padding:16px;border-radius:18px;background:#0002;border:1px solid #fff2}.pay-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #fff2;font-size:13px}.pay-row:last-child{border:0}.redeem{display:flex;gap:8px;margin-top:10px}.error{color:var(--danger);font-size:12px;margin-top:8px}.study-head{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;padding:0 6px 12px}.dots{display:flex;gap:6px;padding:0 6px 18px}.dot{width:7px;height:7px;border-radius:50%;background:#fff3}.dot.current{background:var(--text);transform:scale(1.4)}.dot.active{background:var(--accent)}.card-stage{perspective:1500px;min-height:260px;cursor:pointer}.card{min-height:260px;position:relative;transform-style:preserve-3d;transition:transform .65s var(--ease);border-radius:28px}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;background:linear-gradient(135deg,#fff,rgba(255,255,255,0.0));border-radius:28px;border:1px solid var(--line);backface-visibility:hidden}.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(37,23,67,.3));}.face-label{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}.face-text{font-size:20px;line-height:1.5}.hint{position:absolute;bottom:17px;color:var(--faint);font-size:12px}.judge-row{display:flex;gap:10px;margin-top:18px}.judge{flex:1}.judge.good{border-color:#70e0aa77;background:#70e0aa1c}.judge.review{border-color:#ffd88a66;background:#ffd88a18}.summary{text-align:center}.stats{display:flex;justify-content:center;gap:35px;margin:25px}.stat{display:block;font-size:32px}.stat b{display:block}.quiz-text{font-size:21px;line-height:1.5}.options{display:flex;flex-direction:column;gap:10px}.option{text-align:left;padding:16px;border-radius:16px;background:#fff1;border:1px solid #fff2;color:var(--text);transition:.2s}.option.correct{background:#70e0aa2a;border-color:#70e0aa88}.option.wrong{background:#ff9aa62a;border-color:#ff9aa688;animation:wrong-shake .42s ease}.wrong-answer{animation:wrong-shake .42s ease}@keyframes wrong-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}.summary{padding:0}.state{display:flex;justify-content:center;gap:35px;margin:25px}.state b{display:block;font-size:32px}.notes-editor textarea{min-height:150px;resize:vertical}.notes-meta{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.note-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-date{font-size:11px;color:var(--faint)}.note-text{max-height:80px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}.spark{position:fixed;z-index:100;pointer-events:none;font-size:14px;color:var(--accent);animation:spark .65s ease-out forwards}@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(35deg)}}@media (prefers-reduced-motion:reduce),*,:before,:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;const LIMIT=10,MASTERED=3,PRO_CODE='SABI-7F3K9Q';const KEYS={cards:'sabikard-cards',quiz:'sabikard-quizItems',history:'sabikard-questionHistory',notes:'sabikard-notes',levels:'sabikard-levels',queue:'sabikard-queue',pro:'sabikard-isPro',name:'sabikard-user-name',mode:'sabikard-studyMode',hue:'sabikard-hue'};
const GOOD=['Nice one! That\'s sticking.','Exactly right, keep going.','You\'ve got this.'];const REVIEW=['Almost — that\'s a good review cue.','Close! One more pass and it clicks.','Nice instinct, just one more look.'];const WRONG=['Not quite — now you know what to review.','Close, but that\'s not the one.','That\'s a miss; review it and try again.'];

function safeLoad(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    if (value === null) return fallback;
    const parsed = JSON.parse(value);
    return parsed;
  } catch (error) {
    try { localStorage.removeItem(key); } catch (e) {}
    return fallback;
  }
}

function safeSave(key, value) {
  try {
    const payload = JSON.stringify(value);
    localStorage.setItem(key, payload);
    return true;
  } catch (error) {
    return false;
  }
}

function sanitizeText(value) {
  return String(value ?? '').trim();
}

function makeId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function normalizeCard(item, fallbackIndex) {
  const front = sanitizeText(item && item.front);
  const back = sanitizeText(item && item.back);
  if (!front || !back) return null;
  return {
    id: item && item.id ? item.id : makeId(),
    type: 'card',
    front,
    back,
    createdAt: item && item.createdAt ? item.createdAt : new Date().toISOString(),
    index: fallbackIndex
  };
}

function normalizeQuiz(item, fallbackIndex) {
  const question = sanitizeText(item && item.question);
  const options = Array.isArray(item && item.options) ? item.options.map(v => sanitizeText(v)).filter(Boolean) : [];
  const correctIndex = Number(item && item.correctIndex);
  if (!question || options.length < 2 || Number.isNaN(correctIndex) || correctIndex < 0 || correctIndex >= options.length) return null;
  return {
    id: item && item.id ? item.id : makeId(),
    type: 'quiz',
    question,
    options,
    correctIndex,
    createdAt: item && item.createdAt ? item.createdAt : new Date().toISOString(),
    index: fallbackIndex
  };
}

function normalizeHistory(item) {
  if (!item || typeof item !== 'object') return null;
  const type = item.type === 'quiz' || item.type === 'card' ? item.type : 'card';
  const content = type === 'card' ? sanitizeText(item.front) : sanitizeText(item.question);
  if (!content) return null;
  return {
    id: item.id || makeId(),
    type,
    front: type === 'card' ? content : item.front || '',
    question: type === 'quiz' ? content : item.question || '',
    back: item.back || '',
    options: Array.isArray(item.options) ? item.options.map(v => sanitizeText(v)).filter(Boolean) : [],
    correctIndex: Number(item.correctIndex) || 0,
    createdAt: item.createdAt || new Date().toISOString()
  };
}

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function buzz(ms=25){if(navigator.vibrate)try{navigator.vibrate(ms)}catch{}}
function Button(props){return <button type="button" {...props} onClick={e=>{spark(e);props.onClick&&props.onClick(e)}}>{props.children}</button>}
function spark(e){const n=6;for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'✦':'·';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--dx',(Math.random()*46-23)+'px');s.style.setProperty('--dy',(Math.random()*42-8)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}
function addHistory(history, item) {
  const subject = normalizeHistory(item);
  if (!subject) return history;
  const next = [subject, ...history.filter(it => it && it.id !== subject.id)].slice(0, 60);
  return next;
}
function Header({name,hue,setHue,setPage,page}){const colors=[270,220,185,145,315],labels={270:'Purple',220:'Blue',185:'Cyan',145:'Neon',315:'Magenta'};return <header><div className="brand-row"><div className="logo-stack"><div className="logo-card logo-card-1"/ ><div className="logo-card logo-card-2"/ ><div className="logo-card logo-card-3"/ ></div><div><h1 className="wordmark">SabiKard</h1><p className="subtitle">{name ? `Welcome back, ${name}!` : 'Build your own deck, then quiz yourself until it sticks.'}</p></div></div><div className="actions" style={{justifyContent:'center',marginTop:0}}><Button className="btn btn-ghost" onClick={()=>setHue(colors[(colors.indexOf(hue)+1)%colors.length])}>Colour: {labels[hue]}</Button><Button className="btn btn-ghost" onClick={()=>setPage(page==='notes'?'build':'notes')}>{page==='notes'?'Deck':'Notes'}</Button></div></header>}

function Pro({isPro,open,setOpen}){const [code,setCode]=useState(''),[error,setError]=useState('');if(isPro)return <div className="limit-strip" style={{borderColor:'#70e0aa77',background:'#70e0aa18'}}><span>Pro unlocked — unlimited cards per deck.</span></div>;return <><div className="limit-strip"><span>Free decks cap at {LIMIT} cards. Pro removes the limit.</span><Button className="btn btn-small btn-ghost" onClick={()=>setOpen(!open)}>{open?'Hide':'Go Pro'}</Button></div>{open && <div className="pay-panel"><div className="pay-row"><span>Amount</span><b>£5,000 (one-time)</b></div><div className="pay-row"><span>Bank</span><b>Guarantee Trust Bank</b></div><div className="pay-row"><span>Account</span><b>05679151109</b></div><p className="small">After payment, send proof to henryshub4u@gmail.com for your unlock code.</p><div className="redeem"><input placeholder="Enter code" value={code} onChange={e=>setCode(e.target.value)} /><Button className="btn btn-small btn-primary" disabled={!code.trim()} onClick={()=>{if(code.trim().toUpperCase()===PRO_CODE){safeSave(KEYS.pro,true);location.reload()} else {setError('That code does not match.');buzz(80)}}}>Unlock</Button></div>{error && <div className="error">{error}</div>}</div>}</>}</n>

function List({items,type,remove}){return items.length ? <div className="deck-list">{items.map((x,i)=><div className="deck-item" key={x.id||i}><span className="deck-text">{i+1}. {type==='card'?x.front:x.question}</span><Button className="remove" onClick={()=>remove(i)}>Remove</Button></div>)}</div> : <div className="empty">No {type==='card'?'cards':'questions'} yet — add your first one above.</div>}

function Builder({mode,setMode,cards,setCards,quiz,setQuiz,history,setHistory,isPro,setPage}){const [front,setFront]=useState(''),[back,setBack]=useState(''),[question,setQuestion]=useState(''),[opts,setOpts]=useState(['','','','']),[correct,setCorrect]=useState(0),[open,setOpen]=useState(false);const limit = !isPro && mode==='cards' ? cards.length >= LIMIT : !isPro && mode==='quiz' ? quiz.length >= LIMIT : false;
function addCard(){if(!front.trim() || !back.trim() || limit) return;const item={id:makeId(),type:'card',front:front.trim(),back:back.trim(),createdAt:new Date().toISOString()};setCards(prev => [...prev, item]);setHistory(prev => addHistory(prev, item));setFront('');setBack('');}
function addQuiz(){if(!question.trim() || opts.some(x => !x.trim()) || limit) return;const item={id:makeId(),type:'quiz',question:question.trim(),options:opts.map(x=>x.trim()),correctIndex:correct,createdAt:new Date().toISOString()};setQuiz(prev => [...prev, item]);setHistory(prev => addHistory(prev, item));setQuestion('');setOpts(['','','','']);setCorrect(0);}
return <div className="glass panel"><div className="mode-row"><Button className={`mode-chip ${mode==='cards' ? 'active':''}`} onClick={()=>setMode('cards')}>Flashcards</Button><Button className={`mode-chip ${mode==='quiz' ? 'active':''}`} onClick={()=>setMode('quiz')}>Quiz (4 options)</Button></div><Pro isPro={isPro} open={open} setOpen={setOpen} />{mode==='cards' ? <><label className="field-label">Question / front</label><input value={front} onChange={e=>setFront(e.target.value)} placeholder="e.g. What is the capital of Nigeria?" /><label className="field-label">Answer / back</label><textarea className="textarea" value={back} onChange={e=>setBack(e.target.value)} placeholder="e.g. Abuja" /><div className="actions"><Button className="btn btn-primary" disabled={limit || !front.trim() || !back.trim()} onClick={addCard}>Add card</Button></div><List items={cards} type="card" remove={i => setCards(prev => prev.filter((_,n)=>n!==i))} /><div className="row"><span className="small">{cards.length} cards { !isPro && ` / max ${LIMIT}`}</span><Button className="btn btn-primary" disabled={!cards.length} onClick={()=>{const event = new Event('study-cards'); document.dispatchEvent(event)}}>Study this deck</Button></div></> : <><label className="field-label">Question</label><input value={question} onChange={e=>setQuestion(e.target.value)} placeholder="e.g. Which planet is closest to the sun?" /><label className="field-label">Options — mark the correct answer</label>{opts.map((x,i)=><div style={{display:'flex',gap:8,marginBottom:8}} key={i}><Button className={`btn btn-small btn-ghost`} onClick={()=>setCorrect(i)}>{correct===i ? '✓ ' : ''}{`Option ${i+1}`}</Button><input value={x} onChange={e=>setOpts(prev=>prev.map((v,n)=>n===i?e.target.value:v))} placeholder={`Option ${i+1}`} /></div>)}</><div className="actions"><Button className="btn btn-primary" disabled={limit || !question.trim() || opts.some(x => !x.trim())} onClick={addQuiz}>Add question</Button></div><List items={quiz} type="quiz" remove={i => setQuiz(prev => prev.filter((_,n)=>n!==i))} /><div className="row"><span className="small">{quiz.length} questions { !isPro && ` / max ${LIMIT}`}</span><Button className="btn btn-primary" disabled={!quiz.length} onClick={()=>{const event = new Event('study-quiz'); document.dispatchEvent(event)}}>Start quiz</Button></div></>}</div>}

function Notes({notes,setNotes}){const [title,setTitle]=useState(''),[body,setBody]=useState(''),[editing,setEditing]=useState(null);function saveNote(){if(!title.trim() && !body.trim()) return;const item={id:editing?.id || makeId(),title:title.trim() || 'Untitled note',body:body.trim(),updatedAt:new Date().toISOString()};setNotes(prev => editing ? prev.map(n => n.id === editing.id ? item : n) : [item,...prev]);setTitle('');setBody('');setEditing(null);}function editNote(note){setEditing(note);setTitle(note.title);setBody(note.body);}return <div className="glass panel"><div className="row" style={{marginTop:0}}><h2 style={{margin:0}}>Notes</h2><Button className="btn btn-ghost" onClick={()=>{setEditing(null);setTitle('');setBody('')}}>New note</Button></div><p className="small">Keep study notes beside your decks.</p><label className="field-label">Title</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Note title" /><label className="field-label">Note</label><textarea className="textarea notes-editor" value={body} onChange={e=>setBody(e.target.value)} placeholder="Write your notes here..." /><div className="actions"><Button className="btn btn-primary" disabled={!title.trim() && !body.trim()} onClick={saveNote}>{editing ? 'Save changes' : 'Save note'}</Button></div></div>}

function Cards({cards,levels,setLevels,queue,setQueue,finish}){const [flip,setFlip]=useState(false),[busy,setBusy]=useState(false),[misses,setMisses]=useState(0),[message,setMessage]=useState('');const valid = queue.filter(i => Number.isInteger(i) && i >= 0 && i < cards.length);const current = valid[0];useEffect(()=>{if(valid.length === 0 && queue.length !== 0){setQueue([]);}},[valid.length,queue.length,setQueue]);if(!cards.length) return <div className="glass panel"><p className="subtitle">No cards available.</p></div>;if(current===undefined) return <div className="glass panel summary"><p className="subtitle">Study session complete</p><div className="state"><div className="stat"><b>{cards.length - misses}</b><span className="small">mastered</span></div><div className="stat"><b>{misses}</b><span className="small">misses</span></div></div><Button className="btn btn-primary" onClick={()=>{setLevels(Array(cards.length).fill(0));setQueue(cards.map((_,i)=>i));setMisses(0);setMessage('');}}>Study again</Button><Button className="btn btn-ghost" onClick={finish}>Edit deck</Button></div>;const item = cards[current],level = levels[current] || 0;function judge(ok){if(busy) return;setBusy(true);const nextLevels = [...levels];const nextQueue = valid.slice(1);if(ok){nextLevels[current] = Math.min(level + 1, MASTERED);setMessage(GOOD[Math.min(level,GOOD.length-1)]);setQueue(nextQueue);} else {nextLevels[current] = Math.max(0, level - 1);setMisses(m=>m+1);setMessage(REVIEW[Math.min(level,REVIEW.length-1)]);setQueue([...nextQueue, current]);}setLevels(nextLevels);setTimeout(()=>{setFlip(false);setBusy(false);setMessage('');},650)}return <div className="glass panel"><div className="study-head"><span>{valid.length} cards left</span><span>{level===0 ? 'New' : level===1 ? 'Learning' : level===2 ? 'Almost there' : 'Mastered'}</span></div><div className="dots">{cards.map((_,i)=><span key={i} className={`dot ${i===current?'current':''} ${valid.includes(i)?'active':''}`} />)}</div><div className="card-stage" onClick={()=>!busy && setFlip(!flip)}><div className={`card ${flip ? 'flipped':''}`}><div className="face"><div className="face-label">Question</div><div className="face-text">{item.front}</div><div className="hint">Tap to reveal</div></div><div className="face back"><div className="face-label">Answer</div><div className="face-text">{item.back}</div></div></div></div>{message && <div className="feedback">{message}</div>}<div className="judge-row"><Button className="judge good" disabled={busy} onClick={e=>{e.stopPropagation();judge(true)}}>I got it</Button><Button className="judge review" disabled={busy} onClick={e=>{e.stopPropagation();judge(false)}}>Need review</Button></div></div>}

function Quiz({items,finish}){const [i,setI]=useState(0),[score,setScore]=useState(0),[selected,setSelected]=useState(null),[message,setMessage]=useState('');const x = items[i];if(!x) return null;function choose(n){if(selected!==null) return;const ok = n===x.correctIndex;setSelected(n);setMessage(ok ? pick(GOOD) : pick(WRONG));if(ok) setScore(s => s + 1);setTimeout(()=>{if(i+1 < items.length){setI(i+1);setSelected(null);setMessage('');} else {finish(score + (ok?1:0));}},700)}return <div className="glass panel"><div className="study-head"><span>Question {i+1} of {items.length}</span><span>{score} correct</span></div><div className="quiz-text">{x.question}</div><div className="options">{x.options.map((o,n)=><Button className={`option ${selected !== null && n === x.correctIndex ? 'correct' : selected === n ? 'wrong' : ''}`} disabled={selected!==null} onClick={()=>choose(n)} key={n}>{o}</Button>)}</div>{selected!==null && <div className="feedback"><span>{message}</span></div>}</div>}

function App(){const [mode,setMode]=useState(safeLoad(KEYS.mode,'cards'));const [cards,setCards]=useState(safeLoad(KEYS.cards, []).map((x,i)=> normalizeCard(x,i)).filter(Boolean));const [quiz,setQuiz]=useState(safeLoad(KEYS.quiz, []).map((x,i)=> normalizeQuiz(x,i)).filter(Boolean));const [history,setHistory]=useState(safeLoad(KEYS.history, []).map(normalizeHistory).filter(Boolean));const [notes,setNotes]=useState(safeLoad(KEYS.notes, []).map(item => ({...item, id:item.id || makeId(), title:item.title || 'Untitled note', body:item.body || '', updatedAt:item.updatedAt || new Date().toISOString()})));const [levels,setLevels]=useState(safeLoad(KEYS.levels, Array(cards.length).fill(0)));const [queue,setQueue]=useState(safeLoad(KEYS.queue, cards.map((_,i)=>i)));const [name,setName]=useState(safeLoad(KEYS.name,''));const [hue,setHue]=useState(safeLoad(KEYS.hue,270));const [page,setPage]=useState('build');const [status,setStatus]=useState('build');const [pro,setPro]=useState(safeLoad(KEYS.pro,false));const [result,setResult]=useState(null);const [splash,setSplash]=useState(true);
useEffect(()=>{document.documentElement.style.setProperty('--hue',hue);safeSave(KEYS.hue,hue);},[hue]);useEffect(()=>{safeSave(KEYS.mode,mode);safeSave(KEYS.cards,cards);safeSave(KEYS.quiz,quiz);safeSave(KEYS.history,history);safeSave(KEYS.notes,notes);safeSave(KEYS.levels,levels);safeSave(KEYS.queue,queue);safeSave(KEYS.pro,pro);safeSave(KEYS.name,name);},[mode,cards,quiz,history,notes,levels,queue,pro,name]);useEffect(()=>{const t=setTimeout(()=>setSplash(false),1800);return ()=>clearTimeout(t)},[]);useEffect(()=>{if(cards.length && !levels.length){setLevels(Array(cards.length).fill(0));}}
useEffect(()=>{if(queue.length === 0 && cards.length){setQueue(cards.map((_,i)=>i));}},[cards,queue]);function clear(){setCards([]);setQuiz([]);setHistory([]);setLevels([]);setQueue([]);setStatus('build');safeSave(KEYS.cards,[]);safeSave(KEYS.quiz,[]);safeSave(KEYS.history,[]);safeSave(KEYS.levels,[]);safeSave(KEYS.queue,[]);}if(!name.trim()) return <div className="wrap"><Header name="" hue={hue} setHue={setHue} setPage={setPage} page={page} /><div className="glass panel"><p className="subtitle">Welcome to SabiKard</p><h2>What should we call you?</h2><input value={name} onChange={e=>setName(e.target.value)} placeholder="Enter your name" /><div className="actions"><Button className="btn btn-primary" disabled={!name.trim()} onClick={()=>setName(name.trim())}>Continue</Button></div></div></div>;if(splash) return <div className="wrap"><div className="splash"><div className="splash-stack"><div className="splash-card" /><div className="splash-card" /><div className="splash-card" /></div><div className="splash-word">SabiKard</div></div></div>;const header = <Header name={name} hue={hue} setHue={setHue} setPage={setPage} page={page} />;if(page==='notes') return <div className="wrap">{header}<Notes notes={notes} setNotes={setNotes} /></div>;if(status==='cards') return <div className="wrap">{header}<Cards cards={cards} levels={levels} setLevels={setLevels} queue={queue} setQueue={setQueue} finish={()=>setStatus('build')} /></div>;if(status==='quiz') return <div className="wrap">{header}<Quiz items={quiz} finish={n=>{setResult(n);setStatus('result')}} /></div>;if(status==='result') return <div className="wrap">{header}<div className="glass panel summary"><h2>Quiz complete</h2><div className="state"><div className="stat"><b>{result}</b><span className="small">correct</span></div><div className="stat"><b>{quiz.length - result}</b><span className="small">missed</span></div></div><p className="subtitle">{result===quiz.length ? 'Perfect score — you sabi!': result > quiz.length/2 ? 'Keep reviewing and you\'ll get even stronger.' : 'Keep reviewing and try again.'}</p><div className="actions"><Button className="btn btn-primary" onClick={()=>setStatus('quiz')}>Retake quiz</Button><Button className="btn btn-ghost" onClick={()=>setStatus('build')}>Edit deck</Button></div></div></div>;return <div className="wrap">{header}<Builder mode={mode} setMode={setMode} cards={cards} setCards={setCards} quiz={quiz} setQuiz={setQuiz} history={history} setHistory={setHistory} isPro={pro} setPage={setPage} />{history.length>0 && <div className="glass panel"><div className="row" style={{marginTop:0}}><h2 style={{margin:0}}>Question history</h2><Button className="btn btn-danger" disabled={!history.length} onClick={()=>setHistory([])}>Clear</Button></div><p className="small">Saved on this device for future reuse.</p><div className="history-list">{history.map((item,i)=><div className="history-item" key={item.id || i}><span className="history-text">{item.type==='card' ? item.front : item.question}</span><Button className="btn btn-small btn-ghost" onClick={()=>{if(item.type==='card'){setMode('cards');setPage('build');setStatus('build');} else {setMode('quiz');setPage('build');setStatus('build');}}}>Reuse</Button><Button className="btn btn-small btn-danger" onClick={()=>setHistory(prev => prev.filter((_,n)=>n!==i))}>Delete</Button></div>)}</div></div>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
