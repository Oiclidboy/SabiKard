<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SabiKard helps you build personal flashcard decks and quizzes using active recall." />
  <title>SabiKard — Learn your way</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7fb;background:#101827;line-height:1.5}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at top,#24415b,#101827 60%);min-height:100vh}.wrap{width:min(920px,calc(100% - 32px));margin:auto;padding:32px 0 56px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:42px;height:42px;border-radius:12px;background:#7de0d3;box-shadow:8px 8px 0 #e5a86b;transform:rotate(-6deg)}h1{font-size:1.65rem;margin:0}h2{margin:0 0 6px}.muted{color:#b9c4d3}.panel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:22px;backdrop-filter:blur(14px);margin-top:16px}.tabs,.actions,.row{display:flex;gap:10px;flex-wrap:wrap}.tabs{margin:18px 0}.tabs button{flex:1}.field{display:grid;gap:6px;margin:14px 0}label{font-weight:600}input,textarea,select{width:100%;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(0,0,0,.18);color:inherit;padding:11px;font:inherit}textarea{min-height:90px;resize:vertical}button,.file-button{border:0;border-radius:10px;padding:10px 15px;background:#7de0d3;color:#10232b;font:inherit;font-weight:700;cursor:pointer}button.secondary,.file-button{background:rgba(255,255,255,.15);color:inherit;border:1px solid rgba(255,255,255,.25)}button.active{background:#e5a86b;color:#24170d}.cards{display:grid;gap:10px;margin-top:18px}.card-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border-radius:12px;background:rgba(0,0,0,.16)}.card-row small{display:block;color:#b9c4d3}.study-card{min-height:190px;display:grid;place-items:center;text-align:center;padding:28px;border-radius:16px;background:rgba(0,0,0,.2);cursor:pointer}.study-card strong{font-size:1.35rem}.options{display:grid;gap:10px;margin-top:18px}.options button{text-align:left;background:rgba(255,255,255,.14);color:inherit}.options button.correct{background:#4bb895}.options button.wrong{background:#c96969}.notice{color:#7de0d3;margin-top:10px}.empty{text-align:center;padding:24px;color:#b9c4d3}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){.wrap{width:min(100% - 20px,920px);padding-top:20px}.panel{padding:16px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel is required because the app below intentionally uses JSX. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <script type="text/babel">
    const {useEffect,useState}=React;
    const STORAGE_KEY='sabikard-v3';
    const load=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return {}}};
    const uid=()=>window.crypto?.randomUUID?.()||String(Date.now()+Math.random());

    function App(){
      const saved=load();
      const [name,setName]=useState(saved.name||'');
      const [mode,setMode]=useState('flashcards');
      const [cards,setCards]=useState(Array.isArray(saved.cards)?saved.cards:[]);
      const [question,setQuestion]=useState('');
      const [answer,setAnswer]=useState('');
      const [studyIndex,setStudyIndex]=useState(0);
      const [flipped,setFlipped]=useState(false);
      const [quizIndex,setQuizIndex]=useState(0);
      const [score,setScore]=useState(0);
      const [quizChoice,setQuizChoice]=useState(null);
      const [notice,setNotice]=useState('');
      useEffect(()=>localStorage.setItem(STORAGE_KEY,JSON.stringify({name,cards})),[name,cards]);
      const announce=(text)=>{setNotice(text);window.setTimeout(()=>setNotice(''),2200)};
      const addCard=()=>{const q=question.trim(),a=answer.trim();if(!q||!a)return announce('Add both a question and an answer.');setCards([...cards,{id:uid(),question:q,answer:a}]);setQuestion('');setAnswer('');announce('Card added.');};
      const removeCard=(id)=>setCards(cards.filter(c=>c.id!==id));
      const exportDeck=()=>{const blob=new Blob([JSON.stringify({name,cards},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sabikard-deck.json';a.click();URL.revokeObjectURL(url)};
      const importDeck=(event)=>{const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.cards))throw Error();setCards(data.cards.filter(c=>c.question&&c.answer).map(c=>({...c,id:c.id||uid()})));if(data.name)setName(data.name);announce('Deck imported.')}catch{announce('That file is not a valid SabiKard deck.')}};reader.readAsText(file)};
      const start=()=>{if(!cards.length)return announce('Add at least one card first.');setStudyIndex(0);setFlipped(false);setMode('study')};
      const startQuiz=()=>{if(cards.length<1)return announce('Add at least one card first.');setQuizIndex(0);setScore(0);setQuizChoice(null);setMode('quiz')};
      const current=cards[studyIndex];
      const quiz=cards[quizIndex];
      const choices=quiz?[quiz.answer,...cards.filter(c=>c.id!==quiz.id).map(c=>c.answer).slice(0,3)].sort(()=>Math.random()-.5):[];
      const choose=(choice)=>{if(quizChoice!==null)return;setQuizChoice(choice);if(choice===quiz.answer)setScore(score+1)};
      return <main className="wrap">
        <header className="brand"><div className="logo"/><div><h1>SabiKard</h1><div className="muted">Learn your way with active recall.</div></div></header>
        <section className="panel"><h2>Welcome{name?`, ${name}`:''}.</h2><div className="row"><input aria-label="Your name" value={name} onChange={e=>setName(e.target.value)} placeholder="Your name (optional)" /></div></section>
        <div className="tabs"><button className={mode==='flashcards'?'active':''} onClick={()=>setMode('flashcards')}>Build deck</button><button className={mode==='study'?'active':''} onClick={start}>Study cards</button><button className={mode==='quiz'?'active':''} onClick={startQuiz}>Quiz</button></div>
        <div role="status" className="notice">{notice}</div>
        {mode==='flashcards'&&<section className="panel"><h2>Create a flashcard</h2><div className="field"><label htmlFor="question">Question</label><textarea id="question" value={question} onChange={e=>setQuestion(e.target.value)} placeholder="What do you want to remember?" /></div><div className="field"><label htmlFor="answer">Answer</label><textarea id="answer" value={answer} onChange={e=>setAnswer(e.target.value)} placeholder="The answer" /></div><div className="actions"><button onClick={addCard}>Add card</button><button className="secondary" onClick={exportDeck}>Export</button><label className="file-button">Import<input className="sr-only" type="file" accept="application/json,.json" onChange={importDeck}/></label></div><div className="cards">{cards.length?cards.map(c=><div className="card-row" key={c.id}><div><strong>{c.question}</strong><small>{c.answer}</small></div><button className="secondary" onClick={()=>removeCard(c.id)}>Delete</button></div>):<div className="empty">No cards yet. Create your first one above.</div>}</div></section>}
        {mode==='study'&&<section className="panel"><h2>Study card {studyIndex+1} of {cards.length}</h2>{current&&<><div className="study-card" onClick={()=>setFlipped(!flipped)}><strong>{flipped?current.answer:current.question}</strong><span className="muted">Tap to flip</span></div><div className="actions"><button className="secondary" onClick={()=>{setStudyIndex((studyIndex+1)%cards.length);setFlipped(false)}}>Next card</button><button className="secondary" onClick={()=>setMode('flashcards')}>Back to deck</button></div></>}</section>}
        {mode==='quiz'&&<section className="panel"><h2>Question {quizIndex+1} of {cards.length}</h2>{quiz&&<><p><strong>{quiz.question}</strong></p><div className="options">{choices.map((choice,i)=><button key={i} className={quizChoice===choice?(choice===quiz.answer?'correct':'wrong'):''} onClick={()=>choose(choice)}>{choice}</button>)}</div>{quizChoice!==null&&<div className="actions"><span>{quizChoice===quiz.answer?'Correct!':'Not quite.'}</span><button onClick={()=>{if(quizIndex+1<cards.length){setQuizIndex(quizIndex+1);setQuizChoice(null)}else{announce(`Quiz complete: ${score} / ${cards.length}`);setMode('flashcards')}}}>Next</button></div>}</>}</section>}
      </main>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
