<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SabiKard</title>
  <style>
    :root {
      --bg: #efefe9;
      --bg-2: #e1dfd8;
      --line: rgba(17,24,39,.12);
      --ink: #111827;
      --muted: rgba(17,24,39,.7);
      --soft: rgba(17,24,39,.48);
      --accent: #5a67ff;
      --accent-2: #6d63ff;
      --panel: rgba(255,255,255,.18);
      --panel-strong: rgba(255,255,255,.78);
      --shadow: 0 18px 40px rgba(17,21,36,.12);
      --radius: 26px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--ink);
    }
    body {
      padding: 20px 12px 96px;
    }
    button, input, textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255,255,255,.2);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.28);
      color: var(--ink);
      padding: 12px 14px;
    }
    textarea { min-height: 100px; resize: vertical; }

    .app {
      max-width: 980px;
      margin: 0 auto;
    }

    .page {
      display: grid;
      gap: 18px;
    }

    .soft-card, .content-card {
      background: rgba(255,255,255,.16);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 30px 12px 18px;
      text-align: center;
    }
    .chip-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: rgba(255,255,255,.8);
      border: 1px solid var(--line);
    }
    .hero h1 {
      margin: 8px 0 10px;
      font-size: clamp(2.8rem, 7vw, 5rem);
      letter-spacing: -.06em;
      line-height: .96;
    }
    .hero .sub {
      margin: 0 auto;
      max-width: 650px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.5rem);
      line-height: 1.35;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      padding: 16px 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.18);
      text-align: center;
    }
    .stat small {
      display: block;
      margin-bottom: 6px;
      color: var(--soft);
      text-transform: uppercase;
      font-size: .68rem;
      letter-spacing: .09em;
    }
    .stat strong {
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: -.05em;
    }

    .content-card {
      padding: 18px 18px 16px;
    }

    .mini-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      font-size: .92rem;
      color: var(--muted);
    }
    .brand-block {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: var(--ink);
    }
    .brand-dot {
      width: 18px;
      height: 18px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4d6ce7, #6a5cf5);
      display: inline-block;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.65);
    }

    .list {
      display: grid;
      gap: 12px;
    }
    .item, .card-item {
      width: 100%;
      text-align: left;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.18);
      border: 1px solid var(--line);
      color: var(--ink);
      display: grid;
      gap: 10px;
    }
    .card-item {
      cursor: pointer;
      transition: border-color .18s ease, transform .18s ease;
    }
    .card-item:hover {
      border-color: rgba(90,103,255,.46);
      transform: translateY(-1px);
    }
    .card-item strong {
      font-size: 1.12rem;
      letter-spacing: -.04em;
    }
    .card-item span {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .cards-header, .row, .alpha-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .room-title {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      letter-spacing: -.06em;
      line-height: .96;
      font-weight: 900;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(17,24,39,.04);
      border: 1px solid var(--line);
      font-size: .8rem;
      font-weight: 700;
    }
    .pill-button {
      border: 0;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
    }
    .pill-button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 10px 20px rgba(92,95,255,.24);
    }
    .pill-button.secondary {
      background: rgba(255,255,255,.42);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .study-shell {
      display: grid;
      gap: 16px;
    }
    .study-card {
      width: min(100%, 760px);
      min-height: 270px;
      margin: 0 auto;
      position: relative;
      display: grid;
      place-items: center;
      perspective: 1000px;
      cursor: pointer;
      border-radius: 30px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255,255,255,.3), rgba(255,255,255,.18));
      box-shadow: var(--shadow);
    }
    .study-card-inner {
      width: 100%;
      min-height: 270px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .6s ease;
    }
    .study-card.flipped .study-card-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 26px;
      backface-visibility: hidden;
      text-align: center;
    }
    .card-face.back { transform: rotateY(180deg); }
    .card-face h2 {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 3.6rem);
      letter-spacing: -.06em;
      line-height: .96;
      font-weight: 900;
    }
    .card-face p {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      color: var(--muted);
      line-height: 1.4;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .field {
      display: grid;
      gap: 8px;
    }
    .field label {
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--soft);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: min(560px, calc(100% - 18px));
      background: rgba(0,0,0,.92);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      z-index: 20;
    }
    .bottom-nav button {
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.85);
      min-height: 54px;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 700;
      padding: 0;
    }
    .bottom-nav button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }

    .muted { color: var(--muted); }
    .error { color: #d23548; }
    .success { color: #0e8d5c; }

    @media (max-width: 700px) {
      .grid-2, .stats-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE = {
        cards: 'sabikard-cards',
        quiz: 'sabikard-quiz-items',
        notes: 'sabikard-notes',
        history: 'sabikard-history',
        hue: 'sabikard-hue',
      };

      const state = {
        page: 'home',
        cards: normalizeList(load(STORAGE.cards, []), normalizeCard),
        quiz: normalizeList(load(STORAGE.quiz, []), normalizeQuiz),
        notes: normalizeList(load(STORAGE.notes, []), normalizeNote),
        history: Array.isArray(load(STORAGE.history, [])) ? load(STORAGE.history, []) : [],
        draftCard: { front: '', back: '' },
        draftQuiz: { question: '', options: ['', '', '', ''], correctIndex: 0 },
        noteDraft: { title: '', body: '' },
        queue: [],
        queueIndex: 0,
        flipped: false,
        message: '',
        messageType: 'success',
      };

      function makeId() {
        if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
        return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      }

      function sanitizeText(value) {
        return String(value ?? '').trim();
      }

      function load(key, fallbackValue) {
        try {
          const raw = localStorage.getItem(key);
          if (raw === null) return fallbackValue;
          return JSON.parse(raw);
        } catch (error) {
          return fallbackValue;
        }
      }

      function save(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (error) {
          return false;
        }
      }

      function persist() {
        save(STORAGE.cards, state.cards);
        save(STORAGE.quiz, state.quiz);
        save(STORAGE.notes, state.notes);
        save(STORAGE.history, state.history);
      }

      function normalizeCard(item) {
        const front = sanitizeText(item && item.front);
        const back = sanitizeText(item && item.back);
        if (!front || !back) return null;
        return { id: item && item.id ? item.id : makeId(), front, back };
      }

      function normalizeQuiz(item) {
        const question = sanitizeText(item && item.question);
        const options = Array.isArray(item && item.options)
          ? item.options.map(v => sanitizeText(v)).filter(Boolean).slice(0, 4)
          : [];
        if (!question || options.length < 2) return null;
        const correctIndex = Number.isInteger(item && item.correctIndex)
          ? Math.max(0, Math.min(Number(item.correctIndex), options.length - 1))
          : 0;
        return { id: item && item.id ? item.id : makeId(), question, options, correctIndex };
      }

      function normalizeNote(item) {
        if (!item || typeof item !== 'object') return null;
        const title = sanitizeText(item.title);
        const body = sanitizeText(item.body);
        if (!title && !body) return null;
        return { id: item.id || makeId(), title: title || 'Untitled note', body };
      }

      function normalizeList(list, fn) {
        return Array.isArray(list) ? list.map(fn).filter(Boolean) : [];
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function setMessage(text, type = 'success') {
        state.message = text;
        state.messageType = type;
      }

      function attachDefaultDataIfNeeded() {
        if (!state.cards.length) {
          state.cards = [
            { id: makeId(), front: 'What is the capital of Japan?', back: 'Tokyo.' },
            { id: makeId(), front: 'What does HTML stand for?', back: 'HyperText Markup Language.' },
          ];
          persist();
        }
      }

      function currentCard() {
        return state.queue[state.queueIndex] || null;
      }

      function shuffleQueue() {
        if (!state.cards.length) {
          state.queue = [];
          state.queueIndex = 0;
          state.flipped = false;
          return;
        }

        const arr = [...state.cards];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        state.queue = arr;
        state.queueIndex = 0;
        state.flipped = false;
      }

      function renderHome() {
        const list = state.cards.slice(0, 10);
        return `
          <div class="page">
            <section class="hero soft-card">
              <div class="chip-badge">8</div>
              <h1>Build memory,<br>not stress.</h1>
              <p class="sub">Practice the things you want to remember with calm, focused study cards and quick quizzes.</p>
            </section>

            <div class="stats-row">
              <div class="stat"><small>Cards</small><strong>${state.cards.length}</strong></div>
              <div class="stat"><small>Quiz</small><strong>${state.quiz.length}</strong></div>
              <div class="stat"><small>Notes</small><strong>${state.notes.length}</strong></div>
              <div class="stat"><small>Review</small><strong>${state.history.length}</strong></div>
            </div>

            <section class="content-card">
              <div class="mini-brand">
                <div class="brand-block"><span class="brand-dot"></span> Your library</div>
                <span class="muted">Saved locally</span>
              </div>
              <div class="list">
                ${list.length ? list.map((card, idx) => `
                  <button type="button" class="card-item" data-action="open-card" data-card-id="${card.id}">
                    <strong>${idx + 1}. ${escapeHtml(card.front)}</strong>
                    <span>${escapeHtml(card.back)}</span>
                  </button>
                `).join('') : '<div class="item"><strong>No cards yet</strong><span>Add a flashcard to get started.</span></div>'}
              </div>
            </section>
          </div>
        `;
      }

      function renderStudy() {
        if (!state.cards.length) {
          return `
            <div class="page">
              <section class="content-card">
                <h2 class="room-title">Study</h2>
                <p class="muted" style="margin: 10px 0 0;">Create a flashcard to start your review session.</p>
              </section>
            </div>
          `;
        }

        if (!state.queue.length) shuffleQueue();
        const current = currentCard();
        return `
          <div class="page">
            <section class="content-card study-shell">
              <div class="alpha-row">
                <h2 class="room-title">Study</h2>
                <span class="tag">${state.queueIndex + 1}/${state.queue.length}</span>
              </div>

              <div class="study-card ${state.flipped ? 'flipped' : ''}" data-action="flip-card" tabindex="0" role="button" aria-label="Flip flashcard">
                <div class="study-card-inner">
                  <div class="card-face front">
                    <h2>${escapeHtml(current ? current.front : 'No card')}</h2>
                  </div>
                  <div class="card-face back">
                    <p>${escapeHtml(current ? current.back : '')}</p>
                  </div>
                </div>
              </div>

              <div class="row">
                <span class="muted">${state.flipped ? 'Answer revealed. Rate your recall.' : 'Tap the card to reveal the answer.'}</span>
                <button type="button" class="pill-button secondary" data-action="shuffle-study">Restart</button>
              </div>

              <div class="row">
                <button type="button" class="pill-button primary" data-action="mark-known">I knew it</button>
                <button type="button" class="pill-button secondary" data-action="mark-review">Review later</button>
              </div>
            </section>
          </div>
        `;
      }

      function renderQuiz() {
        if (!state.quiz.length) {
          return `
            <div class="page">
              <section class="content-card">
                <h2 class="room-title">Quiz</h2>
                <p class="muted" style="margin: 10px 0 0;">Add a quiz question to begin.</p>
              </section>
            </div>
          `;
        }

        const item = state.quiz[0];
        return `
          <div class="page">
            <section class="content-card">
              <div class="alpha-row">
                <h2 class="room-title">Quiz</h2>
                <span class="tag">1/1</span>
              </div>
              <div>
                <h3 style="margin: 14px 0; font-size: clamp(1.6rem, 4vw, 2.6rem); letter-spacing: -.05em;">${escapeHtml(item.question)}</h3>
                <div class="list">
                  ${item.options.map((option, idx) => `
                    <button type="button" class="item" data-action="choose-answer" data-index="${idx}">${escapeHtml(option)}</button>
                  `).join('')}
                </div>
              </div>
            </section>
          </div>
        `;
      }

      function renderCreate() {
        return `
          <div class="page">
            <section class="content-card">
              <div class="alpha-row">
                <h2 class="room-title">Create</h2>
                <div class="row">
                  <button type="button" class="pill-button primary" data-action="set-mode" data-mode="cards">Flashcards</button>
                  <button type="button" class="pill-button secondary" data-action="set-mode" data-mode="quiz">Quiz</button>
                </div>
              </div>

              <div class="grid-2" style="margin-top: 16px;">
                <div class="field">
                  <label>Front</label>
                  <textarea data-field="card-front" placeholder="Front of card">${escapeHtml(state.draftCard.front)}</textarea>
                </div>
                <div class="field">
                  <label>Back</label>
                  <textarea data-field="card-back" placeholder="Answer">${escapeHtml(state.draftCard.back)}</textarea>
                </div>
              </div>

              <div class="row" style="margin-top: 16px;">
                <button type="button" class="pill-button primary" data-action="save-card">Save flashcard</button>
              </div>

              ${state.message ? `<div class="${state.messageType === 'error' ? 'error' : 'success'}" style="margin-top: 12px;">${escapeHtml(state.message)}</div>` : ''}
            </section>
          </div>
        `;
      }

      function renderNotes() {
        return `
          <div class="page">
            <section class="content-card">
              <h2 class="room-title">Notes</h2>
              <div class="grid-2" style="margin-top: 16px;">
                <div class="field">
                  <label>Title</label>
                  <input data-field="note-title" value="${escapeHtml(state.noteDraft.title)}" placeholder="Note title" />
                </div>
                <div class="field">
                  <label>Body</label>
                  <textarea data-field="note-body" placeholder="Write your note...">${escapeHtml(state.noteDraft.body)}</textarea>
                </div>
              </div>
              <div class="row" style="margin-top: 16px;">
                <button type="button" class="pill-button primary" data-action="save-note">Save note</button>
              </div>
              <div class="list" style="margin-top: 16px;">
                ${state.notes.length ? state.notes.map(note => `
                  <div class="item">
                    <strong>${escapeHtml(note.title)}</strong>
                    <span>${escapeHtml(note.body || 'No details yet.')}</span>
                  </div>
                `).join('') : '<div class="item"><strong>No notes yet</strong><span>Write something down and keep it close.</span></div>'}
              </div>
            </section>
          </div>
        `;
      }

      function render() {
        attachDefaultDataIfNeeded();

        const pages = {
          home: renderHome,
          study: renderStudy,
          quiz: renderQuiz,
          create: renderCreate,
          notes: renderNotes,
        };

        const content = pages[state.page] ? pages[state.page]() : renderHome();
        document.getElementById('app').innerHTML = `
          ${content}
          <nav class="bottom-nav" aria-label="Main navigation">
            <button type="button" class="${state.page === 'home' ? 'active' : ''}" data-action="set-page" data-page="home">Home</button>
            <button type="button" class="${state.page === 'study' ? 'active' : ''}" data-action="set-page" data-page="study">Study</button>
            <button type="button" class="${state.page === 'quiz' ? 'active' : ''}" data-action="set-page" data-page="quiz">Quiz</button>
            <button type="button" class="${state.page === 'create' ? 'active' : ''}" data-action="set-page" data-page="create">Create</button>
            <button type="button" class="${state.page === 'notes' ? 'active' : ''}" data-action="set-page" data-page="notes">Notes</button>
          </nav>
        `;
      }

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (!target) return;

        const action = target.dataset.action;

        switch (action) {
          case 'set-page': {
            state.page = target.dataset.page || 'home';
            render();
            break;
          }
          case 'open-card': {
            const card = state.cards.find(item => item.id === target.dataset.cardId);
            if (!card) return;
            state.queue = [card];
            state.queueIndex = 0;
            state.flipped = false;
            state.page = 'study';
            render();
            break;
          }
          case 'flip-card': {
            state.flipped = !state.flipped;
            render();
            break;
          }
          case 'shuffle-study': {
            shuffleQueue();
            render();
            break;
          }
          case 'mark-known': {
            if (state.queue.length) {
              state.cards = state.cards.filter(card => card.id !== state.queue[state.queueIndex].id);
              state.queue = state.cards.slice();
              state.queueIndex = 0;
              state.flipped = false;
              persist();
              render();
            }
            break;
          }
          case 'save-card': {
            const front = sanitizeText(document.querySelector('[data-field="card-front"]').value);
            const back = sanitizeText(document.querySelector('[data-field="card-back"]').value);
            if (!front || !back) {
              setMessage('Both the front and back are required.', 'error');
              render();
              return;
            }
            state.cards.push({ id: makeId(), front, back });
            state.draftCard = { front: '', back: '' };
            setMessage('Flashcard saved.', 'success');
            persist();
            render();
            break;
          }
          case 'save-note': {
            const title = sanitizeText(document.querySelector('[data-field="note-title"]').value);
            const body = sanitizeText(document.querySelector('[data-field="note-body"]').value);
            if (!title && !body) {
              setMessage('Write a note before saving.', 'error');
              render();
              return;
            }
            state.notes.push({ id: makeId(), title: title || 'Untitled note', body });
            state.noteDraft = { title: '', body: '' };
            setMessage('Note saved.', 'success');
            persist();
            render();
            break;
          }
          default:
            break;
        }
      });

      document.addEventListener('input', (event) => {
        const field = event.target.dataset.field;
        if (!field) return;

        if (field === 'card-front') state.draftCard.front = event.target.value;
        if (field === 'card-back') state.draftCard.back = event.target.value;
        if (field === 'note-title') state.noteDraft.title = event.target.value;
        if (field === 'note-body') state.noteDraft.body = event.target.value;
      });

      render();
    })();
  </script>
</body>
</html>
