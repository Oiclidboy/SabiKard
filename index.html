<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SabiKard</title>
  <style>
    :root{--bg:#efefe9;--bg2:#e1dfd8;--ink:#111827;--muted:rgba(17,24,39,.7);--soft:rgba(17,24,39,.48);--line:rgba(17,24,39,.12);--accent:#5a67ff;--accent2:#6d63ff;--shadow:0 18px 40px rgba(17,21,36,.12)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2))}body{padding:20px 12px 96px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.2);transition:.18s ease}button:hover{transform:translateY(-1px)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.28);color:var(--ink)}textarea{min-height:100px;resize:vertical}.app{max-width:980px;margin:auto}.page{display:grid;gap:18px}.soft-card,.content-card{background:rgba(255,255,255,.16);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}.hero{padding:30px 12px 18px;text-align:center}.chip{width:56px;height:56px;margin:auto;border-radius:50%;display:grid;place-items:center;font-weight:800;background:rgba(255,255,255,.8);border:1px solid var(--line)}h1{margin:18px 0 10px;font-size:clamp(2.8rem,7vw,5rem);line-height:.96;letter-spacing:-.06em}.sub{max-width:650px;margin:auto;color:var(--muted);font-size:clamp(1rem,2vw,1.5rem);line-height:1.35}.content-card{padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:16px 14px;text-align:center;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.18)}.stat small{display:block;margin-bottom:6px;color:var(--soft);font-size:.68rem;text-transform:uppercase;letter-spacing:.09em}.stat strong{font-size:clamp(1.2rem,3vw,2rem)}.brand,.row,.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{margin-bottom:12px;color:var(--muted);font-size:.92rem}.brand strong{color:var(--ink)}.dot{display:inline-block;width:18px;height:18px;margin-right:8px;vertical-align:-4px;border-radius:8px;background:linear-gradient(135deg,#4d6ce7,#6a5cf5)}.list{display:grid;gap:12px}.card-item,.item{width:100%;padding:16px;border-radius:18px;background:rgba(255,255,255,.18);border:1px solid var(--line);display:grid;gap:10px}.card-item{text-align:left;cursor:pointer}.card-item:hover{border-color:rgba(90,103,255,.5)}.card-item small{color:var(--soft)}.item p{margin:0;color:var(--muted);white-space:pre-wrap}.title{margin:0;font-size:clamp(1.8rem,5vw,3.2rem);line-height:.96;letter-spacing:-.06em}.tag{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;font-weight:700}.pill{padding:10px 18px;border:0;border-radius:999px;font-weight:700}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.secondary{background:rgba(255,255,255,.42)}.danger{color:#b42335;background:rgba(255,91,91,.1);border-color:rgba(180,35,53,.2)}.study{display:grid;gap:16px}.study-card{width:min(100%,760px);min-height:270px;margin:auto;position:relative;display:grid;place-items:center;perspective:1000px;cursor:pointer;border-radius:30px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.18));box-shadow:var(--shadow)}.inner{width:100%;min-height:270px;position:relative;transform-style:preserve-3d;transition:transform .6s}.study-card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;padding:26px;text-align:center;backface-visibility:hidden}.face.back{transform:rotateY(180deg)}.face h2{margin:0;font-size:clamp(2.1rem,6vw,3.6rem);line-height:.96;letter-spacing:-.06em}.face p{margin:0;font-size:clamp(1.1rem,2vw,1.8rem);color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:8px}.field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--soft)}.nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 18px));display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px;background:rgba(0,0,0,.92);border-radius:999px;z-index:20}.nav button{min-height:54px;padding:0;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.85);font-size:.7rem;font-weight:700}.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}.error{color:#d23548}.success{color:#0e8d5c}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="app" class="app"></div>
<script>
(()=>{
'use strict';
const KEYS={cards:'sabikard-cards',quiz:'sabikard-quiz-items',notes:'sabikard-notes',history:'sabikard-history'};
const state={page:'home',cards:[],quiz:[],notes:[],history:[],draft:{front:'',back:''},noteDraft:{title:'',body:''},queue:[],index:0,flipped:false,message:'',messageType:'success'};
const id=()=>crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const text=v=>String(v??'').trim();
function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function persist(){save(KEYS.cards,state.cards);save(KEYS.quiz,state.quiz);save(KEYS.notes,state.notes);save(KEYS.history,state.history)}
function esc(v){return text(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function card(v){const front=text(v?.front),back=text(v?.back);return front&&back?{id:v?.id||id(),front,back}:null}
function note(v){const title=text(v?.title),body=text(v?.body);return title||body?{id:v?.id||id(),title:title||'Untitled note',body}:null}
function init(){state.cards=(Array.isArray(load(KEYS.cards,[]))?load(KEYS.cards,[]):[]).map(card).filter(Boolean);state.quiz=Array.isArray(load(KEYS.quiz,[]))?load(KEYS.quiz,[]):[];state.notes=(Array.isArray(load(KEYS.notes,[]))?load(KEYS.notes,[]):[]).map(note).filter(Boolean);state.history=Array.isArray(load(KEYS.history,[]))?load(KEYS.history,[]):[]}
function shuffle(){state.queue=[...state.cards].sort(()=>Math.random()-.5);state.index=0;state.flipped=false}
function current(){return state.queue[state.index]||null}
function home(){return `<div class="page"><section class="hero soft-card"><div class="chip">8</div><h1>Build memory,<br>not stress.</h1><p class="sub">Practice the things you want to remember with calm, focused study cards and quick quizzes.</p></section><div class="stats"><div class="stat"><small>Cards</small><strong>${state.cards.length}</strong></div><div class="stat"><small>Quiz</small><strong>${state.quiz.length}</strong></div><div class="stat"><small>Notes</small><strong>${state.notes.length}</strong></div><div class="stat"><small>Review</small><strong>${state.history.length}</strong></div></div><section class="content-card"><div class="brand"><strong><span class="dot"></span>Your library</strong><span>Saved locally</span></div><div class="list">${state.cards.length?state.cards.slice(0,10).map((c,i)=>`<div class="card-item" data-action="open" data-id="${esc(c.id)}" role="button" tabindex="0"><strong>${i+1}. ${esc(c.front)}</strong><small>${esc(c.back)}</small><button type="button" class="pill danger" data-action="delete" data-id="${esc(c.id)}">Delete</button></div>`).join(''):`<div class="item"><strong>No cards yet</strong><p>Add a flashcard to get started.</p></div>`}</div></section></div>`}
function study(){if(!state.cards.length)return `<div class="page"><section class="content-card"><h2 class="title">Study</h2><p class="muted">Create a flashcard to start.</p></section></div>`;if(!state.queue.length)shuffle();const c=current();return `<div class="page"><section class="content-card study"><div class="head"><h2 class="title">Study</h2><span class="tag">${state.index+1}/${state.queue.length}</span></div><div class="study-card ${state.flipped?'flipped':''}" data-action="flip" tabindex="0" role="button"><div class="inner"><div class="face"><h2>${esc(c.front)}</h2></div><div class="face back"><p>${esc(c.back)}</p></div></div></div><div class="row"><span class="muted">${state.flipped?'Answer revealed.':'Tap the card to reveal the answer.'}</span><button class="pill secondary" data-action="restart">Restart</button></div><div class="row"><button class="pill primary" data-action="known">I knew it</button><button class="pill secondary" data-action="next">Review later</button></div></section></div>`}
function create(){return `<div class="page"><section class="content-card"><h2 class="title">Create</h2><div class="grid" style="margin-top:16px"><div class="field"><label>Front</label><textarea data-field="front" placeholder="Front of card">${esc(state.draft.front)}</textarea></div><div class="field"><label>Back</label><textarea data-field="back" placeholder="Answer">${esc(state.draft.back)}</textarea></div></div><div class="row" style="margin-top:16px"><button class="pill primary" data-action="save">Save flashcard</button></div>${state.message?`<div class="${state.messageType}" style="margin-top:12px">${esc(state.message)}</div>`:''}</section></div>`}
function notes(){return `<div class="page"><section class="content-card"><h2 class="title">Notes</h2><div class="grid" style="margin-top:16px"><div class="field"><label>Title</label><input data-field="noteTitle" value="${esc(state.noteDraft.title)}" placeholder="Note title"></div><div class="field"><label>Body</label><textarea data-field="noteBody" placeholder="Write your note...">${esc(state.noteDraft.body)}</textarea></div></div><div class="row" style="margin-top:16px"><button class="pill primary" data-action="saveNote">Save note</button></div><div class="list" style="margin-top:16px">${state.notes.length?state.notes.map(n=>`<div class="item"><strong>${esc(n.title)}</strong><p>${esc(n.body||'No details yet.')}</p></div>`).join(''):'<div class="item"><strong>No notes yet</strong></div>'}</div></section></div>`}
function quiz(){if(!state.quiz.length)return `<div class="page"><section class="content-card"><h2 class="title">Quiz</h2><p class="muted">No quiz questions yet.</p></section></div>`;const q=state.quiz[0];return `<div class="page"><section class="content-card"><h2 class="title">Quiz</h2><h3>${esc(q.question||'Question')}</h3><div class="list">${(q.options||[]).map(o=>`<div class="item">${esc(o)}</div>`).join('')}</div></section></div>`}
function render(){const views={home,study,create,notes,quiz};document.querySelector('#app').innerHTML=`${(views[state.page]||home)()}<nav class="nav">${[['home','Home'],['study','Study'],['quiz','Quiz'],['create','Create'],['notes','Notes']].map(([p,l])=>`<button class="${state.page===p?'active':''}" data-action="page" data-page="${p}">${l}</button>`).join('')}</nav>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='page'){state.page=el.dataset.page;render();return}if(a==='open'){const c=state.cards.find(x=>x.id===el.dataset.id);if(c){state.queue=[c];state.index=0;state.flipped=false;state.page='study';render()}return}if(a==='delete'){e.stopPropagation();const c=state.cards.find(x=>x.id===el.dataset.id);if(!c)return;if(confirm(`Delete “${c.front}”?`)){state.cards=state.cards.filter(x=>x.id!==c.id);state.queue=state.queue.filter(x=>x.id!==c.id);persist();render()}return}if(a==='flip'){state.flipped=!state.flipped;render();return}if(a==='restart'){shuffle();render();return}if(a==='known'){const c=current();if(c){state.cards=state.cards.filter(x=>x.id!==c.id);state.queue=state.queue.filter(x=>x.id!==c.id);state.index=0;state.flipped=false;persist();render()}return}if(a==='next'){if(state.queue.length){state.index=(state.index+1)%state.queue.length;state.flipped=false;render()}return}if(a==='save'){const f=text(document.querySelector('[data-field="front"]').value),b=text(document.querySelector('[data-field="back"]').value);if(!f||!b){state.message='Both the front and back are required.';state.messageType='error';render();return}state.cards.push({id:id(),front:f,back:b});state.draft={front:'',back:''};state.message='Flashcard saved.';state.messageType='success';persist();render();return}if(a==='saveNote'){const t=text(document.querySelector('[data-field="noteTitle"]').value),b=text(document.querySelector('[data-field="noteBody"]').value);if(!t&&!b){state.message='Write a note before saving.';state.messageType='error';render();return}state.notes.push({id:id(),title:t||'Untitled note',body:b});state.noteDraft={title:'',body:''};persist();render()}});
document.addEventListener('input',e=>{const f=e.target.dataset.field;if(f==='front')state.draft.front=e.target.value;if(f==='back')state.draft.back=e.target.value;if(f==='noteTitle')state.noteDraft.title=e.target.value;if(f==='noteBody')state.noteDraft.body=e.target.value});
init();render();
})();
</script>
</body>
</html>
