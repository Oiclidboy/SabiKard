<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SabiKard</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.14);
    --glass-bg-strong: rgba(255, 255, 255, 0.22);
    --glass-border: rgba(255, 255, 255, 0.35);
    --text: #F5F6FA;
    --text-dim: rgba(245, 246, 250, 0.7);
    --text-faint: rgba(245, 246, 250, 0.45);
    --accent: #7DE0D3;
    --good: #6FE0A8;
    --review: #FF9E7D;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    color: var(--text);
  }

  body {
    background:
      radial-gradient(circle at 15% 10%, #7C5CFF 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #37C6D9 0%, transparent 50%),
      radial-gradient(circle at 30% 90%, #FF7EB3 0%, transparent 45%),
      radial-gradient(circle at 80% 85%, #4A5DFF 0%, transparent 50%),
      #1A1730;
    padding: 28px 16px 60px;
    overflow-x: hidden;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  header { margin-bottom: 24px; text-align: center; }
  .brand-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .wordmark { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
  .subtitle { font-size: 14px; color: var(--text-dim); margin: 6px 0 0; }

  .logo-stack { position: relative; width: 34px; height: 34px; flex-shrink: 0; }
  .logo-card {
    position: absolute;
    top: 1px; left: 4px;
    width: 24px; height: 30px;
    border-radius: 6px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .logo-card-1 {
    background: linear-gradient(135deg, rgba(124,92,255,0.7), rgba(124,92,255,0.25));
    animation: fan-left 0.7s var(--spring) 0.05s both;
    z-index: 1;
  }
  .logo-card-2 {
    background: linear-gradient(135deg, rgba(55,198,217,0.7), rgba(55,198,217,0.25));
    animation: fan-center 0.7s var(--spring) 0.15s both;
    z-index: 2;
  }
  .logo-card-3 {
    background: linear-gradient(135deg, rgba(255,126,179,0.7), rgba(255,126,179,0.25));
    animation: fan-right 0.7s var(--spring) 0.25s both;
    z-index: 3;
  }
  @keyframes fan-left {
    from { opacity: 0; transform: translate(0, 4px) rotate(0deg) scale(0.6); }
    to { opacity: 1; transform: translate(-7px, 2px) rotate(-14deg) scale(1); }
  }
  @keyframes fan-center {
    from { opacity: 0; transform: translate(0, 4px) rotate(0deg) scale(0.6); }
    to { opacity: 1; transform: translate(0, -2px) rotate(0deg) scale(1); }
  }
  @keyframes fan-right {
    from { opacity: 0; transform: translate(0, 4px) rotate(0deg) scale(0.6); }
    to { opacity: 1; transform: translate(7px, 2px) rotate(14deg) scale(1); }
  }

  .glass {
    position: relative;
    background: var(--glass-bg);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    overflow: hidden;
  }
  .glass::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }

  .panel { padding: 24px; }

  input[type="text"], textarea {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 13px 14px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: rgba(0,0,0,0.18);
    outline: none;
    font-family: inherit;
    margin-bottom: 10px;
  }
  textarea { min-height: 80px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }
  input:focus, textarea:focus { border-color: var(--accent); }

  .row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; gap: 10px; flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: transform 0.25s var(--spring), background 0.2s var(--ease), opacity 0.2s;
  }
  button:active { transform: scale(0.94); }
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid rgba(125, 224, 211, 0.9);
    outline-offset: 2px;
  }

  .btn-primary { background: var(--text); color: #1A1730; padding: 13px 24px; border-radius: 999px; font-size: 15px; font-weight: 600; }
  .btn-primary:disabled { opacity: 0.35; }
  .btn-ghost { background: rgba(255,255,255,0.12); color: var(--text-dim); padding: 13px 20px; border-radius: 999px; font-size: 14px; border: 1px solid rgba(255,255,255,0.15); }
  .btn-small { background: rgba(255,255,255,0.14); color: var(--text); padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .btn-small:disabled { opacity: 0.35; }

  .mode-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .mode-chip { flex: 1; text-align: center; background: rgba(255,255,255,0.08); color: var(--text-dim); padding: 12px; border-radius: 16px; font-size: 14px; font-weight: 600; border: 1px solid transparent; }
  .mode-chip.active { background: rgba(125,224,211,0.18); color: var(--accent); border-color: rgba(125,224,211,0.5); }

  .field-label { font-size: 12px; color: var(--text-faint); font-weight: 600; margin: 2px 0 6px; }

  .option-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .option-row input[type="text"] { margin-bottom: 0; flex: 1; }
  .correct-toggle {
    width: 34px; height: 34px; min-width: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
    color: var(--text-faint); font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  .correct-toggle.selected { background: rgba(111,224,168,0.25); border-color: var(--good); color: var(--good); }

  .deck-list { margin: 14px 0; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
  .deck-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 12px; font-size: 13px;
  }
  .deck-item-text { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deck-item-remove { background: none; color: var(--text-faint); font-size: 12px; text-decoration: underline; padding: 4px; flex-shrink: 0; }

  .empty-note { font-size: 13px; color: var(--text-faint); text-align: center; padding: 10px 0; }

  .limit-strip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; margin-top: 18px; border-radius: 18px;
    background: linear-gradient(120deg, rgba(124,92,255,0.3), rgba(55,198,217,0.2));
    border: 1px solid var(--glass-border); font-size: 13px; color: var(--text-dim);
  }
  .limit-strip.active-pro { background: rgba(111,224,168,0.15); border-color: rgba(111,224,168,0.4); color: var(--good); justify-content: center; font-weight: 600; }

  .pay-panel {
    margin-top: 12px;
    padding: 18px;
    border-radius: 18px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
  }
  .pay-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
  .pay-row:last-of-type { border-bottom: none; }
  .pay-label { color: var(--text-faint); }
  .pay-value { color: var(--text); font-weight: 600; text-align: right; }
  .copy-btn { background: rgba(255,255,255,0.12); color: var(--text-dim); font-size: 11px; padding: 5px 10px; border-radius: 999px; margin-left: 8px; }
  .pay-note { font-size: 12px; color: var(--text-faint); margin-top: 10px; line-height: 1.5; }
  .redeem-row { display: flex; gap: 8px; margin-top: 14px; }
  .redeem-row input { margin-bottom: 0; flex: 1; text-transform: uppercase; }
  .redeem-error { font-size: 12px; color: var(--review); margin-top: 8px; }

  /* Splash screen */
  .splash-overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: transparent;
    transition: opacity 0.5s var(--ease), visibility 0.5s;
  }
  .splash-overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash-stack { position: relative; width: 90px; height: 90px; }
  .splash-card {
    position: absolute; top: 11px; left: 18px;
    width: 54px; height: 68px; border-radius: 12px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  .splash-card-1 { background: linear-gradient(135deg, rgba(124,92,255,0.85), rgba(124,92,255,0.35)); animation: fly-left 1s var(--spring) 0.1s both; z-index: 1; }
  .splash-card-2 { background: linear-gradient(135deg, rgba(55,198,217,0.85), rgba(55,198,217,0.35)); animation: fly-center 1s var(--spring) 0.25s both; z-index: 2; }
  .splash-card-3 { background: linear-gradient(135deg, rgba(255,126,179,0.85), rgba(255,126,179,0.35)); animation: fly-right 1s var(--spring) 0.4s both; z-index: 3; }

  @keyframes fly-left {
    0% { opacity: 0; transform: translate(-180px, -160px) rotate(-160deg) scale(0.4); }
    65% { opacity: 1; }
    100% { opacity: 1; transform: translate(-16px, 6px) rotate(-14deg) scale(1); }
  }
  @keyframes fly-center {
    0% { opacity: 0; transform: translate(0, -220px) rotate(90deg) scale(0.4); }
    65% { opacity: 1; }
    100% { opacity: 1; transform: translate(0, -4px) rotate(0deg) scale(1); }
  }
  @keyframes fly-right {
    0% { opacity: 0; transform: translate(180px, -160px) rotate(160deg) scale(0.4); }
    65% { opacity: 1; }
    100% { opacity: 1; transform: translate(16px, 6px) rotate(14deg) scale(1); }
  }

  .splash-word {
    font-size: 26px; font-weight: 700; letter-spacing: -0.4px; color: var(--text);
    animation: word-in 0.5s var(--ease) 0.95s both;
  }
  @keyframes word-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .study-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); padding: 0 6px 12px; }
  .dots { display: flex; gap: 6px; padding: 0 6px 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: all 0.3s var(--spring); }
  .dot.current { background: var(--text); transform: scale(1.4); }
  .dot.done-good { background: var(--good); }
  .dot.in-progress { background: var(--accent); }

  .card-stage { perspective: 1600px; }
  .card { position: relative; min-height: 260px; border-radius: 28px; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s var(--spring); }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 28px; padding: 32px 26px; display: flex; flex-direction: column; justify-content: center; }
  .face-front { background: var(--glass-bg-strong); border: 1px solid var(--glass-border); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); }
  .face-back { background: linear-gradient(135deg, rgba(125,224,211,0.35), rgba(124,92,255,0.3)); border: 1px solid var(--glass-border); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); transform: rotateY(180deg); }
  .face-label { font-size: 12px; font-weight: 600; color: var(--text-faint); margin-bottom: 10px; }
  .face-text { font-size: 19px; line-height: 1.5; }
  .tap-hint { position: absolute; bottom: 16px; right: 20px; font-size: 12px; color: var(--text-faint); }
  .level-chip { position: absolute; top: 16px; right: 18px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.15); color: var(--text-dim); }

  .judge-row { display: flex; gap: 10px; margin-top: 16px; }
  .judge-btn { flex: 1; padding: 15px; border-radius: 999px; font-size: 15px; font-weight: 600; }
  .judge-review { background: rgba(255,158,125,0.2); color: var(--review); border: 1px solid rgba(255,158,125,0.4); }
  .judge-good { background: rgba(111,224,168,0.2); color: var(--good); border: 1px solid rgba(111,224,168,0.4); }
  .mastery-note { font-size: 12px; color: var(--text-faint); text-align: center; margin-top: 10px; }
  .feedback-msg { text-align: center; font-size: 16px; font-weight: 600; padding: 16px; color: var(--text); animation: pop-in 0.35s var(--spring); }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

  .quiz-question { padding: 28px 26px; margin-bottom: 16px; }
  .quiz-question-text { font-size: 19px; line-height: 1.5; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-option { text-align: left; padding: 16px 18px; border-radius: 16px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--text); font-size: 15px; }
  .quiz-option.correct { background: rgba(111,224,168,0.25); border-color: var(--good); }
  .quiz-option.wrong { background: rgba(255,158,125,0.25); border-color: var(--review); }
  .quiz-option:disabled { cursor: default; }
  .quiz-next-row { margin-top: 16px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
  .quiz-feedback { flex: 1; font-size: 14px; font-weight: 600; color: var(--text-dim); animation: pop-in 0.35s var(--spring); }

  .summary { text-align: center; padding: 8px 4px; }
  .summary-row { display: flex; justify-content: center; gap: 36px; margin: 18px 0 26px; }
  .stat-count { font-size: 32px; font-weight: 700; }
  .stat-label { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .stat.good .stat-count { color: var(--good); }
  .stat.review .stat-count { color: var(--review); }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// Save/load progress in the browser so closing the tab doesn't lose your deck.
// Fails silently if storage is unavailable (e.g. private browsing) — the app
// just won't remember between visits in that case.
function loadSaved(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveKey(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}
function clearSavedDeck() {
  try {
    ["sabikard-studyMode", "sabikard-cards", "sabikard-quizItems", "sabikard-levels",
     "sabikard-queue", "sabikard-quizIndex", "sabikard-quizScore"].forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}
function computeInitialStatus() {
  const mode = loadSaved("sabikard-studyMode", "flashcards");
  if (mode === "flashcards") {
    const q = loadSaved("sabikard-queue", []);
    return q.length > 0 ? "study" : "build";
  }
  const items = loadSaved("sabikard-quizItems", []);
  const qi = loadSaved("sabikard-quizIndex", 0);
  return (items.length > 0 && qi < items.length) ? "study" : "build";
}

const FREE_CARD_LIMIT = 10;
const MASTERY_LEVEL = 3;
function spacingForLevel(level) { return level === 1 ? 2 : 4; }
function levelLabel(level) { if (level === 0) return "New"; if (level === 1) return "Learning"; return "Almost there"; }
function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

const GOOD_MSGS = ["Nice one — that's sticking.", "You've got this.", "Exactly right, keep going.", "That's locking in nicely.", "You're on it!", "Solid. Onward.", "You sabi!", "Well done jare!"];
const REVIEW_MSGS = ["No wahala, that's what review is for.", "Almost — you'll get it next round.", "That's okay, it'll come back around soon.", "Good instinct to flag it. You'll nail it next time.", "Close call — a quick review will lock it in.", "A bit of practice and that'll stick."];
const QUIZ_CORRECT_MSGS = ["Correct — nice work.", "That's right, you know this.", "Spot on.", "Yes! Keep it up.", "You sabi!", "Well done jare!"];
const QUIZ_WRONG_MSGS = ["Not quite — now you know for next time.", "Close, but that's alright.", "That one was tricky. Onward.", "No wahala — you'll remember this one now."];

function masterySummary(missed) {
  if (missed === 0) return "Flawless run — you clearly had this down.";
  if (missed <= 3) return "You stuck with it and got every card mastered. Well done.";
  return "That took some real review, and you pushed through anyway. Solid work.";
}
function quizSummary(score, total) {
  const pct = total > 0 ? score / total : 0;
  if (pct === 1) return "Perfect score — you really know this material.";
  if (pct >= 0.7) return "Strong performance, just a couple to tighten up.";
  if (pct >= 0.4) return "Good start — another pass and this will click.";
  return "That one was tough, but now you know exactly what to review.";
}

// synthesized UI sound, no external audio files
let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return null;
    audioCtx = new AudioCtor();
  }
  return audioCtx;
}
function playTone({ freq = 880, duration = 0.06, type = "sine", gain = 0.05, glideTo = null }) {
  try {
    const ctx = getCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, ctx.currentTime + duration);
    amp.gain.setValueAtTime(gain, ctx.currentTime);
    amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(amp).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}
const sfx = {
  click: () => playTone({ freq: 1200, duration: 0.045, type: "sine", gain: 0.04, glideTo: 900 }),
  flip: () => playTone({ freq: 500, duration: 0.09, type: "triangle", gain: 0.045, glideTo: 750 }),
  good: () => playTone({ freq: 700, duration: 0.08, type: "sine", gain: 0.05, glideTo: 1100 }),
  review: () => playTone({ freq: 380, duration: 0.1, type: "sine", gain: 0.045, glideTo: 260 }),
};

function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [splashFading, setSplashFading] = useState(false);
  useEffect(() => {
    const fadeTimer = setTimeout(() => setSplashFading(true), 2500);
    const hideTimer = setTimeout(() => setShowSplash(false), 3000);
    return () => { clearTimeout(fadeTimer); clearTimeout(hideTimer); };
  }, []);

  const [studyMode, setStudyMode] = useState(() => loadSaved("sabikard-studyMode", "flashcards"));
  const [status, setStatus] = useState(computeInitialStatus); // 'build' | 'study' | 'done'
  const [isPro, setIsPro] = useState(() => loadSaved("sabikard-isPro", false));

  // flashcard building
  const [cards, setCards] = useState(() => loadSaved("sabikard-cards", []));
  const [draftFront, setDraftFront] = useState("");
  const [draftBack, setDraftBack] = useState("");

  // quiz building
  const [quizItems, setQuizItems] = useState(() => loadSaved("sabikard-quizItems", []));
  const [draftQuestion, setDraftQuestion] = useState("");
  const [draftOptions, setDraftOptions] = useState(["", "", "", ""]);
  const [draftCorrect, setDraftCorrect] = useState(0);

  // flashcard study
  const [levels, setLevels] = useState(() => loadSaved("sabikard-levels", []));
  const [queue, setQueue] = useState(() => loadSaved("sabikard-queue", []));
  const [flipped, setFlipped] = useState(false);
  const [missedEver, setMissedEver] = useState(0);
  const [judging, setJudging] = useState(false);
  const [feedback, setFeedback] = useState("");

  // quiz study
  const [quizIndex, setQuizIndex] = useState(() => loadSaved("sabikard-quizIndex", 0));
  const [quizSelected, setQuizSelected] = useState(null);
  const [quizScore, setQuizScore] = useState(() => loadSaved("sabikard-quizScore", 0));
  const [quizFeedback, setQuizFeedback] = useState("");

  useEffect(() => { saveKey("sabikard-studyMode", studyMode); }, [studyMode]);
  useEffect(() => { saveKey("sabikard-isPro", isPro); }, [isPro]);
  useEffect(() => { saveKey("sabikard-cards", cards); }, [cards]);
  useEffect(() => { saveKey("sabikard-quizItems", quizItems); }, [quizItems]);
  useEffect(() => { saveKey("sabikard-levels", levels); }, [levels]);
  useEffect(() => { saveKey("sabikard-queue", queue); }, [queue]);
  useEffect(() => { saveKey("sabikard-quizIndex", quizIndex); }, [quizIndex]);
  useEffect(() => { saveKey("sabikard-quizScore", quizScore); }, [quizScore]);

  function clearDeck() {
    sfx.click();
    clearSavedDeck();
    setCards([]);
    setQuizItems([]);
    setLevels([]);
    setQueue([]);
    setQuizIndex(0);
    setQuizScore(0);
    setStatus("build");
  }

  const PRO_REDEEM_CODE = "SABI-7F3K9Q";
  const [payPanelOpen, setPayPanelOpen] = useState(false);
  const [redeemInput, setRedeemInput] = useState("");
  const [redeemError, setRedeemError] = useState("");
  const [copied, setCopied] = useState(false);

  function togglePayPanel() {
    sfx.click();
    setPayPanelOpen(!payPanelOpen);
    setRedeemError("");
  }

  function copyAccountNumber() {
    sfx.click();
    const num = "0567915109";
    if (navigator.clipboard) {
      navigator.clipboard.writeText(num).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      }).catch(() => {
        window.prompt("Copy account number:", num);
      });
    } else {
      window.prompt("Copy account number:", num);
    }
  }

  function redeemCode() {
    if (redeemInput.trim().toUpperCase() === PRO_REDEEM_CODE) {
      sfx.good();
      setIsPro(true);
      setPayPanelOpen(false);
      setRedeemInput("");
      setRedeemError("");
    } else {
      sfx.review();
      setRedeemError("That code doesn't match. Double-check it and try again.");
    }
  }

  function addFlashcard() {
    if (!draftFront.trim() || !draftBack.trim()) return;
    if (!isPro && cards.length >= FREE_CARD_LIMIT) return;
    sfx.click();
    setCards([...cards, { front: draftFront.trim(), back: draftBack.trim() }]);
    setDraftFront("");
    setDraftBack("");
  }
  function removeCard(i) {
    sfx.click();
    setCards(cards.filter((_, idx) => idx !== i));
  }

  function updateOption(i, val) {
    const next = [...draftOptions];
    next[i] = val;
    setDraftOptions(next);
  }
  function addQuizItem() {
    const filled = draftOptions.every(o => o.trim());
    if (!draftQuestion.trim() || !filled) return;
    if (!isPro && quizItems.length >= FREE_CARD_LIMIT) return;
    sfx.click();
    setQuizItems([...quizItems, {
      question: draftQuestion.trim(),
      options: draftOptions.map(o => o.trim()),
      correctIndex: draftCorrect
    }]);
    setDraftQuestion("");
    setDraftOptions(["", "", "", ""]);
    setDraftCorrect(0);
  }
  function removeQuizItem(i) {
    sfx.click();
    setQuizItems(quizItems.filter((_, idx) => idx !== i));
  }

  function loadSampleFlashcards() {
    sfx.click();
    setCards([
      { front: "What powers the light-dependent reactions of photosynthesis?", back: "Sunlight absorbed by chlorophyll, which splits water molecules and generates ATP and NADPH." },
      { front: "What happens during the Calvin cycle?", back: "ATP and NADPH are used to convert carbon dioxide into glucose." },
      { front: "Where in the plant cell does photosynthesis take place?", back: "In the chloroplasts, specifically the thylakoids." }
    ]);
  }

  function startFlashcardStudy() {
    if (cards.length === 0) return;
    sfx.click();
    setLevels(new Array(cards.length).fill(0));
    setQueue(cards.map((_, i) => i));
    setFlipped(false);
    setMissedEver(0);
    setStatus("study");
  }

  function startQuiz() {
    if (quizItems.length === 0) return;
    sfx.click();
    setQuizIndex(0);
    setQuizSelected(null);
    setQuizScore(0);
    setStatus("study");
  }

  function toggleFlip() { sfx.flip(); setFlipped(!flipped); }

  function judge(outcome) {
    if (judging || queue.length === 0) return;
    const cardIdx = queue[0];
    setJudging(true);
    setFeedback(outcome === "good" ? randomFrom(GOOD_MSGS) : randomFrom(REVIEW_MSGS));
    outcome === "good" ? sfx.good() : sfx.review();

    setTimeout(() => {
      const newLevels = [...levels];
      let newQueue = queue.slice(1);
      if (outcome === "good") {
        const newLevel = levels[cardIdx] + 1;
        newLevels[cardIdx] = newLevel;
        if (newLevel < MASTERY_LEVEL) {
          const pos = Math.min(newQueue.length, spacingForLevel(newLevel));
          newQueue.splice(pos, 0, cardIdx);
        }
      } else {
        newLevels[cardIdx] = 0;
        const pos = Math.min(newQueue.length, 2);
        newQueue.splice(pos, 0, cardIdx);
        setMissedEver(m => m + 1);
      }
      setLevels(newLevels);
      setJudging(false);
      setFeedback("");
      setQueue(newQueue);
      if (newQueue.length === 0) setStatus("done");
      else setFlipped(false);
    }, 600);
  }

  function selectOption(i) {
    if (quizSelected !== null) return;
    const correct = i === quizItems[quizIndex].correctIndex;
    correct ? sfx.good() : sfx.review();
    setQuizSelected(i);
    setQuizFeedback(correct ? randomFrom(QUIZ_CORRECT_MSGS) : randomFrom(QUIZ_WRONG_MSGS));
    if (correct) setQuizScore(s => s + 1);
  }
  function nextQuizQuestion() {
    sfx.click();
    setQuizFeedback("");
    if (quizIndex + 1 < quizItems.length) { setQuizIndex(quizIndex + 1); setQuizSelected(null); }
    else setStatus("done");
  }
  function retakeQuiz() { sfx.click(); setQuizIndex(0); setQuizSelected(null); setQuizScore(0); setStatus("study"); }
  function studyAgain() {
    sfx.click();
    setLevels(new Array(cards.length).fill(0));
    setQueue(cards.map((_, i) => i));
    setFlipped(false);
    setMissedEver(0);
    setStatus("study");
  }
  function editDeck() { sfx.click(); setStatus("build"); }

  const masteredCount = levels.filter(l => l >= MASTERY_LEVEL).length;
  const currentIdx = queue.length > 0 ? queue[0] : null;
  const atLimit = studyMode === "flashcards" ? (!isPro && cards.length >= FREE_CARD_LIMIT) : (!isPro && quizItems.length >= FREE_CARD_LIMIT);

  if (showSplash) {
    return (
      <div className={"splash-overlay splash-page" + (splashFading ? " hide" : "")}>
        <div className="splash-stack">
          <div className="splash-card splash-card-1"></div>
          <div className="splash-card splash-card-2"></div>
          <div className="splash-card splash-card-3"></div>
        </div>
        <div className="splash-word">SabiKard</div>
      </div>
    );
  }

  return (
    <div className="wrap">
      <header>
        <div className="brand-row">
          <div className="logo-stack">
            <div className="logo-card logo-card-1"></div>
            <div className="logo-card logo-card-2"></div>
            <div className="logo-card logo-card-3"></div>
          </div>
          <h1 className="wordmark">SabiKard</h1>
        </div>
        <p className="subtitle">Build your own deck, then quiz yourself until it sticks.</p>
      </header>

      {status === "build" && (
        <div className="glass panel">
          <div className="mode-row">
            <button type="button" className={"mode-chip" + (studyMode === "flashcards" ? " active" : "")} aria-pressed={studyMode === "flashcards"} onClick={() => { sfx.click(); setStudyMode("flashcards"); }}>Flashcards</button>
            <button type="button" className={"mode-chip" + (studyMode === "quiz" ? " active" : "")} aria-pressed={studyMode === "quiz"} onClick={() => { sfx.click(); setStudyMode("quiz"); }}>Quiz (4 options)</button>
          </div>

          {studyMode === "flashcards" ? (
            <div>
              <div className="field-label">Question / front</div>
              <input type="text" placeholder="e.g. What is the capital of Nigeria?" value={draftFront} onChange={e => setDraftFront(e.target.value)} />
              <div className="field-label">Answer / back</div>
              <textarea placeholder="e.g. Abuja" value={draftBack} onChange={e => setDraftBack(e.target.value)} />
              <div className="row">
                <button type="button" className="btn-ghost" onClick={loadSampleFlashcards}>Load a sample deck</button>
                <button type="button" className="btn-small" onClick={addFlashcard} disabled={!draftFront.trim() || !draftBack.trim() || atLimit}>Add card</button>
              </div>

              {cards.length > 0 ? (
                <div className="deck-list">
                  {cards.map((c, i) => (
                    <div className="deck-item" key={i}>
                      <span className="deck-item-text">{i + 1}. {c.front}</span>
                      <button type="button" className="deck-item-remove" onClick={() => removeCard(i)}>Remove</button>
                    </div>
                  ))}
                </div>
              ) : <div className="empty-note">No cards yet — add your first one above.</div>}

              <div className="row">
                <span className="field-label" style={{ margin: 0 }}>{cards.length} card{cards.length !== 1 ? "s" : ""} added{!isPro ? ` (max ${FREE_CARD_LIMIT})` : ""}</span>
                <button type="button" className="btn-primary" onClick={startFlashcardStudy} disabled={cards.length === 0}>Study this deck</button>
              </div>
            </div>
          ) : (
            <div>
              <div className="field-label">Question</div>
              <input type="text" placeholder="e.g. Which planet is closest to the sun?" value={draftQuestion} onChange={e => setDraftQuestion(e.target.value)} />
              <div className="field-label">Options (tap the circle to mark the correct one)</div>
              {draftOptions.map((opt, i) => (
                <div className="option-row" key={i}>
                  <button
                    type="button"
                    className={"correct-toggle" + (draftCorrect === i ? " selected" : "")}
                    aria-label={draftCorrect === i ? "Selected as correct answer" : "Mark as correct answer"}
                    aria-pressed={draftCorrect === i}
                    onClick={() => { sfx.click(); setDraftCorrect(i); }}
                  >
                    {draftCorrect === i ? "✓" : ""}
                  </button>
                  <input type="text" placeholder={"Option " + (i + 1)} value={opt} onChange={e => updateOption(i, e.target.value)} />
                </div>
              ))}
              <div className="row">
                <span />
                <button type="button" className="btn-small" onClick={addQuizItem} disabled={!draftQuestion.trim() || !draftOptions.every(o => o.trim()) || atLimit}>Add question</button>
              </div>

              {quizItems.length > 0 ? (
                <div className="deck-list">
                  {quizItems.map((q, i) => (
                    <div className="deck-item" key={i}>
                      <span className="deck-item-text">{i + 1}. {q.question}</span>
                      <button type="button" className="deck-item-remove" onClick={() => removeQuizItem(i)}>Remove</button>
                    </div>
                  ))}
                </div>
              ) : <div className="empty-note">No questions yet — add your first one above.</div>}

              <div className="row">
                <span className="field-label" style={{ margin: 0 }}>{quizItems.length} question{quizItems.length !== 1 ? "s" : ""} added{!isPro ? ` (max ${FREE_CARD_LIMIT})` : ""}</span>
                <button type="button" className="btn-primary" onClick={startQuiz} disabled={quizItems.length === 0}>Start quiz</button>
              </div>
            </div>
          )}

          {isPro ? (
            <div className="limit-strip active-pro">✓ Pro unlocked — unlimited cards per deck</div>
          ) : (
            <div>
              <div className="limit-strip">
                <span>Free decks are capped at {FREE_CARD_LIMIT} cards. Pro removes the limit.</span>
                <button type="button" className="btn-small" onClick={togglePayPanel}>{payPanelOpen ? "Hide" : "Go Pro"}</button>
              </div>

              {payPanelOpen && (
                <div className="pay-panel">
                  <div className="pay-row">
                    <span className="pay-label">Amount</span>
                    <span className="pay-value">₦5,000 (one-time)</span>
                  </div>
                  <div className="pay-row">
                    <span className="pay-label">Bank</span>
                    <span className="pay-value">Guaranty Trust Bank</span>
                  </div>
                  <div className="pay-row">
                    <span className="pay-label">Account name</span>
                    <span className="pay-value">Henry Amos Jugu</span>
                  </div>
                  <div className="pay-row">
                    <span className="pay-label">Account number</span>
                    <span className="pay-value">
                      0567915109
                      <button type="button" className="copy-btn" aria-label="Copy account number" onClick={copyAccountNumber}>{copied ? "Copied!" : "Copy"}</button>
                    </span>
                  </div>
                  <div className="pay-note">
                    After you transfer, send proof to <strong>henryshub4u@gmail.com</strong> and you'll get a code back — enter it below to unlock Pro.
                  </div>
                  <div className="redeem-row">
                    <input
                      type="text"
                      placeholder="Enter code"
                      aria-label="Redeem code"
                      value={redeemInput}
                      onChange={e => setRedeemInput(e.target.value)}
                    />
                    <button type="button" className="btn-small" onClick={redeemCode} disabled={!redeemInput.trim()}>Unlock</button>
                  </div>
                  {redeemError && <div className="redeem-error" aria-live="polite">{redeemError}</div>}
                </div>
              )}
            </div>
          )}

          {(cards.length > 0 || quizItems.length > 0) && (
            <div className="row" style={{ marginTop: 10 }}>
              <span />
              <button type="button" className="btn-ghost" onClick={clearDeck}>Clear deck &amp; start over</button>
            </div>
          )}
        </div>
      )}

      {status === "study" && studyMode === "flashcards" && currentIdx !== null && (
        <div>
          <div className="study-header">
            <span>{masteredCount} / {cards.length} mastered</span>
            <span>{levelLabel(levels[currentIdx])}</span>
          </div>
          <div className="dots">
            {cards.map((_, i) => {
              let cls = "dot";
              if (i === currentIdx) cls += " current";
              if (levels[i] >= MASTERY_LEVEL) cls += " done-good";
              else if (levels[i] > 0) cls += " in-progress";
              return <div key={i} className={cls} />;
            })}
          </div>

          <div className="card-stage">
            <div className={"card" + (flipped ? " flipped" : "")} onClick={toggleFlip} role="button" tabIndex={0} onKeyDown={(e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggleFlip();
              }
            }} aria-label="Flip flashcard">
              <div className="face face-front">
                <div className="level-chip">{levelLabel(levels[currentIdx])}</div>
                <div className="face-label">Question</div>
                <div className="face-text">{cards[currentIdx].front}</div>
                <div className="tap-hint">Tap to reveal</div>
              </div>
              <div className="face face-back">
                <div className="face-label">Answer</div>
                <div className="face-text">{cards[currentIdx].back}</div>
              </div>
            </div>
          </div>

          {flipped && !judging && (
            <div className="judge-row">
              <button type="button" className="judge-btn judge-review" onClick={() => judge("review")}>Need to review</button>
              <button type="button" className="judge-btn judge-good" onClick={() => judge("good")}>Got it</button>
            </div>
          )}
          {judging && <div className="feedback-msg" aria-live="polite">{feedback}</div>}

          <div className="mastery-note">Cards you miss come back sooner — get one right {MASTERY_LEVEL} times in a row to master it.</div>
        </div>
      )}

      {status === "study" && studyMode === "quiz" && quizItems.length > 0 && (
        <div>
          <div className="study-header">
            <span>Question {quizIndex + 1} of {quizItems.length}</span>
            <span>{quizScore} correct so far</span>
          </div>
          <div className="glass quiz-question">
            <div className="quiz-question-text">{quizItems[quizIndex].question}</div>
          </div>
          <div className="quiz-options">
            {quizItems[quizIndex].options.map((opt, i) => {
              let cls = "quiz-option";
              if (quizSelected !== null) {
                if (i === quizItems[quizIndex].correctIndex) cls += " correct";
                else if (i === quizSelected) cls += " wrong";
              }
              return <button type="button" key={i} className={cls} disabled={quizSelected !== null} aria-label={"Answer option " + (i + 1) + ": " + opt} onClick={() => selectOption(i)}>{opt}</button>;
            })}
          </div>
          {quizSelected !== null && (
            <div className="quiz-next-row">
              <span className="quiz-feedback" aria-live="polite">{quizFeedback}</span>
              <button type="button" className="btn-primary" onClick={nextQuizQuestion}>{quizIndex + 1 < quizItems.length ? "Next question" : "See results"}</button>
            </div>
          )}
        </div>
      )}

      {status === "done" && studyMode === "flashcards" && (
        <div className="glass panel summary">
          <div className="subtitle">{masterySummary(missedEver)}</div>
          <div className="summary-row">
            <div className="stat good"><div className="stat-count">{cards.length}</div><div className="stat-label">mastered</div></div>
            <div className="stat review"><div className="stat-count">{missedEver}</div><div className="stat-label">total misses</div></div>
          </div>
          <div className="actions">
            <button type="button" className="btn-primary" onClick={studyAgain}>Study this deck again</button>
            <button type="button" className="btn-ghost" onClick={editDeck}>Edit deck</button>
          </div>
        </div>
      )}

      {status === "done" && studyMode === "quiz" && (
        <div className="glass panel summary">
          <div className="subtitle">{quizSummary(quizScore, quizItems.length)}</div>
          <div className="summary-row">
            <div className="stat good"><div className="stat-count">{quizScore}</div><div className="stat-label">correct</div></div>
            <div className="stat review"><div className="stat-count">{quizItems.length - quizScore}</div><div className="stat-label">missed</div></div>
          </div>
          <div className="actions">
            <button type="button" className="btn-primary" onClick={retakeQuiz}>Retake this quiz</button>
            <button type="button" className="btn-ghost" onClick={editDeck}>Edit deck</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
