function Header({name,hue,setHue,setPage,page}){const colors=[270,220,185,145,315],labels={270:'Purple',220:'Blue',185:'Cyan',145:'Neon',315:'Magenta'};return <header className="header glass"><div className="brand-row"><div className="brand-mark" style={{background:'linear-gradient(135deg,hsl('+hue+' 90% 62%), rgba(255,255,255,.35))'}}>{name.slice(0,1).toUpperCase()}</div><div className="brand-txt"><div className="brand-title">SabiKard</div><div className="brand-sub">Study with rhythm</div></div></div><div className="header-controls"><div className="hue-row">{colors.map(c => <button key={c} type="button" className={`swatch ${c===hue?'active':''}`} style={{background:'hsl('+c+' 90% 62%)'}} onClick={()=>setHue(c)} aria-label={labels[c]} title={labels[c]} />)}</div><button type="button" className={`page-btn ${page==='builder'?'active':''}`} onClick={()=>setPage('builder')}>Create</button><button type="button" className={`page-btn ${page==='study'?'active':''}`} onClick={()=>setPage('study')}>Study</button></div></header>}
function Pro({isPro,open,setOpen}){const [code,setCode]=useState(''),[error,setError]=useState('');if(isPro)return <div className="limit-strip">Pro unlocked ✨</div>; return <div className="pro-box glass"><div style={{fontWeight:700}}>Unlock Pro</div><div className="small">Enter your code to remove limits.</div><input className="input" value={code} onChange={e=>setCode(e.target.value)} placeholder="SABI-7F3K9Q" /><div className="row"><button type="button" className="primary" style={{background:'linear-gradient(135deg,var(--accent),#fff1)',border:'1px solid rgba(255,255,255,.18)',padding:'10px 14px',borderRadius:12,color:'var(--text)',cursor:'pointer'}} onClick={()=>{if(code.trim().toUpperCase()===PRO_CODE){setOpen(true);setError('');_savePro();}else setError('Invalid code');}}>Unlock</button><button type="button" className="secondary" style={{background:'rgba(255,255,255,.04)',border:'1px solid var(--line)',padding:'10px 12px',borderRadius:12,color:'var(--text)',cursor:'pointer'}} onClick={()=>setOpen(false)}>Close</button></div>{error && <div style={{color:'#ffd6dc',fontSize:'.8rem'}}>{error}</div>}</div>; function _savePro(){safeSave(KEYS.pro,true);} }

function Builder({mode,setMode,cards,setCards,quiz,setQuiz,history,setHistory,isPro,setPage}){const [front,setFront]=useState(''),[back,setBack]=useState(''),[question,setQuestion]=useState(''),[opts,setOpts]=useState(['','']),[correct,setCorrect]=useState(0),[status,setStatus]=useState('');const limit = isPro ? 999 : LIMIT;const canAddCard = cards.length < limit; const canAddQuiz = quiz.length < limit; function addCard(){if(!front.trim() || !back.trim() || !canAddCard) return; const item={id:makeId(),type:'card',front:front.trim(),back:back.trim(),createdAt:new Date().toISOString()}; setCards(prev => [...prev, item]); setHistory(prev => addHistory(prev, item)); setFront(''); setBack(''); setStatus('Flashcard added.'); }

return <div className="glass panel stack"><div className="mode-row"><button type="button" className={`mode-chip ${mode==='cards'?'active':''}`} onClick={()=>setMode('cards')}>Flashcards</button><button type="button" className={`mode-chip ${mode==='quiz'?'active':''}`} onClick={()=>setMode('quiz')}>Quiz</button></div>{status && <div className="status-bar"><span>{status}</span><button type="button" className="mini-btn" style={{background:'rgba(255,255,255,.04)',border:'1px solid var(--line)',padding:'8px 10px',borderRadius:10,color:'var(--text)',cursor:'pointer'}} onClick={()=>setStatus('')}>Dismiss</button></div>}{mode==='cards' ? <div className="field"><input className="input" value={front} onChange={e=>setFront(e.target.value)} placeholder="Front of card"/><textarea className="textarea" value={back} onChange={e=>setBack(e.target.value)} placeholder="Back of card"/><div className="row"><button type="button" className="primary" style={{background:'linear-gradient(135deg,var(--accent),#fff1)',border:'1px solid rgba(255,255,255,.18)',padding:'10px 14px',borderRadius:12,color:'var(--text)',cursor:'pointer'}} onClick={addCard} disabled={!canAddCard}>{canAddCard ? 'Add Flashcard' : 'Limit reached'}</button></div></div> : <div className="field"><input className="input" value={question} onChange={e=>setQuestion(e.target.value)} placeholder="Quiz question"/>{opts.map((opt,i)=><div key={i} className="row"><input className="input" value={opt} onChange={e=>{const next=[...opts];next[i]=e.target.value;setOpts(next)}} placeholder={'Option ' + (i+1)}/><button type="button" className={`pill ${correct===i?'active':''}`} onClick={()=>setCorrect(i)}>Correct</button></div>)}<div className="row"><button type="button" className="secondary" style={{background:'rgba(255,255,255,.04)',border:'1px solid var(--line)',padding:'10px 12px',borderRadius:12,color:'var(--text)',cursor:'pointer'}} onClick={()=>setOpts(prev => [...prev, ''])}>Add option</button><button type="button" className="primar function Notes({notes,setNotes}){const [title,setTitle]=useState(''),[body,setBody]=useState(''),[editing,setEditing]=useState(null); function saveNote(){if(!title.trim() && !body.trim()) return; const item={id:editing?.id || makeId(), title:title.trim() || 'Note', body:body.trim(), createdAt:new Date().toISOString()}; setNotes(prev => editing ? prev.map(n => n.id===editing.id ? item : n) : [item,...prev]); setTitle(''); setBody(''); setEditing(null); } function removeNote(id){setNotes(prev => prev.filter(n => n.id !== id)); if(editing && editing.id===id) {setEditing(null); setTitle(''); setBody('');}} return <div className="glass panel stack"><div className="row"><input className="input" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Note title"/><button type="button" className="primary" style={{background:'linear-gradient(135deg,var(--accent),#fff1)',border:'1px solid rgba(255,255,255,.18)',padding:'10px 12px',borderRadius:12,color:'var(--text)',cursor:'pointer'}} onClick={saveNote}>{editing ? 'Update' : 'Save'}</button></div><textarea className="textarea" value={body} onChange={e=>setBody(e.target.value)} placeholder="Write something useful..."/>{notes.length ? notes.map(note => <div key={note.id} className="note-item"><div className="note-head"><strong>{note.title}</strong><div className="row"><button type="button" className="chip" onClick={()=>{setEditing(note); setTitle(note.title); setBody(note.body);}}>Edit</button><button type="button" className="trash" onClick={()=>removeNote(note.id)}>Delete</button></div></div><div className="note-body">{note.body}</div></div>) : <div className="small">No notes yet.</div>}</div>}
function Cards({cards,levels,setLevels,queue,setQueue,finish}){const [flip,setFlip]=useState(false),[busy,setBusy]=useState(false),[misses,setMisses]=useState(0),[message,setMessage]=useState(''); const total = cards.length; const nextCard = () => { if (!queue.length) return; const [index, ...rest] = queue; setQueue(rest); setFlip(false); setBusy(false); setMisses(0); setMessage(''); if (cards[index]) finish(cards[index], 'card'); }; useEffect(()=>{if(!cards.length){setQueue([]);return;} if(queue.length===0){setQueue(cards.map((_,i)=>i));}},[cards,queue,setQueue]); if (!cards.length) return <div className="glass panel"><div className="small">No flashcards to study.</div></div>; const index = queue[0]; const card = cards[index]; const markLevel = (dir) => { const current = levels[index] || 0; const next = Math.max(0, Math.min(MASTERED, current + (dir === 'good' ? 1 : -1))); setLevels(prev => { const copy = [...prev]; copy[index] = next; return copy; }); if (dir === 'good') { setMessage(pick(GOOD)); buzz(30); } else { setMessage(pick(REVIEW)); setMisses(m => m + 1); buzz(18); }

function Quiz({items,finish}){const [i,setI]=useState(0),[score,setScore]=useState(0),[selected,setSelected]=useState(null),[message,setMessage]=useState(''); const x = items[i]; if (!x) return <div className="glass panel"><div className="small">No quiz items to study.</div></div>; function answer(index){ if (selected !== null) return; setSelected(index); if (index === x.correctIndex) { setScore(s => s + 1); setMessage('Correct!'); buzz(35); } else { setMessage('Not quite — the answer was ' + x.options[x.correctIndex]); buzz(20); } setTimeout(() => { setI(v => { const next = v + 1; if (next >= items.length) return 0; return next; }); setSelected(null); setMessage(''); finish(x, 'quiz'); }, 850); } return <div className="glass panel quiz-card"><div className="status-bar"><span>Question {i + 1} / {items.length}</span><span className="badge">Score {score}</span></div><div className="deck-text">{x.question}</div>{x.options.map((opt,idx)=><button key={idx} type="button" className={`quiz-option ${selected === idx ? 'selected' : ''} ${selected !== null && idx === x.correctIndex ? 'correct' : ''} ${selected !== null && idx === selected && idx !== x.correctIndex ? 'wrong' : ''}`} onClick={()=>answer(idx)} disabled={selected !== null}>{opt}</button>)}{message && <div className="status-bar"><span>{message}</span></div>}</div>}
function App(){const [mode,setMode]=useState(safeLoad(KEYS.mode,'cards'));const [cards,setCards]=useState(safeLoad(KEYS.cards, []).map((x,i)=> normalizeCard(x,i)).filter(Boolean));const [quiz,setQuiz]=useState(safeLoad(KEYS.quiz, []).map((x,i)=> normalizeQuiz(x,i)).filter(Boolean));const [history,setHistory]=useState(safeLoad(KEYS.history, []).map(normalizeHistory).filter(Boolean));const [notes,setNotes]=useState(safeLoad(KEYS.notes, []).filter(Boolean));const [levels,setLevels]=useState(safeLoad(KEYS.levels, []));const [queue,setQueue]=useState(safeLoad(KEYS.queue, []));const [status,setStatus]=useState(safeLoad(KEYS.status, 'Ready to study'));const [hue,setHue]=useState(Number(safeLoad(KEYS.hue, 270)));const [page,setPage]=useState('builder');const [isPro,setIsPro]=useState(Boolean(safeLoad(KEYS.pro, false)));const [openPro,setOpenPro]=useState(false); useEffect(()=>{document.documentElement.style.setProperty('--hue',hue); safeSave(KEYS.hue,hue);},[hue]); useEffect(()=>{safeSave(KEYS.mode,mode);},[mode]); useEffect(()=>{safeSave(KEYS.cards,cards);},[cards]); useEffect(()=>{safeSave(KEYS.quiz,quiz);},[quiz]); useEffect(()=>{safeSave(KEYS.history,history);},[history]); useEffect(()=>{safeSave(KEYS.notes,notes);},[notes]); useEffect(()=>{safeSave(KEYS.levels,levels);},[levels]); useEffect(()=>{safeSave(KEYS.queue,queue);},[queue]); useEffect(()=>{safeSave(KEYS.status,status);},[status]); useEffect(()=>{safeSave(KEYS.pro,isPro);},[isPro]); useEffect(()=>{if(queue.length === 0 && cards.length){setQueue(cards.map((_,i)=>i));}},[cards,queue]); function clear(){setCards([]);setQuiz([]);setHistory([]);setLevels([]);setQueue([]);setStatus('All cleared.');} function finish(item, type){ const next = addHistory(history, item); setHistory(next); if (type==='card') setStatus('Flashcard reviewed.'); if (type==='quiz') setStatus('Quiz reviewed.'); }
 return <div className="app-shell"><Header name="SabiKard" hue={hue} setHue={setHue} setPage={setPage} page={page}/><Pro isPro={isPro} open={openPro} setOpen={setOpenPro} />{!isPro && openPro===false && <div className="status-bar"><span>Free tier: {LIMIT} items max</span><button type="button" className="page-btn" onClick={()=>setOpenPro(true)}>Unlock Pro</button></div>}<div className="status-bar"><span>{status}</span><button type="button" className="page-btn" onClick={clear}>Clear all</button></div><div className="main"><div className="stack">{page === 'builder' ? <Builder mode={mode} setMode={setMode} cards={cards} setCards={setCards} quiz={quiz} setQuiz={setQuiz} history={history} setHistory={setHistory} isPro={isPro} setPage={setPage} /> : <Cards cards={cards} levels={levels} setLevels={setLevels} queue={queue} setQueue={setQueue} finish={finish} />}<div className="glass panel"><h3 style={{margin:'0 0 10px'}}>Recent history</h3><List items={history} type={history[0]?.type || 'card'} remove={(id)=>setHistory(prev=>prev.filter(x=>x.id!==id))}/></div></div><div className="stack"><div className="glass panel"><h3 style={{margin:'0 0 10px'}}>Quiz practice</h3><Quiz items={quiz} finish={finish} /></div><div className="glass panel"><h3 style={{margin:'0 0 10px'}}>Notes</h3><Notes notes={notes} setNotes={setNotes}/></div></div></div></div> }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
