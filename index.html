<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SabiKard</title>
  <style>
    :root {
      --bg:#120b24;
      --bg-2:#1d103a;
      --glass: rgba(255,255,255,.10);
      --glass-strong: rgba(255,255,255,.16);
      --border: rgba(255,255,255,.26);
      --text:#f5f6fa;
      --dim:rgba(245,246,250,.72);
      --faint:rgba(245,246,250,.45);
      --accent:#8d7cff;
      --good:#70e0aa;
      --review:#ffd88a;
      --danger:#ff9aa6;
      --shadow: rgba(9,6,18,.45);
      --brand: #7f70ff;
      --panel: rgba(20,12,34,.72);
      --spring: cubic-bezier(.34,1.56,.64,1);
      --ease: cubic-bezier(.2,1,.36,1);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; min-height:100vh; font-family:-apple-system,'SF Pro Text','Inter',system-ui,sans-serif; color:var(--text); }
    body {
      padding:28px 16px 60px;
      background: radial-gradient(circle at 15% 10%, rgba(126,97,255,.36), transparent 25%),
                  radial-gradient(circle at 85% 12%, rgba(70,155,228,.18), transparent 28%),
                  linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
    }
    button,input,textarea{font:inherit}
    button { cursor:pointer; border:0; }
    button:disabled{opacity:.42;cursor:default}
    .wrap{ max-width:620px; margin:0 auto; }
    .brand-row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
    .logo-stack{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center}
    .logo-card{position:absolute;width:44px;height:58px;border-radius:14px;border:1px solid var(--border);box-shadow:0 8px 18px rgba(0,0,0,.18);background:linear-gradient(135deg,#8d7cff,#3d2f7f);animation:fan-left .7s var(--spring) both}
    .logo-card-1{transform:translate(-16px,6px) rotate(-16deg);background:linear-gradient(135deg,#7de0d3,#3a88d8);animation:fan-left .7s var(--spring) .05s both}
    .logo-card-2{transform:translate(0,-8px) rotate(14deg);background:linear-gradient(135deg,#80a6ff,#4b4ad8);animation:fan-center .7s var(--spring) .15s both}
    .logo-card-3{transform:translate(18px,8px) rotate(22deg);background:linear-gradient(135deg,#a585ff,#5a47d5);animation:fan-right .7s var(--spring) .25s both}
    @keyframes fan-left{0%{opacity:0;transform:translate(0,40px) rotate(0) scale(.6)}65%{opacity:1}100%{opacity:1;transform:translate(-16px,6px) rotate(-16deg) scale(1)}}
    @keyframes fan-center{0%{opacity:0;transform:translate(0,40px) rotate(0) scale(.6)}65%{opacity:1}100%{opacity:1;transform:translate(0,-8px) rotate(14deg) scale(1)}}
    @keyframes fan-right{0%{opacity:0;transform:translate(0,40px) rotate(0) scale(.6)}65%{opacity:1}100%{opacity:1;transform:translate(18px,8px) rotate(22deg) scale(1)}}
    .wordmark{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0}
    .subtitle{font-size:14px;color:var(--dim);margin:0}
    .glass{position:relative;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border);border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden}
    .glass:before{content:"";position:absolute;inset:0 auto auto 0;height:40%;width:100%;background:linear-gradient(180deg, rgba(255,255,255,.15), transparent); pointer-events:none}
    .panel{padding:24px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
    .mode-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .mode-chip{flex:1;min-width:120px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.06);color:var(--dim);font-weight:700;border:1px solid transparent;transition:transform .25s var(--spring), background .25s ease, border-color .25s ease}
    .mode-chip:hover{transform:translateY(-1px)}
    .mode-chip.active{background:rgba(141,124,255,.24);color:var(--text);border-color:rgba(141,124,255,.45)}
    .field-label{display:block;font-size:12px;color:var(--faint);font-weight:700;margin:14px 0 7px}
    input,textarea{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:14px;background:rgba(13,9,24,.25);color:var(--text);outline:none;resize:vertical;transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease}
    input::placeholder,textarea::placeholder{color:var(--faint)}
    input:focus,textarea:focus{border-color:rgba(141,124,255,.7);box-shadow:0 0 0 3px rgba(141,124,255,.16)}
    .btn{padding:12px 18px;border-radius:999px;font-weight:700;transition:transform .25s var(--spring), opacity .2s ease, box-shadow .2s ease, background .2s ease}
    .btn:active{transform:scale(.98)}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--text);color:#101521}
    .btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text)}
    .btn-danger{background:rgba(255,154,166,.12);border:1px solid rgba(255,154,166,.32);color:var(--danger)}
    .btn-small{padding:9px 14px;font-size:13px}
    .actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px}
    .deck-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
    .deck-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);transition:transform .25s var(--spring), background .2s ease}
    .deck-item:hover{transform:translateY(-1px);background:rgba(255,255,255,.08)}
    .deck-item-text{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .deck-item-remove{text-decoration:underline;color:var(--faint);background:none;padding:0}
    .empty-note{padding:16px 12px;text-align:center;color:var(--faint);font-size:13px}
    .limit-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin:18px 0 8px;border-radius:18px;border:1px solid rgba(255,174,88,.45);background:linear-gradient(135deg, rgba(255,190,99,.12), rgba(141,124,255,.12));color:var(--dim);font-size:13px}
    .limit-strip.active-pro{border-color:rgba(112,224,170,.45);background:linear-gradient(135deg, rgba(112,224,170,.12), rgba(141,124,255,.12));color:var(--text)}
    .pay-panel{margin-top:14px;padding:16px;border-radius:18px;background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.12)}
    .pay-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0}
    .pay-row:last-child{border-bottom:0}
    .pay-label{color:var(--faint);font-size:12px}
    .pay-value{font-weight:800}
    .copy-btn{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--text)}
    .redeem-row{display:flex;gap:8px;margin-top:10px}
    .redeem-row input{flex:1}
    .redeem-error{font-size:12px;color:var(--danger);margin-top:8px}
    .study-header{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);padding:0 6px 12px}
    .dots{display:flex;gap:6px;padding:0 6px 18px}
    .dot{width:7px;height:7px;border-radius:50%;background:#fff4;}
    .dot.current{background:var(--text);transform:scale(1.4)}
    .dot.done-good{background:var(--good)}
    .dot.done-review{background:var(--review)}
    .dot.in-progress{background:var(--accent)}
    .card-stage{position:relative;min-height:260px;perspective:1600px;cursor:pointer}
    .card{position:relative;min-height:260px;border-radius:28px;border:1px solid var(--border);background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04));box-shadow:0 8px 28px rgba(0,0,0,.15);transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,1,.3,1), box-shadow .2s ease}
    .card.flipped{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;padding:30px 26px 26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;}
    .face-back{transform:rotateY(180deg);background:linear-gradient(135deg,#7d6cf2,#3d2b71)}
    .face-label{font-size:12px;font-weight:700;color:var(--faint);margin-bottom:10px;text-transform:uppercase;letter-spacing:.12em}
    .face-text{font-size:20px;line-height:1.5;max-width:90%}
    .tap-hint{position:absolute;bottom:18px;right:18px;font-size:12px;color:var(--faint)}
    .level-chip{position:absolute;top:16px;right:16px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:11px;font-weight:700}
    .judge-row{display:flex;gap:10px;margin-top:18px}
    .judge-btn{flex:1;padding:14px 10px;border-radius:16px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.08)}
    .judge-btn.good{background:rgba(112,224,170,.12);border-color:rgba(112,224,170,.45)}
    .judge-btn.review{background:rgba(255,216,138,.10);border-color:rgba(255,216,138,.38)}
    .feedback-msg{padding:14px 16px;border-radius:12px;margin-top:16px;background:rgba(255,255,255,.06);color:var(--dim);font-size:14px;text-align:center}
    .mastery-note{margin-top:12px;font-size:12px;color:var(--faint);text-align:center}
    .quiz-question{padding:28px 24px 24px}
    .quiz-text{font-size:22px;line-height:1.5;margin:0 0 18px}
    .quiz-options{display:flex;flex-direction:column;gap:10px}
    .quiz-option{padding:16px 18px;text-align:left;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--text);transition:transform .2s ease, border-color .2s ease, background .2s ease}
    .quiz-option:hover{transform:translateY(-1px)}
    .quiz-option.correct{background:rgba(112,224,170,.16);border-color:rgba(112,224,170,.48)}
    .quiz-option.wrong{background:rgba(255,154,166,.14);border-color:rgba(255,154,166,.42)}
    .quiz-feedback{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--dim)}
    .summary{padding:24px}
    .summary-row{display:flex;justify-content:center;gap:26px;margin-top:24px;flex-wrap:wrap}
    .stat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px}
    .stat-count{font-size:32px;font-weight:800}
    .stat.good .stat-count{color:var(--good)}
    .stat.review .stat-count{color:var(--review)}
    .stat-label{font-size:12px;color:var(--faint)}
    .history-wrap{margin-top:20px}
    .history-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
    .history-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    .history-item-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
    .history-actions{display:flex;gap:8px}
    .small{font-size:12px;color:var(--faint)}
    .name-prompt h2{margin:0 0 12px;font-size:28px;letter-spacing:-.5px}
    .name-prompt input{margin-bottom:12px}
    .splash-overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s ease, visibility .5s ease; background:linear-gradient(180deg, rgba(12,8,20,.6), rgba(12,8,20,.84));}
    .splash-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .splash-stack{position:relative;width:90px;height:90px;display:flex;align-items:center;justify-content:center}
    .splash-card{position:absolute;width:52px;height:70px;border-radius:16px;border:1px solid var(--border);box-shadow:0 8px 20px rgba(0,0,0,.15);animation:fly-left 1s var(--spring) both}
    .splash-card-1{background:linear-gradient(135deg,#8d7cff,#42329d);transform:translate(-18px,6px) rotate(-16deg);animation:fly-left 1s var(--spring) .08s both}
    .splash-card-2{background:linear-gradient(135deg,#7de0d3,#2857b2);transform:translate(0,-10px) rotate(10deg);animation:fly-center 1s var(--spring) .16s both}
    .splash-card-3{background:linear-gradient(135deg,#f0b16d,#9455d8);transform:translate(18px,8px) rotate(20deg);animation:fly-right 1s var(--spring) .24s both}
    @keyframes fly-left{0%{opacity:0;transform:translate(-180px,-160px) rotate(-16deg) scale(.4)}65%{opacity:1}100%{opacity:1;transform:translate(-18px,6px) rotate(-16deg) scale(1)}}
    @keyframes fly-center{0%{opacity:0;transform:translate(0,-220px) rotate(90deg) scale(.4)}65%{opacity:1}100%{opacity:1;transform:translate(0,-10px) rotate(10deg) scale(1)}}
    @keyframes fly-right{0%{opacity:0;transform:translate(180px,-160px) rotate(16deg) scale(.4)}65%{opacity:1}100%{opacity:1;transform:translate(18px,8px) rotate(20deg) scale(1)}}
    .splash-word{font-size:36px;font-weight:800;letter-spacing:-.8px;animation:word-in .5s var(--ease) .5s both}
    @keyframes word-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const LIMIT = 10;
    const MASTERED = 3;
    const PRO_CODE = 'SABI-7F3K9Q';

    const KEYS = {
      mode:'sabikard-studyMode',
      cards:'sabikard-cards',
      quiz:'sabikard-quizItems',
      levels:'sabikard-levels',
      queue:'sabikard-queue',
      index:'sabikard-quizIndex',
      score:'sabikard-quizScore',
      pro:'sabikard-isPro',
      name:'sabikard-user-name',
      history:'sabikard-questionHistory'
    };

    const GOOD = ['Nice one — that\'s sticking.', 'You\'ve got this.', 'Exactly right, keep going.', 'That\'s locking in nicely.', 'You\'re on it!', 'Solid. Onward.', 'You sabi!', 'Well done jare!'];
    const REVIEW = ['No wahala, that\'s what review is for.', 'Almost — you\'ll get it next round.', 'That\'s okay, it\'ll come back around soon.', 'Good instinct to flag it. You\'ll nail it next time.'];
    const CORRECT = ['Correct — nice work.', 'That\'s right, you know this.', 'Spot on.', 'Yes! Keep it up.', 'You sabi!', 'Well done jare!'];
    const WRONG = ['Not quite — now you know for next time.', 'Close, but that\'s alright.', 'That one was tricky. Onward.', 'No wahala — you\'ll remember this one now.'];

    function load(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item === null ? fallback : JSON.parse(item);
      } catch {
        return fallback;
      }
    }

    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    function pick(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function label(level) {
      return level === 0 ? 'New' : level === 1 ? 'Learning' : 'Almost there';
    }

    function spacing(level) {
      return level === 1 ? 2 : 4;
    }

    function summary(missed) {
      if (missed === 0) return 'Flawless run — you clearly had this down.';
      if (missed <= 3) return 'You stuck with it and got every card mastered. Well done.';
      return 'That took some real review, and you pushed through anyway. Solid work.';
    }

    function quizSummary(score, total) {
      const pct = total ? score / total : 0;
      if (pct === 1) return 'Perfect score — you really know this material.';
      if (pct >= .7) return 'Strong performance, just a couple to tighten up.';
      if (pct >= .4) return 'Good start — another pass and this will click.';
      return 'That one was tough, but now you know exactly what to review.';
    }

    function clearDeckStorage() {
      try {
        Object.values(KEYS).filter(k => k !== KEYS.pro && k !== KEYS.name).forEach(k => localStorage.removeItem(k));
      } catch {}
    }

    function addHistory(history, entry) {
      const key = entry.type === 'card' ? entry.front : entry.question;
      return [entry, ...history.filter(item => (item.type === 'card' ? item.front : item.question) !== key)].slice(0, 60);
    }

    function Button({ children, className = '', ...props }) {
      return <button type="button" className={className} {...props}>{children}</button>;
    }

    function Header({ userName }) {
      return (
        <header>
          <div className="brand-row">
            <div className="logo-stack" aria-hidden="true">
              <div className="logo-card logo-card-1" />
              <div className="logo-card logo-card-2" />
              <div className="logo-card logo-card-3" />
            </div>
            <div>
              <h1 className="wordmark">SabiKard</h1>
              <p className="subtitle">{userName ? `Welcome back, ${userName}!` : 'Build your own deck, then quiz yourself until it sticks.'}</p>
            </div>
          </div>
        </header>
      );
    }

    function DeckList({ items, type, onRemove }) {
      if (!items.length) {
        return <div className="empty-note">No {type === 'card' ? 'cards' : 'questions'} yet — add your first one above.</div>;
      }
      return (
        <div className="deck-list">
          {items.map((item, i) => (
            <div className="deck-item" key={item.id || i}>
              <span className="deck-item-text">{i + 1}. {type === 'card' ? item.front : item.question}</span>
              <button type="button" className="deck-item-remove" onClick={() => onRemove(i)}>Remove</button>
            </div>
          ))}
        </div>
      );
    }

    function ProPanel({ isPro, open, onToggle, onCopy, copied, code, setCode, error, onRedeem }) {
      if (isPro) {
        return <div className="limit-strip active-pro">✓ Pro unlocked — unlimited cards per deck</div>;
      }

      return (
        <>
          <div className="limit-strip">
            <span>Free decks cap at {LIMIT} cards. Pro removes the limit.</span>
            <Button className="btn btn-small btn-ghost" onClick={onToggle}>{open ? 'Hide' : 'Go Pro'}</Button>
          </div>

          {open && (
            <div className="pay-panel">
              <div className="pay-row">
                <span className="pay-label">Amount</span>
                <span className="pay-value">₦ 5,000 (one-time)</span>
              </div>
              <div className="pay-row">
                <span className="pay-label">Bank</span>
                <span className="pay-value">Guarantee Trust Bank</span>
              </div>
              <div className="pay-row">
                <span className="pay-label">Account name</span>
                <span className="pay-value">Henry Amos Jugu</span>
              </div>
              <div className="pay-row">
                <span className="pay-label">Account number</span>
                <span className="pay-value">0567915109</span>
                <Button className="copy-btn" onClick={onCopy}>{copied ? 'Copied!' : 'Copy'}</Button>
              </div>
              <div className="small" style={{marginTop:12}}>After you transfer, send proof to <strong>henryshub4u@gmail.com</strong> and you\'ll get a code back — enter it below to unlock Pro.</div>
              <div className="redeem-row">
                <input type="text" placeholder="Enter code" value={code} onChange={e => setCode(e.target.value)} />
                <Button className="btn btn-small btn-primary" onClick={onRedeem} disabled={!code.trim()}>Unlock</Button>
              </div>
              {error && <div className="redeem-error" aria-live="polite">{error}</div>}
            </div>
          )}
        </>
      );
    }

    function NamePrompt({ value, onChange, onSubmit }) {
      return (
        <div className="glass panel name-prompt">
          <div className="subtitle" style={{marginBottom:6}}>Welcome to SabiKard</div>
          <h2>What should we call you?</h2>
          <input type="text" placeholder="Enter your name" value={value} onChange={e => onChange(e.target.value)} aria-label="Your name" />
          <div className="row">
            <span />
            <Button className="btn btn-primary" onClick={onSubmit} disabled={!value.trim()}>Continue</Button>
          </div>
        </div>
      );
    }

    function Builder({ mode, setMode, cards, quizItems, setCards, setQuizItems, isPro, history, setHistory }) {
      const [front, setFront] = useState('');
      const [back, setBack] = useState('');
      const [question, setQuestion] = useState('');
      const [options, setOptions] = useState(['', '', '', '']);
      const [correct, setCorrect] = useState(0);
      const [payOpen, setPayOpen] = useState(false);
      const [code, setCode] = useState('');
      const [error, setError] = useState('');
      const [copied, setCopied] = useState(false);

      const atLimit = !isPro && (mode === 'flashcards' ? cards.length >= LIMIT : quizItems.length >= LIMIT);

      function addCard() {
        if (!front.trim() || !back.trim() || (!isPro && cards.length >= LIMIT)) return;
        const card = { id: Date.now().toString(36) + Math.random().toString(36).slice(2), type:'card', front: front.trim(), back: back.trim() };
        setCards(prev => [...prev, card]);
        setHistory(prev => addHistory(prev, card));
        setFront('');
        setBack('');
      }

      function addQuestion() {
        if (!question.trim() || options.some(opt => !opt.trim()) || (!isPro && quizItems.length >= LIMIT)) return;
        const q = { id: Date.now().toString(36) + Math.random().toString(36).slice(2), type:'quiz', question: question.trim(), options: options.map(opt => opt.trim()), correctIndex: correct };
        setQuizItems(prev => [...prev, q]);
        setHistory(prev => addHistory(prev, q));
        setQuestion('');
        setOptions(['', '', '', '']);
        setCorrect(0);
      }

      function copyAcc() {
        const num = '0567915109';
        try {
          navigator.clipboard.writeText(num).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 1800);
          }).catch(() => window.prompt('Copy account number:', num));
        } catch {
          window.prompt('Copy account number:', num);
        }
      }

      function redeem() {
        if (code.trim().toUpperCase() === PRO_CODE) {
          setError('');
          save(KEYS.pro, true);
          setPayOpen(false);
          setCode('');
          window.location.reload();
        } else {
          setError('That code doesn\'t match. Double-check it and try again.');
        }
      }

      function reuseHistory(item) {
        if (item.type === 'card') {
          setMode('flashcards');
          setFront(item.front);
          setBack(item.back);
        } else {
          setMode('quiz');
          setQuestion(item.question);
          setOptions(item.options);
          setCorrect(item.correctIndex);
        }
      }

      return (
        <div className="glass panel">
          <div className="mode-row">
            <Button className={'mode-chip ' + (mode === 'flashcards' ? 'active' : '')} onClick={() => setMode('flashcards')}>Flashcards</Button>
            <Button className={'mode-chip ' + (mode === 'quiz' ? 'active' : '')} onClick={() => setMode('quiz')}>Quiz (4 options)</Button>
          </div>

          <ProPanel isPro={isPro} open={payOpen} onToggle={() => setPayOpen(v => !v)} onCopy={copyAcc} copied={copied} code={code} setCode={setCode} error={error} onRedeem={redeem} />

          {mode === 'flashcards' ? (
            <>
              <div className="field-label">Question / front</div>
              <input value={front} onChange={e => setFront(e.target.value)} placeholder="e.g. What is the capital of Nigeria?" />
              <div className="field-label">Answer / back</div>
              <textarea value={back} onChange={e => setBack(e.target.value)} placeholder="e.g. Abuja" />
              <div className="actions">
                <Button className="btn btn-primary" onClick={addCard} disabled={!front.trim() || !back.trim() || atLimit}>Add card</Button>
              </div>
              <DeckList items={cards} type="card" onRemove={i => setCards(prev => prev.filter((_, index) => index !== i))} />
              <div className="row">
                <span className="small">{cards.length} cards {isPro ? '' : ` / max ${LIMIT}`}</span>
                <Button className="btn btn-primary" onClick={() => window.dispatchEvent(new CustomEvent('study-cards'))} disabled={!cards.length}>Study this deck</Button>
              </div>
            </>
          ) : (
            <>
              <div className="field-label">Question</div>
              <input value={question} onChange={e => setQuestion(e.target.value)} placeholder="e.g. Which planet is closest to the sun?" />
              <div className="field-label">Options — tap the circle to mark the correct one</div>
              {options.map((value, i) => (
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <Button className="btn btn-small btn-ghost" onClick={() => setCorrect(i)}>{correct === i ? '✓' : '○'}</Button>
                  <input value={value} onChange={e => setOptions(prev => prev.map((item, idx) => idx === i ? e.target.value : item))} placeholder={'Option ' + (i + 1)} />
                </div>
              ))}
              <div className="actions">
                <Button className="btn btn-primary" onClick={addQuestion} disabled={!question.trim() || options.some(opt => !opt.trim()) || atLimit}>Add question</Button>
              </div>
              <DeckList items={quizItems} type="quiz" onRemove={i => setQuizItems(prev => prev.filter((_, index) => index !== i))} />
              <div className="row">
                <span className="small">{quizItems.length} questions {isPro ? '' : ` / max ${LIMIT}`}</span>
                <Button className="btn btn-primary" onClick={() => window.dispatchEvent(new CustomEvent('study-quiz'))} disabled={!quizItems.length}>Start quiz</Button>
              </div>
            </>
          )}

          <div className="history-wrap">
            <div className="row" style={{marginTop:0}}>
              <strong>Question history</strong>
              <Button className="btn btn-small btn-danger" onClick={() => setHistory([])} disabled={!history.length}>Clear</Button>
            </div>
            <div className="small" style={{marginTop:6}}>Saved on this device so you can reuse previous cards and questions.</div>
            {history.length ? (
              <div className="history-list">
                {history.map((item, i) => (
                  <div className="history-item" key={item.id || i}>
                    <span className="history-item-text">{item.type === 'card' ? item.front : item.question}</span>
                    <div className="history-actions">
                      <Button className="btn btn-small btn-ghost" onClick={() => reuseHistory(item)}>Reuse</Button>
                      <Button className="btn btn-small btn-danger" onClick={() => setHistory(prev => prev.filter((_, index) => index !== i))}>Delete</Button>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="empty-note">Your question history will appear here.</div>
            )}
          </div>
        </div>
      );
    }

    function Flashcards({ cards, levels, setLevels, queue, setQueue, done, setDone }) {
      const [flipped, setFlipped] = useState(false);
      const [judging, setJudging] = useState(false);
      const [misses, setMisses] = useState(0);
      const [feedback, setFeedback] = useState('');
      const current = queue[0];

      function flip() {
        setFlipped(v => !v);
      }

      function judge(outcome) {
        if (judging || !current) return;
        setJudging(true);
        setFeedback(pick(outcome === 'good' ? GOOD : REVIEW));

        const nextLevels = [...levels];
        const nextQueue = queue.slice(1);
        const idx = current;
        const level = nextLevels[idx] || 0;

        if (outcome === 'good') {
          nextLevels[idx] = Math.min(level + 1, MASTERED);
          if (nextLevels[idx] >= MASTERED) {
            nextQueue.push(idx);
          }
        } else {
          nextLevels[idx] = Math.max(level - 1, 0);
          nextQueue.push(idx);
          setMisses(m => m + 1);
        }

        setLevels(nextLevels);
        setQueue(nextQueue);
        setTimeout(() => {
          setJudging(false);
          setFlipped(false);
          setFeedback('');
          if (!nextQueue.length) setDone({ misses });
        }, 1200);
      }

      if (!cards.length) return <div className="glass panel">No cards available to study.</div>;
      if (!current && !done) return <div className="glass panel">Loading deck...</div>;
      if (done) {
        return (
          <div className="glass summary">
            <div className="subtitle">Study session complete</div>
            <div className="summary-row">
              <div className="stat good">
                <div className="stat-count">{cards.length - done.misses}</div>
                <div className="stat-label">mastered</div>
              </div>
              <div className="stat review">
                <div className="stat-count">{done.misses}</div>
                <div className="stat-label">misses</div>
              </div>
            </div>
            <div className="actions">
              <Button className="btn btn-primary" onClick={() => window.dispatchEvent(new CustomEvent('study-cards-reset'))}>Study again</Button>
              <Button className="btn btn-ghost" onClick={() => window.dispatchEvent(new CustomEvent('edit-deck'))}>Edit deck</Button>
            </div>
          </div>
        );
      }

      const item = cards[current];
      return (
        <div className="glass panel">
          <div className="study-header">
            <span>{queue.length} cards left</span>
            <span>{label(levels[current] || 0)}</span>
          </div>
          <div className="dots">
            {cards.map((_, idx) => (
              <span key={idx} className={'dot ' + (idx === current ? 'current' : idx < queue.length ? 'in-progress' : '')} />
            ))}
          </div>
          <div className="card-stage" onClick={flip}>
            <div className={'card ' + (flipped ? 'flipped' : '')} role="button" tabIndex="0" onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } }}>
              <div className="face face-front">
                <div className="face-label">Question</div>
                <div className="face-text">{item.front}</div>
                <div className="tap-hint">Tap to reveal</div>
              </div>
              <div className="face face-back">
                <div className="level-chip">{label(levels[current] || 0)}</div>
                <div className="face-label">Answer</div>
                <div className="face-text">{item.back}</div>
              </div>
            </div>
          </div>
          {flipped && (
            <>
              <div className="judge-row">
                <Button className="judge-btn good" onClick={() => judge('good')}>I got it</Button>
                <Button className="judge-btn review" onClick={() => judge('review')}>Need review</Button>
              </div>
              {feedback && <div className="feedback-msg">{feedback}</div>}
            </>
          )}
        </div>
      );
    }

    function Quiz({ items, index, setIndex, score, setScore, finish }) {
      const [selected, setSelected] = useState(null);
      const [feedback, setFeedback] = useState('');
      const item = items[index];

      function choose(i) {
        if (selected !== null || !item) return;
        const isCorrect = i === item.correctIndex;
        setSelected(i);
        setFeedback(pick(isCorrect ? CORRECT : WRONG));
        if (isCorrect) setScore(s => s + 1);
      }

      function next() {
        if (index + 1 < items.length) {
          setIndex(index + 1);
          setSelected(null);
          setFeedback('');
        } else {
          finish();
        }
      }

      if (!item) return <div className="glass panel">No questions available.</div>;

      return (
        <div className="glass panel quiz-question">
          <div className="study-header">
            <span>Question {index + 1} of {items.length}</span>
            <span>{score} correct so far</span>
          </div>
          <p className="quiz-text">{item.question}</p>
          <div className="quiz-options">
            {item.options.map((option, i) => (
              <button
                key={i}
                type="button"
                className={'quiz-option ' + (selected !== null ? (i === item.correctIndex ? 'correct' : i === selected ? 'wrong' : '') : '')}
                disabled={selected !== null}
                onClick={() => choose(i)}
              >
                {option}
              </button>
            ))}
          </div>
          {selected !== null && (
            <div className="quiz-feedback">
              <span>{feedback}</span>
              <Button className="btn btn-primary" onClick={next}>{index + 1 < items.length ? 'Next question' : 'See results'}</Button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [mode, setMode] = useState(() => load(KEYS.mode, 'flashcards'));
      const [status, setStatus] = useState('build');
      const [isPro, setIsPro] = useState(() => load(KEYS.pro, false));
      const [cards, setCards] = useState(() => load(KEYS.cards, []));
      const [quizItems, setQuizItems] = useState(() => load(KEYS.quiz, []));
      const [levels, setLevels] = useState(() => load(KEYS.levels, []));
      const [queue, setQueue] = useState(() => load(KEYS.queue, []));
      const [quizIndex, setQuizIndex] = useState(() => load(KEYS.index, 0));
      const [quizScore, setQuizScore] = useState(() => load(KEYS.score, 0));
      const [done, setDone] = useState(null);
      const [history, setHistory] = useState(() => load(KEYS.history, []));
      const [showSplash, setShowSplash] = useState(true);
      const [userName, setUserName] = useState(() => load(KEYS.name, ''));
      const [showNamePrompt, setShowNamePrompt] = useState(() => !load(KEYS.name, '').trim());

      useEffect(() => { save(KEYS.mode, mode); }, [mode]);
      useEffect(() => { save(KEYS.cards, cards); }, [cards]);
      useEffect(() => { save(KEYS.quiz, quizItems); }, [quizItems]);
      useEffect(() => { save(KEYS.levels, levels); }, [levels]);
      useEffect(() => { save(KEYS.queue, queue); }, [queue]);
      useEffect(() => { save(KEYS.index, quizIndex); }, [quizIndex]);
      useEffect(() => { save(KEYS.score, quizScore); }, [quizScore]);
      useEffect(() => { save(KEYS.pro, isPro); }, [isPro]);
      useEffect(() => { save(KEYS.name, userName); }, [userName]);
      useEffect(() => { save(KEYS.history, history); }, [history]);

      useEffect(() => {
        const splashTimer = setTimeout(() => setShowSplash(false), 1800);
        return () => clearTimeout(splashTimer);
      }, []);

      useEffect(() => {
        if (!cards.length && !quizItems.length) {
          setQueue([]); setLevels([]); setDone(null); setStatus('build');
        }
      }, [cards.length, quizItems.length]);

      useEffect(() => {
        const studyCards = () => {
          if (!cards.length) return;
          setLevels(Array(cards.length).fill(0));
          setQueue(cards.map((_, i) => i));
          setDone(null);
          setStatus('study-cards');
        };
        const studyQuiz = () => {
          if (!quizItems.length) return;
          setQuizIndex(0); setQuizScore(0); setStatus('study-quiz');
        };
        const editDeck = () => setStatus('build');
        const studyCardsReset = () => {
          setLevels(Array(cards.length).fill(0));
          setQueue(cards.map((_, i) => i));
          setDone(null);
          setStatus('study-cards');
        };

        window.addEventListener('study-cards', studyCards);
        window.addEventListener('study-quiz', studyQuiz);
        window.addEventListener('edit-deck', editDeck);
        window.addEventListener('study-cards-reset', studyCardsReset);

        return () => {
          window.removeEventListener('study-cards', studyCards);
          window.removeEventListener('study-quiz', studyQuiz);
          window.removeEventListener('edit-deck', editDeck);
          window.removeEventListener('study-cards-reset', studyCardsReset);
        };
      }, [cards, quizItems]);

      function clearDeck() {
        clearDeckStorage();
        setCards([]);
        setQuizItems([]);
        setLevels([]);
        setQueue([]);
        setQuizIndex(0);
        setQuizScore(0);
        setDone(null);
        setStatus('build');
      }

      function finishQuiz() {
        setStatus('quiz-results');
      }

      if (showNamePrompt) {
        return (
          <div className="wrap">
            <Header userName={userName} />
            <NamePrompt value={userName} onChange={setUserName} onSubmit={() => { if (userName.trim()) { save(KEYS.name, userName.trim()); setShowNamePrompt(false); } }} />
          </div>
        );
      }

      if (showSplash) {
        return (
          <div className="splash-overlay" aria-live="polite">
            <div className="splash-stack" aria-hidden="true">
              <div className="splash-card splash-card-1" />
              <div className="splash-card splash-card-2" />
              <div className="splash-card splash-card-3" />
            </div>
            <div className="splash-word">SabiKard</div>
          </div>
        );
      }

      if (status === 'study-cards') {
        return (
          <div className="wrap">
            <Header userName={userName} />
            <Flashcards cards={cards} levels={levels} setLevels={setLevels} queue={queue} setQueue={setQueue} done={done} setDone={setDone} />
          </div>
        );
      }

      if (status === 'study-quiz') {
        return (
          <div className="wrap">
            <Header userName={userName} />
            <Quiz items={quizItems} index={quizIndex} setIndex={setQuizIndex} score={quizScore} setScore={setQuizScore} finish={finishQuiz} />
          </div>
        );
      }

      if (status === 'quiz-results') {
        return (
          <div className="wrap">
            <Header userName={userName} />
            <div className="glass summary">
              <div className="subtitle">Quiz complete</div>
              <div className="summary-row">
                <div className="stat good">
                  <div className="stat-count">{quizScore}</div>
                  <div className="stat-label">correct</div>
                </div>
                <div className="stat review">
                  <div className="stat-count">{quizItems.length - quizScore}</div>
                  <div className="stat-label">missed</div>
                </div>
              </div>
              <div className="empty-note">{quizSummary(quizScore, quizItems.length)}</div>
              <div className="actions">
                <Button className="btn btn-primary" onClick={() => { setQuizIndex(0); setQuizScore(0); setStatus('study-quiz'); }}>Retake quiz</Button>
                <Button className="btn btn-ghost" onClick={() => setStatus('build')}>Edit deck</Button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="wrap">
          <Header userName={userName} />
          <Builder
            mode={mode}
            setMode={setMode}
            cards={cards}
            quizItems={quizItems}
            setCards={setCards}
            setQuizItems={setQuizItems}
            isPro={isPro}
            history={history}
            setHistory={setHistory}
          />
          <div className="row" style={{marginTop:16}}>
            <span />
            <Button className="btn btn-ghost" onClick={clearDeck}>Clear deck & start over</Button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
